<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>AR Sales Production</title>
  <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.49.1/dist/apexcharts.min.js"></script>
  <style>
    :root {
      --primary:#0f172a; --accent:#e94560; --green:#10b981; --red:#ef4444; --yellow:#f59e0b;
      --blue:#3b82f6; --purple:#8b5cf6; --orange:#f97316; --cyan:#06b6d4;
      --gray-50:#f8fafc; --gray-100:#f1f5f9; --gray-200:#e2e8f0; --gray-300:#cbd5e1;
      --gray-400:#94a3b8; --gray-500:#64748b; --gray-600:#475569; --gray-700:#334155;
      --gray-800:#1e293b; --gray-900:#0f172a;
      --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
      --shadow-lg:0 10px 25px -3px rgba(0,0,0,.1),0 4px 6px -2px rgba(0,0,0,.05);
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--gray-50);color:var(--gray-900);-webkit-font-smoothing:antialiased;min-height:100vh;}
    .container{max-width:1180px;margin:0 auto;padding:20px 16px 48px;}

    /* Identity screen */
    .identity{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
    .identity-card{background:white;border-radius:18px;padding:30px 26px;box-shadow:var(--shadow-lg);width:100%;max-width:460px;}
    .identity-title{font-size:23px;font-weight:800;margin-bottom:4px;}
    .identity-sub{color:var(--gray-500);font-size:14px;margin-bottom:22px;}
    .id-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--gray-600);margin:14px 0 8px;}
    .agent-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-height:300px;overflow-y:auto;padding:2px;}
    .agent-pick{padding:12px 14px;border:1.5px solid var(--gray-200);border-radius:10px;background:white;cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;text-align:left;color:var(--gray-700);transition:all .15s;}
    .agent-pick:hover{border-color:var(--primary);background:var(--gray-50);}
    .agent-pick .role{display:block;font-size:11px;font-weight:500;color:var(--gray-400);margin-top:1px;}
    .field-input,.field-select{width:100%;padding:12px 14px;border:1.5px solid var(--gray-300);border-radius:10px;font-size:15px;font-family:inherit;background:white;-webkit-appearance:none;}
    .field-input:focus,.field-select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(15,23,42,.1);}
    .btn{padding:12px 18px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .15s;}
    .btn:hover{opacity:.9;} .btn-primary{background:var(--primary);color:white;} .btn-ghost{background:var(--gray-100);color:var(--gray-700);} .btn-full{width:100%;}
    .login-error{background:#fef2f2;color:var(--accent);padding:10px 14px;border-radius:8px;font-size:13px;margin-top:12px;border:1px solid #fecaca;}
    .divider{display:flex;align-items:center;gap:10px;margin:18px 0;color:var(--gray-400);font-size:12px;font-weight:600;}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--gray-200);}

    /* Topbar */
    .topbar{background:white;border-bottom:1px solid var(--gray-200);padding:13px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;}
    .brand{display:flex;align-items:center;gap:11px;}
    .brand-mark{width:36px;height:36px;border-radius:9px;background:var(--primary);color:white;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;}
    .brand-text h1{font-size:15px;font-weight:700;letter-spacing:-.2px;}
    .brand-text small{font-size:11px;color:var(--gray-500);}
    .header-actions{display:flex;gap:8px;align-items:center;}
    .user-chip{padding:6px 13px;background:var(--gray-100);border-radius:999px;font-size:12px;font-weight:700;color:var(--gray-700);}

    /* Filters */
    .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px;}
    .filter-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--gray-500);}
    .filter-group{display:inline-flex;background:white;border:1px solid var(--gray-200);border-radius:10px;padding:3px;}
    .filter-tab{padding:7px 13px;font-size:13px;font-weight:600;border-radius:8px;cursor:pointer;color:var(--gray-500);border:none;background:transparent;font-family:inherit;transition:all .15s;}
    .filter-tab.active{background:var(--primary);color:white;}

    /* Personal hero */
    .hero{background:linear-gradient(135deg,#0f172a,#1e293b);color:white;border-radius:18px;padding:22px 24px;margin-bottom:18px;}
    .hero-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;}
    .hero-name{font-size:24px;font-weight:800;letter-spacing:-.3px;}
    .hero-role{font-size:12px;opacity:.7;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
    .hero-rank{text-align:right;}
    .hero-rank .pos{font-size:34px;font-weight:900;line-height:1;}
    .hero-rank .lbl{font-size:11px;opacity:.7;}
    .hero-funnel{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px;}
    .hero-stat{background:rgba(255,255,255,.08);border-radius:12px;padding:12px 14px;}
    .hero-stat .v{font-size:24px;font-weight:800;line-height:1;}
    .hero-stat .k{font-size:11px;opacity:.75;margin-top:3px;font-weight:600;}
    .hero-stat .c{font-size:10px;opacity:.6;margin-top:2px;}

    /* Funnel viz */
    .section-card{background:white;border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:16px;}
    .section-card h3{font-size:14px;font-weight:800;margin-bottom:3px;}
    .section-sub{font-size:12px;color:var(--gray-500);margin-bottom:14px;}
    .funnel-stage{display:grid;grid-template-columns:140px 1fr 90px;gap:12px;align-items:center;padding:7px 0;}
    .funnel-stage .name{font-size:13px;font-weight:600;color:var(--gray-700);}
    .funnel-stage .bar-track{background:var(--gray-100);height:26px;border-radius:7px;overflow:hidden;position:relative;}
    .funnel-stage .bar-fill{height:100%;border-radius:7px;display:flex;align-items:center;padding-left:10px;color:white;font-size:12px;font-weight:700;min-width:34px;transition:width .5s ease;}
    .funnel-stage .conv{font-size:11px;color:var(--gray-500);text-align:right;}
    .funnel-stage.pending{opacity:.45;}
    .funnel-stage.pending .bar-fill{background:repeating-linear-gradient(45deg,var(--gray-300),var(--gray-300) 6px,var(--gray-200) 6px,var(--gray-200) 12px)!important;color:var(--gray-600);}

    /* Ranking table */
    .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
    table{width:100%;border-collapse:collapse;font-size:13px;}
    th{text-align:left;padding:9px 8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--gray-500);border-bottom:1px solid var(--gray-200);white-space:nowrap;cursor:pointer;user-select:none;}
    th:hover{color:var(--gray-800);}
    td{padding:11px 8px;border-bottom:1px solid var(--gray-100);vertical-align:middle;white-space:nowrap;}
    tbody tr.me{background:#fffbeb;}
    tbody tr.me td:first-child{box-shadow:inset 3px 0 0 var(--yellow);}
    .rank-num{font-weight:800;color:var(--gray-400);width:28px;}
    .rank-num.top1{color:#f59e0b;} .rank-num.top2{color:#94a3b8;} .rank-num.top3{color:#d97706;}
    .agent-name-cell{font-weight:700;}
    .val-strong{font-weight:800;}
    .pct{font-size:12px;}
    .pct.good{color:var(--green);} .pct.mid{color:var(--yellow);} .pct.low{color:var(--red);}
    .empty{text-align:center;padding:36px 20px;color:var(--gray-400);font-size:13px;}
    .tabs{display:inline-flex;background:var(--gray-100);border-radius:11px;padding:4px;margin-bottom:14px;gap:2px;}
    .tab{padding:9px 18px;font-size:14px;font-weight:700;border-radius:8px;cursor:pointer;color:var(--gray-500);border:none;background:transparent;font-family:inherit;transition:all .15s;}
    .tab.active{background:var(--primary);color:white;}
    .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;}
    .pill.closer{background:#eff6ff;color:#1e40af;} .pill.setter{background:#f0fdf4;color:#065f46;}
    @media(max-width:640px){
      .hero-funnel{grid-template-columns:repeat(2,1fr);}
      .funnel-stage{grid-template-columns:100px 1fr 60px;}
      .agent-grid{grid-template-columns:1fr;}
    }
  </style>
</head>
<body>
  <!-- Identity / Login -->
  <div class="identity" id="screen-identity">
    <div class="identity-card">
      <div class="identity-title">Mi Producción</div>
      <div class="identity-sub">Auto Republic — equipo de ventas</div>
      <div class="id-label">Soy agente — elige tu nombre</div>
      <div class="agent-grid" id="agent-grid"><div class="empty">Cargando…</div></div>
      <div class="divider">o</div>
      <div class="id-label">Soy manager</div>
      <input type="password" id="mgr-pass" class="field-input" placeholder="Contraseña de manager" onkeydown="if(event.key==='Enter') managerLogin()">
      <button class="btn btn-ghost btn-full" style="margin-top:10px;" onclick="managerLogin()">Entrar como manager</button>
      <div class="login-error" id="login-error" style="display:none;"></div>
    </div>
  </div>

  <!-- App -->
  <div id="screen-app" style="display:none;">
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark">AR</div>
        <div class="brand-text"><h1>Producción de Ventas</h1><small id="last-refresh">—</small></div>
      </div>
      <div class="header-actions">
        <button class="btn btn-ghost" onclick="refresh()" title="Refrescar" style="padding:8px 12px;">↻</button>
        <div class="user-chip" id="user-chip">—</div>
        <button class="btn btn-ghost" onclick="logout()" style="padding:8px 12px;">✕</button>
      </div>
    </div>

    <div class="container">
      <div class="filters">
        <span class="filter-label">Periodo</span>
        <div class="filter-group" id="period-filter">
          <button class="filter-tab" data-period="mtd">Mes actual</button>
          <button class="filter-tab" data-period="30">Últ. 30d</button>
          <button class="filter-tab" data-period="qtd">Trimestre</button>
          <button class="filter-tab active" data-period="all">Todo</button>
        </div>
        <span class="filter-label" id="loc-filter-label">Locación</span>
        <div class="filter-group" id="loc-filter">
          <button class="filter-tab active" data-loc="all">Ambas</button>
          <button class="filter-tab" data-loc="Orlando">Orlando</button>
          <button class="filter-tab" data-loc="Kissimmee">Kissimmee</button>
        </div>
      </div>

      <!-- Personal hero (agent view) -->
      <div id="personal-hero"></div>

      <!-- Personal funnel (agent view) -->
      <div id="personal-funnel"></div>

      <!-- Ranking -->
      <div class="section-card">
        <div class="tabs" id="rank-tabs">
          <button class="tab active" data-rt="closer" onclick="setRankTab('closer')">Closers</button>
          <button class="tab" data-rt="setter" onclick="setRankTab('setter')">Setters</button>
        </div>
        <p class="section-sub" id="rank-sub">Ranking del equipo · click cualquier columna para ordenar</p>
        <div class="table-wrap">
          <table>
            <thead id="rank-head"></thead>
            <tbody id="rank-body"><tr><td class="empty">Cargando…</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPA_URL='https://xwxjutaqouaeocvxawlw.supabase.co';
    const SUPA_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh3eGp1dGFxb3VhZW9jdnhhd2x3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNTIxMzYsImV4cCI6MjA5MjYyODEzNn0.TOigRbaNL5z3Q7hd4llJyqrC6vZwn_-1R-5JudXtJmU';
    const SUPA_HEADERS={apikey:SUPA_ANON,Authorization:`Bearer ${SUPA_ANON}`,'Content-Type':'application/json'};

    let mode=null;          // 'agent' | 'manager'
    let identity=null;      // agent name or manager name
    let allReports=[];
    let agentsList={closers:[],setters:[]};
    let filterPeriod='all';
    let filterLoc='all';
    let rankTab='closer';
    let rankSort={key:'sold',dir:-1};

    document.addEventListener('DOMContentLoaded',async()=>{
      bindFilters();
      await loadAgents();
      // Restore session
      const saved=JSON.parse(localStorage.getItem('ar_prod_session')||'null');
      if(saved){mode=saved.mode;identity=saved.identity;enterApp();}
    });

    async function loadAgents(){
      try{
        const res=await fetch(`${SUPA_URL}/rest/v1/ar_agents?select=name,role,location&order=name.asc`,{headers:SUPA_HEADERS});
        const data=await res.json();
        const closerNames=[...new Set(data.filter(a=>a.role==='closer').map(a=>a.name))].sort();
        const setterNames=[...new Set(data.filter(a=>a.role==='setter').map(a=>a.name))].sort();
        agentsList={closers:closerNames,setters:setterNames};
        renderAgentGrid();
      }catch(e){document.getElementById('agent-grid').innerHTML='<div class="empty">Error cargando agentes</div>';}
    }

    function renderAgentGrid(){
      const all=[
        ...agentsList.closers.map(n=>({name:n,role:'Closer'})),
        ...agentsList.setters.map(n=>({name:n,role:'Setter'}))
      ];
      document.getElementById('agent-grid').innerHTML=all.map(a=>`
        <button class="agent-pick" onclick="agentLogin('${escapeAttr(a.name)}')">
          ${escapeHtml(a.name)}<span class="role">${a.role}</span>
        </button>
      `).join('');
    }

    function agentLogin(name){
      mode='agent';identity=name;
      localStorage.setItem('ar_prod_session',JSON.stringify({mode,identity}));
      enterApp();
    }

    async function managerLogin(){
      const pass=document.getElementById('mgr-pass').value;
      const err=document.getElementById('login-error');
      err.style.display='none';
      if(!pass){err.textContent='Escribe la contraseña';err.style.display='block';return;}
      try{
        const res=await fetch(`${SUPA_URL}/rest/v1/app_users?password=eq.${encodeURIComponent(pass)}&select=name,location_access`,{headers:SUPA_HEADERS});
        const d=await res.json();
        if(!d||!d.length){err.textContent='Contraseña incorrecta';err.style.display='block';return;}
        mode='manager';identity=d[0].name;
        localStorage.setItem('ar_prod_session',JSON.stringify({mode,identity}));
        enterApp();
      }catch(e){err.textContent='Error: '+e.message;err.style.display='block';}
    }

    function logout(){
      localStorage.removeItem('ar_prod_session');
      mode=null;identity=null;
      document.getElementById('screen-app').style.display='none';
      document.getElementById('screen-identity').style.display='flex';
      document.getElementById('mgr-pass').value='';
    }

    async function enterApp(){
      document.getElementById('screen-identity').style.display='none';
      document.getElementById('screen-app').style.display='';
      document.getElementById('user-chip').textContent=(mode==='manager'?'👔 ':'')+identity;
      // Agent view: hide location filter (their numbers span both)
      document.getElementById('loc-filter').style.display=mode==='manager'?'':'none';
      document.getElementById('loc-filter-label').style.display=mode==='manager'?'':'none';
      await refresh();
    }

    async function refresh(){
      try{
        const res=await fetch(`${SUPA_URL}/rest/v1/ar_daily_reports?select=date,location,visits&order=date.desc`,{headers:SUPA_HEADERS});
        allReports=await res.json();
        document.getElementById('last-refresh').textContent='Actualizado '+new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
        render();
      }catch(e){document.getElementById('rank-body').innerHTML=`<tr><td class="empty">Error: ${e.message}</td></tr>`;}
    }

    function bindFilters(){
      document.querySelectorAll('#period-filter .filter-tab').forEach(b=>b.addEventListener('click',()=>{
        document.querySelectorAll('#period-filter .filter-tab').forEach(x=>x.classList.remove('active'));
        b.classList.add('active');filterPeriod=b.dataset.period;render();
      }));
      document.querySelectorAll('#loc-filter .filter-tab').forEach(b=>b.addEventListener('click',()=>{
        document.querySelectorAll('#loc-filter .filter-tab').forEach(x=>x.classList.remove('active'));
        b.classList.add('active');filterLoc=b.dataset.loc;render();
      }));
    }

    function inPeriod(dateISO){
      if(filterPeriod==='all')return true;
      const d=new Date(dateISO+'T00:00:00');const now=new Date();
      if(filterPeriod==='mtd')return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();
      if(filterPeriod==='30'){const c=new Date();c.setDate(c.getDate()-30);return d>=c;}
      if(filterPeriod==='qtd'){const q=Math.floor(now.getMonth()/3);const qStart=new Date(now.getFullYear(),q*3,1);return d>=qStart;}
      return true;
    }

    function clean(s){if(!s)return null;const t=String(s).trim();return ['','n/a','na','—','-'].includes(t.toLowerCase())?null:t;}

    // Build per-agent stats from Sales Report
    function buildStats(){
      const reports=allReports.filter(r=>inPeriod(r.date)&&(filterLoc==='all'||r.location===filterLoc));
      const closers={};const setters={};
      const ensureC=n=>closers[n]||(closers[n]={name:n,visits:0,applied:0,approved:0,denied:0,sold:0,selfgen:0});
      const ensureS=n=>setters[n]||(setters[n]={name:n,visits:0,applied:0,approved:0,sold:0});
      reports.forEach(r=>{
        (r.visits||[]).forEach(v=>{
          const c1=clean(v.closer),c2=clean(v.closer2),st=clean(v.setter);
          [c1,c2].forEach(c=>{if(!c)return;const o=ensureC(c);o.visits++;
            if(v.applied===true)o.applied++;
            if(v.result==='approved')o.approved++;
            if(v.result==='denied')o.denied++;});
          if(v.sale===true){
            if(c1&&c2){ensureC(c1).sold+=0.5;ensureC(c2).sold+=0.5;
              if(v.subgen===true||v.scheduled_by==='Self-gen'){ensureC(c1).selfgen+=0.5;ensureC(c2).selfgen+=0.5;}}
            else if(c1){ensureC(c1).sold+=1;if(v.subgen===true||v.scheduled_by==='Self-gen')ensureC(c1).selfgen+=1;}
            else if(c2){ensureC(c2).sold+=1;if(v.subgen===true||v.scheduled_by==='Self-gen')ensureC(c2).selfgen+=1;}
          }
          if(st){const o=ensureS(st);o.visits++;
            if(v.applied===true)o.applied++;
            if(v.result==='approved')o.approved++;
            if(v.sale===true)o.sold++;}
        });
      });
      return {closers:Object.values(closers),setters:Object.values(setters)};
    }

    function fmtShare(x){return Number.isInteger(x)?String(x):x.toFixed(1);}
    function pct(n,d){return d>0?(n/d*100):0;}
    function pctClass(v,good,mid){return v>=good?'good':v>=mid?'mid':'low';}

    function render(){
      const stats=buildStats();
      renderPersonal(stats);
      renderRanking(stats);
    }

    function renderPersonal(stats){
      const heroHost=document.getElementById('personal-hero');
      const funnelHost=document.getElementById('personal-funnel');
      if(mode!=='agent'){heroHost.innerHTML='';funnelHost.innerHTML='';return;}
      // Find my stats — could be closer or setter
      const myCloser=stats.closers.find(c=>c.name===identity);
      const mySetter=stats.setters.find(s=>s.name===identity);
      const primary=myCloser||mySetter;
      const role=myCloser?'Closer':(mySetter?'Setter':'—');
      if(!primary){
        heroHost.innerHTML=`<div class="hero"><div class="hero-name">${escapeHtml(identity)}</div><div class="hero-role">${role}</div><div style="margin-top:14px;opacity:.7;">Sin producción en este periodo</div></div>`;
        funnelHost.innerHTML='';return;
      }
      // Ranking position (by sold) among same role
      const pool=myCloser?stats.closers:stats.setters;
      const sorted=[...pool].sort((a,b)=>b.sold-a.sold);
      const pos=sorted.findIndex(x=>x.name===identity)+1;
      const sold=myCloser?myCloser.sold:mySetter.sold;
      const visits=primary.visits, applied=primary.applied||0, approved=primary.approved||0;

      heroHost.innerHTML=`
        <div class="hero">
          <div class="hero-top">
            <div><div class="hero-name">${escapeHtml(identity)}</div><div class="hero-role">${role} · ${periodLabel()}</div></div>
            <div class="hero-rank"><div class="pos">#${pos}</div><div class="lbl">de ${pool.length} ${myCloser?'closers':'setters'}</div></div>
          </div>
          <div class="hero-funnel">
            <div class="hero-stat"><div class="v">${visits}</div><div class="k">Visitas</div></div>
            <div class="hero-stat"><div class="v">${applied}</div><div class="k">Aplicaron</div><div class="c">${pct(applied,visits).toFixed(0)}% de visitas</div></div>
            <div class="hero-stat"><div class="v">${approved}</div><div class="k">Aprobados</div><div class="c">${pct(approved,applied).toFixed(0)}% de aplicaron</div></div>
            <div class="hero-stat"><div class="v" style="color:#34d399;">${fmtShare(sold)}</div><div class="k">Ventas</div><div class="c">${pct(sold,approved).toFixed(0)}% close rate</div></div>
          </div>
        </div>`;

      // Funnel viz with pending top stages
      const stages=[
        {name:'Llamadas',val:null,pending:true},
        {name:'Conversaciones',val:null,pending:true},
        {name:'Citas agendadas',val:null,pending:true},
        {name:'Visitas',val:visits,conv:null,color:'#3b82f6'},
        {name:'Aplicaron',val:applied,conv:pct(applied,visits),color:'#06b6d4'},
        {name:'Aprobados',val:approved,conv:pct(approved,applied),color:'#8b5cf6'},
        {name:'Ventas',val:sold,conv:pct(sold,approved),color:'#10b981'}
      ];
      const maxVal=Math.max(visits,1);
      funnelHost.innerHTML=`
        <div class="section-card">
          <h3>Tu embudo de conversión</h3>
          <p class="section-sub">El tope del embudo (llamadas, conversaciones, citas) se conectará desde el CRM próximamente</p>
          ${stages.map(s=>{
            if(s.pending)return `<div class="funnel-stage pending"><div class="name">${s.name}</div><div class="bar-track"><div class="bar-fill" style="width:30%;">Próximamente</div></div><div class="conv">CRM</div></div>`;
            const w=Math.max(pct(s.val,maxVal),5);
            return `<div class="funnel-stage"><div class="name">${s.name}</div><div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${s.color};">${fmtShare(s.val)}</div></div><div class="conv">${s.conv!==null?'↓ '+s.conv.toFixed(0)+'%':''}</div></div>`;
          }).join('')}
        </div>`;
    }

    function periodLabel(){
      return {mtd:'Mes actual',30:'Últimos 30 días',qtd:'Este trimestre',all:'Todo el tiempo'}[filterPeriod];
    }

    function setRankTab(t){rankTab=t;rankSort={key:'sold',dir:-1};
      document.querySelectorAll('#rank-tabs .tab').forEach(b=>b.classList.toggle('active',b.dataset.rt===t));
      render();}

    function sortBy(key){
      if(rankSort.key===key)rankSort.dir*=-1;else{rankSort.key=key;rankSort.dir=-1;}
      renderRanking(buildStats());
    }

    function renderRanking(stats){
      const pool=rankTab==='closer'?stats.closers:stats.setters;
      const head=document.getElementById('rank-head');
      const body=document.getElementById('rank-body');
      document.getElementById('rank-sub').textContent=
        (mode==='agent'?'Tu fila está resaltada · ':'')+'Click cualquier columna para ordenar';

      if(rankTab==='closer'){
        head.innerHTML=`<tr>
          <th>#</th><th onclick="sortBy('name')">Closer</th>
          <th onclick="sortBy('visits')">Visitas</th>
          <th onclick="sortBy('applied')">Aplic.</th>
          <th onclick="sortBy('approved')">Aprob.</th>
          <th onclick="sortBy('sold')">Ventas</th>
          <th onclick="sortBy('closeRate')">Close%</th>
          <th onclick="sortBy('v2s')">Vis→Venta</th>
          <th onclick="sortBy('selfgen')">Self-gen</th>
        </tr>`;
      }else{
        head.innerHTML=`<tr>
          <th>#</th><th onclick="sortBy('name')">Setter</th>
          <th onclick="sortBy('visits')">Visitas traídas</th>
          <th onclick="sortBy('sold')">Ventas</th>
          <th onclick="sortBy('v2s')">Vis→Venta</th>
        </tr>`;
      }

      // Compute derived metrics
      pool.forEach(a=>{
        a.closeRate=pct(a.sold,a.approved||0);
        a.v2s=pct(a.sold,a.visits);
      });
      const sorted=[...pool].sort((a,b)=>{
        let av=a[rankSort.key],bv=b[rankSort.key];
        if(rankSort.key==='name')return rankSort.dir*String(av).localeCompare(String(bv));
        return rankSort.dir*((av||0)-(bv||0));
      }).filter(a=>a.visits>0||a.sold>0);

      if(!sorted.length){body.innerHTML='<tr><td class="empty" colspan="9">Sin datos en este periodo</td></tr>';return;}

      body.innerHTML=sorted.map((a,i)=>{
        const isMe=mode==='agent'&&a.name===identity;
        const rankCls=i===0?'top1':i===1?'top2':i===2?'top3':'';
        if(rankTab==='closer'){
          return `<tr class="${isMe?'me':''}">
            <td class="rank-num ${rankCls}">${i+1}</td>
            <td class="agent-name-cell">${escapeHtml(a.name)}${isMe?' 👈':''}</td>
            <td>${a.visits}</td>
            <td>${a.applied}</td>
            <td>${a.approved}</td>
            <td class="val-strong">${fmtShare(a.sold)}</td>
            <td class="pct ${pctClass(a.closeRate,75,50)}">${a.closeRate.toFixed(0)}%</td>
            <td class="pct ${pctClass(a.v2s,20,10)}">${a.v2s.toFixed(0)}%</td>
            <td>${fmtShare(a.selfgen)}</td>
          </tr>`;
        }else{
          return `<tr class="${isMe?'me':''}">
            <td class="rank-num ${rankCls}">${i+1}</td>
            <td class="agent-name-cell">${escapeHtml(a.name)}${isMe?' 👈':''}</td>
            <td>${a.visits}</td>
            <td class="val-strong">${a.sold}</td>
            <td class="pct ${pctClass(a.v2s,20,10)}">${a.v2s.toFixed(0)}%</td>
          </tr>`;
        }
      }).join('');
    }

    function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    function escapeAttr(s){return String(s??'').replace(/'/g,"\\'").replace(/"/g,'&quot;');}
  </script>
</body>
</html>
