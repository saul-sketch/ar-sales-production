        ${efPctCell(o.vend,o.visitas,20)}
        <td style="text-align:right;color:var(--green);font-weight:700;">${o.monto?fmtMoney(o.monto):'—'}</td>`;
      const head=`<tr>
        <th>${mode==='equipo'?'Equipo':'Vendedor'}</th>
        <th style="text-align:right;">📞</th><th style="text-align:right;">💬</th><th style="text-align:right;">⏱min</th><th style="text-align:right;">✉SMS</th>
        <th style="text-align:right;">📅cita</th><th style="text-align:right;">🚶vis</th>
        <th style="text-align:center;">Aplicó ${tip('Aplicó ÷ visitas. Meta 70-80%. Si baja: no calificó bien por teléfono o no lo trabajaron en piso.')}</th>
        <th style="text-align:center;">Negó ${tip('Aprobados negados. Muchos = tráfico basura / mala prospección.')}</th>
        <th style="text-align:center;">Cierre ${tip('Ventas ÷ aprobados. Meta 70-80%.')}</th>
        <th style="text-align:center;">Vis→Venta ${tip('Ventas ÷ visitas. Meta 20-30%.')}</th>
        <th style="text-align:right;">Monto</th>
      </tr>`;

      let mainTable='';
      if(mode==='equipo'){
        const T={}; ['cc','orlando','kissimmee','sin'].forEach(t=>T[t]={name:efTeamLabel(t==='sin'?null:t),n:0,calls:0,contacts:0,minutes:0,sms:0,citas:0,visitas:0,aplico:0,noAplico:0,aprob:0,neg:0,vend:0,monto:0});
        people.forEach(o=>{const t=o.team||'sin';const a=T[t];a.n++;['calls','contacts','minutes','sms','citas','visitas','aplico','noAplico','aprob','neg','vend','monto'].forEach(f=>a[f]+=o[f]);});
        const order=['cc','orlando','kissimmee','sin'];
        const trs=order.filter(t=>T[t].n>0).map(t=>{const a=T[t];const col=t==='cc'?'#3b82f6':t==='orlando'?'#f97316':t==='kissimmee'?'#8b5cf6':'#94a3b8';
          return `<tr class="clickable-row" onclick="setEfMode('individual')" style="border-left:3px solid ${col};">
            <td style="font-weight:800;">${a.name} <span style="font-weight:500;color:var(--gray-400);font-size:11px;">· ${a.n}</span></td>${funnelCells(a)}</tr>`;}).join('');
        mainTable=`<div class="section-card"><p class="section-sub">Cada equipo, embudo completo. Toca una fila para ver a su gente.</p>
          <div class="table-wrap"><table><thead>${head}</thead><tbody>${trs||'<tr><td colspan="12" class="empty">Sin data</td></tr>'}</tbody></table></div></div>`;
      } else {
        const rows=people.filter(o=>o.visitas>0||o.calls>0).sort((a,b)=>b.vend-a.vend||b.visitas-a.visitas).map(o=>`
          <tr class="clickable-row" onclick="goProfile('${escapeAttr(o.name)}','close')">
            <td><span style="color:var(--blue);text-decoration:underline;text-underline-offset:2px;">${escapeHtml(o.name)}</span><div style="font-size:10px;color:var(--gray-400);">${efTeamLabel(o.team)}</div></td>
            ${funnelCells(o)}</tr>`).join('');
        mainTable=`<div class="section-card"><p class="section-sub">Cada vendedor, embudo completo de arriba a abajo. Toca para ver su perfil.</p>
          <div class="table-wrap"><table><thead>${head}</thead><tbody>${rows||'<tr><td colspan="12" class="empty">Sin data</td></tr>'}</tbody></table></div></div>`;
      }

      const chCard=CH.map(ch=>{const d=chStat[ch]; if(!d.visits) return ''; const color=ch==='Self-gen'?'#10b981':ch==='Call Center'?'#3b82f6':'#f97316';
        return `<div class="section-card" style="border-top:3px solid ${color};"><h3>${ch} <span style="font-weight:600;color:var(--gray-400);font-size:13px;">· ${d.visits} visitas</span></h3>
          <div class="table-wrap"><table><thead><tr><th>Visitas</th><th style="text-align:center;">Aplicó</th><th style="text-align:center;">Cierre</th><th style="text-align:center;">Vis→Venta</th><th style="text-align:right;">Monto</th></tr></thead>
          <tbody><tr><td style="font-weight:800;font-size:16px;">${d.visits}</td>${efPctCell(d.applied,d.visits,70)}${efPctCell(d.sold,d.approved,70)}${efPctCell(d.sold,d.visits,20)}<td style="text-align:right;font-weight:700;color:var(--green);">${fmtMoney(d.profit)}</td></tr></tbody></table></div></div>`;}).join('');

      // Propio vs de piso
      const ppl=people.filter(c=>c.pv+c.tv>0).sort((a,b)=>(b.ps+b.ts)-(a.ps+a.ts));
      const ppRows=ppl.map(c=>{const prC=c.pv>0?efColor(c.ps/c.pv*100,20):'var(--gray-300)';const trC=c.tv>0?efColor(c.ts/c.tv*100,20):'var(--gray-300)';
        return `<tr class="clickable-row" onclick="goProfile('${escapeAttr(c.name)}','close')">
          <td><span style="color:var(--blue);text-decoration:underline;">${escapeHtml(c.name)}</span></td>
          <td style="text-align:center;">${c.pv||'—'}</td><td style="text-align:center;"><span style="font-weight:800;color:${prC};">${c.pv>0?(c.ps/c.pv*100).toFixed(0)+'%':'—'}</span></td>
          <td style="text-align:center;">${c.tv||'—'}</td><td style="text-align:center;"><span style="font-weight:800;color:${trC};">${c.tv>0?(c.ts/c.tv*100).toFixed(0)+'%':'—'}</span></td>
          <td style="text-align:right;font-weight:700;">${fmtShare(c.ps+c.ts)}</td></tr>`;}).join('');

      const tabBtn=(m,l)=>`<button onclick="setEfMode('${m}')" style="padding:8px 16px;border-radius:9px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;border:1px solid ${mode===m?'var(--primary)':'var(--gray-200)'};background:${mode===m?'var(--primary)':'white'};color:${mode===m?'white':'var(--gray-600)'};">${l}</button>`;

      document.getElementById('main-content').innerHTML=`
        <div class="page-title">🎯 Efectividad</div>
        <div class="page-sub">Embudo completo · ${periodLabel()}${filterLoc!=='all'?' · '+filterLoc:''} · semáforo vs tus umbrales</div>
        <div style="display:flex;gap:8px;margin-bottom:12px;">${tabBtn('equipo','Por equipo')}${tabBtn('individual','Por individual')}</div>
        <div class="section-card" style="border:1.5px solid #bfdbfe;background:#eff6ff;">
          <p style="margin:0;font-size:13px;color:#1e40af;">🟢 cumple meta · 🟡 cerca · 🔴 bajo. Metas: <b>Aplicó 70-80%</b> · <b>Cierre 70-80%</b> · <b>Visita→Venta 20-30%</b>. La columna <b>Negó</b> te dice si el problema es tráfico basura y no cierre.</p>
        </div>
        ${mainTable}
        <div style="font-size:15px;font-weight:800;margin:14px 0 4px;color:var(--gray-700);">Conversión por origen (equipo)</div>
        ${chCard || '<div class="section-card"><div class="empty">Sin visitas</div></div>'}
        <div style="font-size:15px;font-weight:800;margin:14px 0 4px;color:var(--gray-700);">Cliente propio vs de piso</div>
        <div class="section-card">
          <p class="section-sub"><b>Propio</b> = self-gen que él trajo (producción personal). <b>De piso</b> = traído por otros que él cerró (cierre puro).</p>
          <div class="table-wrap"><table><thead><tr><th>Vendedor</th><th style="text-align:center;">Propio</th><th style="text-align:center;">% venta propio</th><th style="text-align:center;">De piso</th><th style="text-align:center;">% venta piso</th><th style="text-align:right;">Ventas</th></tr></thead>
          <tbody>${ppRows||'<tr><td colspan="6" class="empty">Sin data</td></tr>'}</tbody></table></div>
        </div>`;
    }

    function renderMgmtView(s){
      const domLoc=closerDominantLoc();
      const at=window._agentTeam||{};
      let missing=0;
      const teamOf=(name,role)=>{
        const k=(name||'').toLowerCase();
        if(window._teamMap[k])return window._teamMap[k];   // override manual si existe
        if(at[k])return at[k];                             // equipo real (ar_agents: role+location)
        missing++;                                          // sin etiqueta → cae en preliminar
        if(role==='setter')return 'cc';
        return domLoc[k]||'orlando';
      };
      const prospectByName={};s.prospect.forEach(p=>prospectByName[p.name.toLowerCase()]=p);
      const closeByName={};s.close.forEach(c=>closeByName[c.name.toLowerCase()]=c);
      const dialer=window._dialerByAgent||{};
      const buckets={cc:[],orlando:[],kissimmee:[]};
      teamList().forEach(t=>{
        const k=t.name.toLowerCase();
        const bucket=teamOf(t.name,t.role);
        const d=dialer[k]||{calls:0,appointments:0};
        const facet=(bucket==='cc')?(prospectByName[k]||{}):(closeByName[k]||{});
        buckets[bucket].push({name:t.name,role:t.role,facet:t.facet,calls:d.calls||0,appts:d.appointments||0,visits:facet.visits||0,sold:facet.sold||0,profit:facet.profit||0});
      });
      const card=(title,ico,color,rows)=>{
        const tot=rows.reduce((a,r)=>({calls:a.calls+r.calls,appts:a.appts+r.appts,visits:a.visits+r.visits,sold:a.sold+r.sold,profit:a.profit+r.profit}),{calls:0,appts:0,visits:0,sold:0,profit:0});
        rows.sort((a,b)=>b.sold-a.sold||b.calls-a.calls);
        const bodyT=rows.length?`<div class="table-wrap"><table><thead><tr><th>Nombre</th><th style="text-align:right;">📞</th><th style="text-align:right;">📅</th><th style="text-align:right;">🚶</th><th style="text-align:right;">🏆</th><th style="text-align:right;">Monto</th></tr></thead><tbody>
          ${rows.map(r=>`<tr class="clickable-row" onclick="goProfile('${escapeAttr(r.name)}','${r.facet}')">
            <td><span style="color:var(--blue);text-decoration:underline;text-underline-offset:2px;">${escapeHtml(r.name)}</span></td>
            <td style="text-align:right;">${r.calls.toLocaleString('en-US')}</td>
            <td style="text-align:right;">${r.appts}</td>
            <td style="text-align:right;">${r.visits}</td>
            <td style="text-align:right;font-weight:700;">${fmtShare(r.sold)}</td>
            <td style="text-align:right;color:var(--green);font-weight:700;">${r.profit?fmtMoney(r.profit):'—'}</td></tr>`).join('')}
          <tr style="border-top:2px solid var(--gray-200);font-weight:800;"><td>Total (${rows.length})</td><td style="text-align:right;">${tot.calls.toLocaleString('en-US')}</td><td style="text-align:right;">${tot.appts}</td><td style="text-align:right;">${tot.visits}</td><td style="text-align:right;">${fmtShare(tot.sold)}</td><td style="text-align:right;color:var(--green);">${fmtMoney(tot.profit)}</td></tr>
          </tbody></table></div>`:'<div class="empty">Sin gente en este equipo (para este periodo/locación)</div>';
        return `<div class="section-card" style="border-top:3px solid ${color};"><h3>${ico} ${title} <span style="font-weight:600;color:var(--gray-400);font-size:13px;">· ${rows.length}</span></h3>${bodyT}</div>`;
      };
      document.getElementById('main-content').innerHTML=`
        <div class="page-title">🗂️ Management View</div>
        <div class="page-sub">Producción separada por equipo · ${periodLabel()}${filterLoc!=='all'?' · '+filterLoc:''} · toca a una persona para su perfil</div>
        ${missing?`<div class="section-card" style="border:1.5px solid #fde68a;background:#fffbeb;">
          <p style="margin:0;font-size:13px;color:#92400e;">⚠️ ${missing} persona(s) sin equipo asignado en el WaveDialer todavía. Etiquétalas en el <b>team management del WaveDialer</b> (Call Center / Closers Orlando / Closers Kissimmee) y caen solas en su grupo.</p>

          <p style="margin:0;font-size:13px;color:#166534;">✅ Equipos según las etiquetas reales del WaveDialer.</p>
        </div>`}
        ${card('Call Center','📞','#3b82f6',buckets.cc)}
        ${card('Closers Orlando','🎯','#f97316',buckets.orlando)}
        ${card('Closers Kissimmee','🎯','#8b5cf6',buckets.kissimmee)}`;
    }

    function globalFunnel(t,days){
      const d=v=>days>0?v/days:0;
      const fmtAvg=v=>v>=10?Math.round(v).toLocaleString('en-US'):v.toFixed(1);
      const stages=[{name:'Llamadas',val:d(t.calls),color:'#0ea5e9'},{name:'Citas',val:d(t.appts),color:'#6366f1',conv:pct(t.visits,t.appts),convLbl:'show'},
        {name:'Visitas',val:d(t.visits),color:'#3b82f6'},{name:'Aplicaron',val:d(t.applied),color:'#06b6d4',conv:pct(t.applied,t.visits)},
        {name:'Aprobados',val:d(t.approved),color:'#8b5cf6',conv:pct(t.approved,t.applied)},{name:'Ventas',val:d(t.sold),color:'#10b981',conv:pct(t.sold,t.approved)}];
      const max=Math.max(d(t.calls),d(t.visits),1);
      return `<div class="section-card"><h3>Embudo — promedio por día</h3><p class="section-sub">Cómo se ve un día típico del equipo · ${days} días con actividad en el período</p>
        ${stages.map(st=>{const w=Math.max(pct(st.val,max),3);return `<div class="funnel-stage"><div class="name">${st.name}</div><div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${st.color};">${fmtAvg(st.val)}</div></div><div class="conv">${st.conv!==undefined?(st.convLbl?st.convLbl+' ':'↓')+st.conv.toFixed(0)+'%':''}</div></div>`;}).join('')}
        <div style="margin-top:12px;padding-top:10px;border-top:1px dashed var(--gray-200);font-size:13px;color:var(--gray-600);">Total del período: <b>${fmtShare(t.sold)} ventas</b> · <b style="color:var(--green);">${fmtMoney(t.profit)}</b></div></div>`;
    }
    function miniLeaderboard(title,rows,facet){
      if(!rows.length)return `<div class="section-card"><h3>${title}</h3><div class="empty">Sin datos</div></div>`;
      return `<div class="section-card"><h3>${title}</h3>
        <div class="table-wrap"><table><thead><tr><th>#</th><th>Nombre</th><th>Visitas</th><th>Ventas</th><th>Monto</th><th></th></tr></thead>
        <tbody>${rows.map((a,i)=>`<tr class="clickable-row" onclick="goProfile('${escapeAttr(a.name)}','${facet}')">
          <td class="rank-num ${i===0?'top1':i===1?'top2':i===2?'top3':''}">${i+1}</td>
          <td class="agent-name-cell"><span style="color:var(--blue);text-decoration:underline;text-underline-offset:2px;">${escapeHtml(a.name)}</span></td>
          <td>${a.visits}</td><td class="val-strong">${fmtShare(a.sold)}</td><td>${fmtMoney(a.profit)}</td>
          <td style="color:var(--blue);font-weight:800;">›</td></tr>`).join('')}</tbody></table></div></div>`;
    }
    function renderGlobal(s){
      const t=teamTotals(s);
      const topClosers=[...s.close].sort((a,b)=>b.sold-a.sold).slice(0,5);
      const topSetters=[...s.prospect].sort((a,b)=>b.sold-a.sold).slice(0,5);
      const rec=(window._recon||[]).filter(r=>inPeriod(r.recon_date));
      const recShow=rec.reduce((a,r)=>a+(r.showed_count||0),0),recMatch=rec.reduce((a,r)=>a+(r.matched||0),0),recCalOnly=rec.reduce((a,r)=>a+(r.calendar_only||0),0);
      const recMr=recShow>0?(recMatch/recShow*100):0;
      const days=activeDaysInPeriod();
      let html=`<div class="page-title">Visión global</div>
        <div class="page-sub">Todo el equipo · ${periodLabel()}${filterLoc!=='all'?' · '+filterLoc:''} · ${days} días con actividad</div>
        <div class="kpi-row">
          ${kpiCard('📞','Llamadas/día',perDay(t.calls,days).toLocaleString('en-US'),'#0ea5e9',t.calls.toLocaleString('en-US')+' en total',"openKpiDrill('calls')")}
          ${kpiCard('📅','Citas/día',perDay(t.appts,days),'#6366f1',t.appts+' en total',"openKpiDrill('appts')")}
          ${kpiCard('🚶','Visitas',t.visits,'#3b82f6',perDay(t.visits,days)+'/día',"openKpiDrill('visits')")}
          ${kpiCard('✅','Aprobados',t.approved,'#8b5cf6',null,"openKpiDrill('approved')")}
          ${kpiCard('🏆','Ventas',fmtShare(t.sold),'#10b981',(days?(t.sold/days).toFixed(1):0)+'/día',"openKpiDrill('sold')")}
          ${kpiCard('💵','Monto',fmtMoney(t.profit),'#059669',null,"openKpiDrill('monto')")}
        </div>${globalFunnel(t,days)}
        ${miniLeaderboard('Top closers',topClosers,'close')}
        ${miniLeaderboard('Top setters',topSetters,'prospect')}
        <div class="section-card" style="border:1.5px solid #bfdbfe;">
          <h3>🔗 Reconciliación — resumen ${tip('Cruce diario entre las citas que el calendario de GHL marca como llegadas (showed) y las visitas que reportan los managers. Si no cuadran, alguien no registró bien.')}</h3>
          <p class="section-sub">Cuántas citas del calendario cuadran con las visitas reportadas.</p>
          <div class="kpi-row">
            ${kpiCard('🎯','Match promedio',recMr.toFixed(0)+'%','#3b82f6')}
            ${kpiCard('✅','Cuadran',recMatch,'#10b981')}
            ${kpiCard('⚠️','Llegó sin reporte',recCalOnly,'#ef4444')}

          <td style="color:var(--orange);font-weight:600;">${r.report_only||0}</td>

        <div class="kpi-row">
          ${kpiCard('🎯','Match promedio '+tip('De las citas que el calendario marcó como llegadas (showed), qué % también aparece como visita en el reporte del manager. 100% = todo cuadra.'),avgMr.toFixed(0)+'%','#3b82f6')}
          ${kpiCard('✅','Cuadran '+tip('Citas que el calendario marca llegadas Y el manager reportó como visita. Todo bien registrado.'),totMatch,'#10b981')}
          ${kpiCard('⚠️','Llegó sin reporte '+tip('El calendario dice que el cliente llegó, pero el manager NO lo reportó como visita. Es producción que no quedó registrada.'),totCalOnly,'#ef4444')}
          ${kpiCard('📝','Reporte sin cita '+tip('El manager reportó una visita, pero no hay una cita marcada como llegada en el calendario. Suele ser walk-in o cita no actualizada.'),totRepOnly,'#f97316')}
        </div>
        <div class="section-card">
          <p class="section-sub">Cada día, desde ayer hacia atrás. Toca el <b>?</b> de cada columna para ver qué significa.</p>

            <thead><tr>
              <th>Día</th>
              <th>Showed 📅 ${tip('Citas que el calendario de GHL marca como que el cliente SÍ llegó ese día.')}</th>
              <th>Reporte 👔 ${tip('Visitas que el manager escribió en el reporte de ventas ese día.')}</th>
              <th>Cuadran ${tip('Coinciden por teléfono: misma persona en el calendario y en el reporte.')}</th>
              <th>Match% ${tip('Cuadran ÷ Showed. Qué tan bien el reporte refleja lo que el calendario dice.')}</th>
              <th>Cal. solo ⚠ ${tip('Llegaron según el calendario pero NO se reportaron. Debajo salen los nombres.')}</th>
              <th>Rep. solo ${tip('Reportados como visita pero sin cita marcada (walk-in o cita no actualizada).')}</th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table></div>

    function periodLabel(){
      if(/^\d{4}-\d{2}$/.test(filterPeriod)){const[y,m]=filterPeriod.split('-');return `${MONTHS[+m-1]} ${y}`;}
      if(filterPeriod.startsWith('last:'))return `Últimos ${filterPeriod.slice(5)} días`;
      if(filterPeriod.startsWith('range:')){const p=filterPeriod.split(':');return `${p[1]} a ${p[2]}`;}
      return {mtd:'Mes actual',30:'Últimos 30 días',qtd:'Este trimestre',all:'Todo el tiempo'}[filterPeriod]||filterPeriod;
    }

    function renderPersonal(s){
      const host=document.getElementById('personal');
      if(me.role==='manager'){host.innerHTML='';return;}
      const myClose=s.close.find(c=>c.name.toLowerCase()===me.name.toLowerCase());

      const isCloser=me.role==='closer'||(myClose&&!myProspect);
      // Ranking position
      const closeSorted=[...s.close].sort((a,b)=>b.sold-a.sold);
      const prospSorted=[...s.prospect].sort((a,b)=>b.sold-a.sold);
      const closePos=myClose?closeSorted.findIndex(x=>x.name===myClose.name)+1:0;
      const prospPos=myProspect?prospSorted.findIndex(x=>x.name===myProspect.name)+1:0;

      let html='';
      // HERO — primary faceta
      const primary=isCloser?(myClose||{visits:0,applied:0,approved:0,sold:0}):(myProspect||{visits:0,applied:0,approved:0,sold:0,profit:0});
      const primaryPos=isCloser?closePos:prospPos;
      const poolN=isCloser?s.close.length:s.prospect.length;
      html+=`
        <div class="hero">
          <div class="hero-top">
            <div><div class="hero-name">${escapeHtml(me.name)}</div><div class="hero-role">${isCloser?'Closer':'Setter'} · ${periodLabel()}</div></div>
            <div class="hero-rank"><div class="pos">#${primaryPos||'—'}</div><div class="lbl">de ${poolN} ${isCloser?'closers':'setters'}</div></div>
          </div>
          <div class="hero-kpis">
            <div class="hero-stat"><div class="v">${primary.visits}</div><div class="k">${isCloser?'Visitas atendidas':'Visitas traídas'}</div></div>
            <div class="hero-stat"><div class="v">${primary.applied}</div><div class="k">Aplicaron</div><div class="c">${pct(primary.applied,primary.visits).toFixed(0)}%</div></div>
            <div class="hero-stat"><div class="v">${primary.approved}</div><div class="k">Aprobados</div><div class="c">${pct(primary.approved,primary.applied).toFixed(0)}%</div></div>
            <div class="hero-stat"><div class="v" style="color:#34d399;">${fmtShare(primary.sold)}</div><div class="k">Ventas</div><div class="c">${pct(primary.sold,primary.approved).toFixed(0)}% cierre</div></div>
          ${(()=>{const _p=projectedSales(primary.sold);if(!_p)return '';return `<div class="hero-stat"><div class="v" style="color:#fbbf24;">${_p.proj}</div><div class="k">Proyección mes</div><div class="c">día ${_p.elapsed}/${_p.total}</div></div>`;})()}
          </div>
          <button class="hero-cta" onclick="openMyDetail()">Ver mi producción completa →</button>
        </div>`;

      // CLOSER → cierre funnel + prospección propia
      if(isCloser&&myClose){
        html+=funnelCard('Tu cierre',myClose,'close','Visitas que atendiste (propias, de setters y walk-ins)',me.name);
        html+=convCard(myClose,'close');
        const prosp=myProspect||{name:me.name,visits:0,applied:0,approved:0,sold:0,profit:0};
        html+=funnelCard('Tu prospección',prosp,'prospect','Tus llamadas, citas y visitas self-gen',me.name);
      }
      // SETTER → prospección funnel + qué closers atendieron
      if(!isCloser){
        const prosp=myProspect||{name:me.name,visits:0,applied:0,approved:0,sold:0,profit:0};
        html+=funnelCard('Tu prospección',prosp,'prospect','Llamadas, citas, visitas que trajiste y su conversión',me.name);
        if(myProspect)html+=convCard(myProspect,'prospect');
        html+=closersForSetter(s.reports,me.name);
      }
      // Self-report (accountability) — agent declares what they think they did vs the truth
      html+=selfReportCard();
      host.innerHTML=html;
      // Render any charts queued
      drawQueuedCharts();

    // ===== Self-report: agent declares, system compares to truth =====
    function todayISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}

    function selfReportCard(){
      const today=todayISO();
      const mine=(window._selfReports||[]).find(s=>s.agent_name&&s.agent_name.toLowerCase()===me.name.toLowerCase()&&s.report_date===today);
      // Truth for TODAY (dialer live + today's Sales Report)
      const dl=dialerFor(me.name);
      const todayReports=allReports.filter(r=>r.date===today&&(filterLoc==='all'||r.location===filterLoc));
      let tVisits=0,tApplied=0,tApproved=0,tSold=0;
      const ln=me.name.toLowerCase();
      todayReports.forEach(r=>(r.visits||[]).forEach(v=>{
        const c1=clean(v.closer),c2=clean(v.closer2),st=clean(v.setter);
        const isMine=(c1&&c1.toLowerCase()===ln)||(c2&&c2.toLowerCase()===ln)||(st&&st.toLowerCase()===ln);
        if(isMine){tVisits++;if(v.applied===true)tApplied++;if(v.result==='approved')tApproved++;if(v.sale===true)tSold++;}
      }));
      // NOTE: dl.calls/appointments are for the selected period, not strictly today — labeled as such
      const rows=[
        {k:'calls',lbl:'Llamadas',truth:dl.calls,truthLbl:'dialer (periodo)'},
        {k:'appointments',lbl:'Citas agendadas',truth:dl.appointments,truthLbl:'calendario (periodo)'},
        {k:'visits',lbl:'Visitas',truth:tVisits,truthLbl:'reporte hoy'},
        {k:'applied',lbl:'Aplicaron',truth:tApplied,truthLbl:'reporte hoy'},
        {k:'approved',lbl:'Aprobados',truth:tApproved,truthLbl:'reporte hoy'},
        {k:'sold',lbl:'Ventas',truth:tSold,truthLbl:'reporte hoy'}
      ];
      return `<div class="section-card" style="border:1.5px solid #fde68a;background:#fffdf5;">
        <h3>🙋 ¿Cuánto crees que hiciste hoy?</h3>
        <p class="section-sub">Escribe lo que crees y compáralo con lo real. Las diferencias nos dicen qué ajustar.</p>
        <div class="table-wrap"><table>
          <thead><tr><th>Métrica</th><th>Lo que crees</th><th>Lo real</th><th>Diferencia</th></tr></thead>
          <tbody>${rows.map(r=>{
            const declared=mine?mine[r.k]:null;
            const diff=declared!=null?declared-r.truth:null;
            const diffStr=diff===null?'—':(diff>0?'+'+diff+' (de más)':diff<0?diff+' (de menos)':'✓ igual');
            const diffCol=diff===null?'var(--gray-400)':diff===0?'var(--green)':'var(--red)';
            return `<tr>
              <td style="font-weight:600;">${r.lbl}</td>
              <td><input type="number" id="sr-${r.k}" value="${declared!=null?declared:''}" min="0" style="width:70px;padding:5px 8px;border:1.5px solid var(--gray-300);border-radius:7px;font-family:inherit;"></td>
              <td class="val-strong">${r.truth} <span style="font-size:10px;color:var(--gray-400);font-weight:400;">${r.truthLbl}</span></td>
              <td style="color:${diffCol};font-weight:700;">${diffStr}</td>
            </tr>`;
          }).join('')}</tbody>
        </table></div>
        <button onclick="saveSelfReport()" id="sr-save-btn" style="margin-top:12px;padding:10px 18px;background:var(--primary);color:white;border:none;border-radius:9px;font-weight:700;cursor:pointer;font-family:inherit;">${mine?'Actualizar mi declaración':'Guardar mi declaración'}</button>
        <span id="sr-save-msg" style="margin-left:10px;font-size:13px;color:var(--green);"></span>
      </div>`;
    }

    async function saveSelfReport(){
      const val=k=>{const el=document.getElementById('sr-'+k);return el&&el.value!==''?parseInt(el.value):null;};
      const payload={
        agent_name:me.name,report_date:todayISO(),
        calls:val('calls'),appointments:val('appointments'),visits:val('visits'),
        applied:val('applied'),approved:val('approved'),sold:val('sold'),
        submitted_at:new Date().toISOString()
      };
      const btn=document.getElementById('sr-save-btn');const msg=document.getElementById('sr-save-msg');
      btn.disabled=true;btn.textContent='Guardando…';
      try{
        const res=await fetch(`${SUPA_URL}/rest/v1/ar_agent_self_report?on_conflict=agent_name,report_date`,{
          method:'POST',headers:{...SUPA_HEADERS,Prefer:'resolution=merge-duplicates,return=minimal'},
          body:JSON.stringify(payload)
        });
        if(!res.ok)throw new Error(await res.text());
        // refresh self reports + re-render to update diffs
        const sr=await fetch(`${SUPA_URL}/rest/v1/ar_agent_self_report?select=*`,{headers:SUPA_HEADERS});
        window._selfReports=await sr.json();
        msg.textContent='✓ Guardado';
        render();
      }catch(e){msg.style.color='var(--red)';msg.textContent='Error: '+e.message;}
      finally{btn.disabled=false;}
    }

    let _chartQueue=[];
    function drawQueuedCharts(){
      _chartQueue.forEach(({id,opts})=>{const el=document.getElementById(id);if(el&&typeof ApexCharts!=='undefined'){el.innerHTML='';new ApexCharts(el,opts).render();}});
      _chartQueue=[];
    }

    function funnelCard(title,o,kind,sub,agentName){
      const isClose=kind==='close';
      const tag=isClose?'<span class="tag close">cierre</span>':'<span class="tag prospect">prospección</span>';
      const dl=dialerFor(agentName||(o.name));
      const aDays=agentActiveDays(agentName||(o.name));
      // Top-of-funnel (dialer) only makes sense on prospección or a closer's own prospecting.
      // On the CLOSE funnel we don't show calls (those belong to prospecting); show appointments as context only.
      const showTop=kind==='prospect';
      const stages=[
        ...(showTop?[
          {name:'Llamadas',val:dl.calls,color:'#0ea5e9',isDialer:true,note:perDay(dl.calls,aDays)+'/día'},
          {name:'Citas agendadas',val:dl.appointments,conv:pct(o.visits,dl.appointments),color:'#6366f1',isDialer:true,convLbl:'show rate',note:perDay(dl.appointments,aDays)+'/día'},
        ]:[]),
        {name:isClose?'Visitas atendidas':'Visitas',val:o.visits,color:'#3b82f6'},
        {name:'Aplicaron',val:o.applied,conv:pct(o.applied,o.visits),color:'#06b6d4'},
        {name:'Aprobados',val:o.approved,conv:pct(o.approved,o.applied),color:'#8b5cf6'},
        {name:'Ventas',val:o.sold,conv:pct(o.sold,o.approved),color:'#10b981'}
      ];
      const max=Math.max(showTop?dl.calls:o.visits,o.visits,1);
      return `<div class="section-card">
        <h3>${title}${tag}</h3>
        <p class="section-sub">${sub}${showTop?` · llamadas y citas en vivo del dialer · ${aDays} días activos`:''}</p>
        ${stages.map(st=>{
          const w=Math.max(pct(st.val,max),4);
          const convTxt=st.conv!==undefined?(st.convLbl?st.convLbl+' '+st.conv.toFixed(0)+'%':'↓'+st.conv.toFixed(0)+'%'):'';
          const noteTxt=st.note?`<div style="font-size:10px;color:#0ea5e9;font-weight:700;">${st.note}</div>`:'';
          return `<div class="funnel-stage"><div class="name">${st.name}${st.isDialer?' <span style="font-size:9px;color:#0ea5e9;font-weight:700;">●</span>':''}</div><div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${st.color};">${fmtShare(st.val)}</div></div><div class="conv">${noteTxt}${convTxt}</div></div>`;
        }).join('')}
        ${o.profit!==undefined&&o.profit>0?`<div style="margin-top:12px;padding-top:10px;border-top:1px dashed var(--gray-200);font-size:13px;color:var(--gray-600);">Monto total generado: <b style="color:var(--green);">${fmtMoney(o.profit)}</b></div>`:''}
        ${showTop&&!window._dialerOk?`<div style="margin-top:8px;font-size:11px;color:var(--gray-400);">Dialer offline — llamadas/citas mostradas como 0</div>`:''}
      </div>`;
    }

    function convCard(o,kind){
      const v2a=pct(o.applied,o.visits),a2ap=pct(o.approved,o.applied),ap2s=pct(o.sold,o.approved),v2s=pct(o.sold,o.visits);
      return `<div class="section-card">
        <h3>Tus conversiones</h3>
        <p class="section-sub">Qué tan eficiente eres en cada paso del embudo</p>
        <div class="conv-grid">
          <div class="conv-chip"><div class="pct ${pctCls(v2a,60,40)}">${v2a.toFixed(0)}%</div><div class="lbl">Visita → Aplicó</div><div class="num">${o.applied}/${o.visits}</div></div>
          <div class="conv-chip"><div class="pct ${pctCls(a2ap,45,30)}">${a2ap.toFixed(0)}%</div><div class="lbl">Aplicó → Aprobó</div><div class="num">${o.approved}/${o.applied}</div></div>
          <div class="conv-chip"><div class="pct ${pctCls(ap2s,75,50)}">${ap2s.toFixed(0)}%</div><div class="lbl">Aprobó → Venta</div><div class="num">${fmtShare(o.sold)}/${o.approved}</div></div>
          <div class="conv-chip"><div class="pct ${pctCls(v2s,20,10)}">${v2s.toFixed(0)}%</div><div class="lbl">Visita → Venta</div><div class="num">${fmtShare(o.sold)}/${o.visits}</div></div>
        </div>
      </div>`;
    }

    function closersForSetter(reports,setterName){
      const map={};
      reports.forEach(r=>(r.visits||[]).forEach(v=>{
        if(clean(v.setter)&&clean(v.setter).toLowerCase()===setterName.toLowerCase()){
          const c=clean(v.closer)||'Sin asignar';
          if(!map[c])map[c]={visits:0,sold:0};
          map[c].visits++;if(v.sale===true)map[c].sold++;
        }
      }));
      const rows=Object.entries(map).sort((a,b)=>b[1].visits-a[1].visits);
      if(!rows.length)return '';
      return `<div class="section-card">
        <h3>Quién atendió tus visitas</h3>
        <p class="section-sub">Los closers que recibieron las visitas que trajiste</p>
        <div class="table-wrap"><table><thead><tr><th>Closer</th><th>Visitas</th><th>Ventas</th><th>Conv.</th></tr></thead>
        <tbody>${rows.map(([c,d])=>`<tr><td class="agent-name-cell">${escapeHtml(c)}</td><td>${d.visits}</td><td class="val-strong">${d.sold}</td><td class="pct ${pctCls(pct(d.sold,d.visits),20,10)}">${pct(d.sold,d.visits).toFixed(0)}%</td></tr>`).join('')}</tbody></table></div>
      </div>`;
    }

    // ===== Leaderboards =====
    function setLbTab(t){lbTab=t;lbSort={key:'sold',dir:-1};
      document.querySelectorAll('#lb-tabs .tab').forEach(b=>b.classList.toggle('active',b.dataset.lt===t));renderLeaderboards(buildStats());}
    function lbSortBy(k){if(lbSort.key===k)lbSort.dir*=-1;else{lbSort.key=k;lbSort.dir=-1;}renderLeaderboards(buildStats());}

    function renderLeaderboards(s){
      const host=document.getElementById('leaderboards');
      const pool=(lbTab==='closer'?s.close:s.prospect).map(a=>{const dl=dialerFor(a.name);return {...a,
        calls:dl.calls,appts:dl.appointments,
        v2a:pct(a.applied,a.visits),a2ap:pct(a.approved,a.applied),ap2s:pct(a.sold,a.approved),v2s:pct(a.sold,a.visits),
        showRate:pct(a.visits,dl.appointments)
      };}).filter(a=>a.visits>0||a.sold>0||a.calls>0);
      const sorted=[...pool].sort((a,b)=>{
        if(lbSort.key==='name')return lbSort.dir*String(a.name).localeCompare(String(b.name));
        return lbSort.dir*((a[lbSort.key]||0)-(b[lbSort.key]||0));
      });
      const head=lbTab==='closer'
        ?`<tr><th>#</th><th onclick="lbSortBy('name')">Closer</th><th onclick="lbSortBy('visits')">Vis. atend.</th><th onclick="lbSortBy('applied')">Aplic.</th><th onclick="lbSortBy('approved')">Aprob.</th><th onclick="lbSortBy('sold')">Ventas</th><th onclick="lbSortBy('ap2s')">Close%</th><th onclick="lbSortBy('v2s')">Vis→Venta</th><th onclick="lbSortBy('selfgen')">Self-gen</th><th onclick="lbSortBy('profit')">Monto</th><th></th></tr>`
        :`<tr><th>#</th><th onclick="lbSortBy('name')">Setter</th><th onclick="lbSortBy('calls')">Llam. 📞</th><th onclick="lbSortBy('appts')">Citas 📅</th><th onclick="lbSortBy('visits')">Visitas</th><th onclick="lbSortBy('showRate')">Show%</th><th onclick="lbSortBy('sold')">Ventas</th><th onclick="lbSortBy('v2s')">Vis→Vta</th><th onclick="lbSortBy('profit')">Monto</th><th></th></tr>`;
      const body=sorted.length?sorted.map((a,i)=>{
        const isMe=a.name.toLowerCase()===me.name.toLowerCase();
        const rc=i===0?'top1':i===1?'top2':i===2?'top3':'';
        const clickAttr=`onclick="openAgentDetail('${escapeAttr(a.name)}','${lbTab}')"`;
        const nameLink=`<span style="color:var(--blue);text-decoration:underline;text-underline-offset:2px;">${escapeHtml(a.name)}</span>${isMe?' 👈':''}`;

      host.innerHTML=`

    // ===== AGENT DETAIL DRILL-DOWN =====
    let dtAgg='week'; // day | week | month
    let dtContext=null; // {name, facet}

    // Open a person's full profile page (from any leaderboard/list)
    function openAgentDetail(name,lbTabOrFacet){
      const facet=lbTabOrFacet==='setter'?'prospect':lbTabOrFacet==='closer'?'close':lbTabOrFacet;
      goProfile(name,facet);
    }
    function setDtAgg(m){dtAgg=m;render();}

    function isoWeekKey(dateISO){
      const d=new Date(dateISO+'T00:00:00');
      const day=(d.getDay()+6)%7; // Mon=0
      d.setDate(d.getDate()-day+3);
      const firstThu=new Date(d.getFullYear(),0,4);
      const week=1+Math.round(((d-firstThu)/86400000-3+((firstThu.getDay()+6)%7))/7);
      return `${d.getFullYear()}-S${String(week).padStart(2,'0')}`;
    }
    function periodKey(dateISO){
      if(dtAgg==='day')return dateISO;
      if(dtAgg==='week')return isoWeekKey(dateISO);
      return dateISO.slice(0,7); // month YYYY-MM
    }
    // Monday (start) of ISO week w in year y
    function isoWeekStart(y,w){
      const jan4=new Date(y,0,4);
      const jan4Mon=new Date(jan4);jan4Mon.setDate(jan4.getDate()-((jan4.getDay()+6)%7));
      const s=new Date(jan4Mon);s.setDate(jan4Mon.getDate()+(w-1)*7);return s;
    }
    function periodNice(key){
      const mn=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
      if(dtAgg==='day'){const[y,m,d]=key.split('-');return `${+d} ${mn[+m-1]}`;}
      if(dtAgg==='week'){const[y,w]=key.split('-S');const s=isoWeekStart(+y,+w);const e=new Date(s);e.setDate(e.getDate()+6);
        return s.getMonth()===e.getMonth()?`${s.getDate()}–${e.getDate()} ${mn[e.getMonth()]}`:`${s.getDate()} ${mn[s.getMonth()]}–${e.getDate()} ${mn[e.getMonth()]}`;}
      const[y,m]=key.split('-');return `${mn[+m-1].charAt(0).toUpperCase()+mn[+m-1].slice(1)} '${y.slice(2)}`;
    }

    // Build a closer/setter detail dataset (facet) with temporal series + origin
    function buildAgentDetail(name,facet){
      const reports=allReports.filter(r=>inPeriod(r.date)&&(filterLoc==='all'||r.location===filterLoc));
      const ln=name.toLowerCase();
      const byPeriod={}; // key -> {visits,applied,approved,sold}
      const origin={visits:{cc:0,own:0,walk:0,other:0},sold:{cc:0,own:0,walk:0,other:0}};
      const tot={visits:0,applied:0,approved:0,sold:0,profit:0,calls:0,appts:0};
      const eP=k=>byPeriod[k]||(byPeriod[k]={visits:0,applied:0,approved:0,sold:0,calls:0,appts:0});

      reports.forEach(r=>{
        (r.visits||[]).forEach(v=>{
          const setter=clean(v.setter),c1=clean(v.closer),c2=clean(v.closer2);
          const sb=v.scheduled_by, selfgen=sb==='Self-gen'||v.subgen===true;
          let mine=false, soldShare=0;
          if(facet==='close'){
            const isC1=c1&&c1.toLowerCase()===ln, isC2=c2&&c2.toLowerCase()===ln;
            if(isC1||isC2){mine=true;
              if(v.sale===true)soldShare=(c1&&c2)?0.5:1;}
          }else{ // prospect
            let prospector=setter||(selfgen&&c1?c1:null);
            if(prospector&&prospector.toLowerCase()===ln){mine=true;if(v.sale===true)soldShare=1;}
          }
          if(!mine)return;
          const k=periodKey(r.date);const p=eP(k);
          p.visits++;tot.visits++;
          if(v.applied===true){p.applied++;tot.applied++;}
          if(v.result==='approved'){p.approved++;tot.approved++;}
          if(v.sale===true){p.sold+=soldShare;tot.sold+=soldShare;tot.profit+=(soldShare===0.5?(v.net_profit||0)/2:(v.net_profit||0));}
          // Origin (only meaningful for closer facet — where visits come from)
          let org=setter?'cc':selfgen?'own':sb==='Walk-in'?'walk':'other';
          origin.visits[org]++;
          if(v.sale===true)origin.sold[org]+=soldShare;
        });
      });
      // Merge per-period dials + appointments from the daily reconciliation (GHL calendar +
      // dialer), so the day/week/month history shows LLAM. and CITAS per agent — not just
      // the period total. window._recon holds by_agent_status{calls,total} per day.
      const ln2=name.toLowerCase();
      (window._recon||[]).forEach(r=>{
        if(!inPeriod(r.recon_date))return;
        const bas=((r.detail||{}).by_agent_status||{})[ln2];
        if(!bas)return;
        const k=periodKey(r.recon_date);const p=eP(k);
        p.calls+=bas.calls||0;p.appts+=bas.total||0;
        tot.calls+=bas.calls||0;tot.appts+=bas.total||0;
      });
      const keys=Object.keys(byPeriod).sort();
      return {byPeriod,keys,origin,tot};
    }

    function projectedSales(sold){
      const now=new Date();
      const todayNum=now.getDate();
      if(filterPeriod==='mtd'){
        const totalDays=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
        if(todayNum===0)return null;
        return {proj:Math.round(sold/todayNum*totalDays),total:totalDays,elapsed:todayNum};
      }
      if(/^\d{4}-\d{2}$/.test(filterPeriod)){
        const[y,m]=filterPeriod.split('-').map(Number);
        if(y===now.getFullYear()&&m===now.getMonth()+1){
          const totalDays=new Date(y,m,0).getDate();
          return {proj:Math.round(sold/todayNum*totalDays),total:totalDays,elapsed:todayNum};
        }
      }
      return null;
    }

          ${(()=>{const _p=projectedSales(primary.sold);if(!_p)return '';return `<div class="hero-stat"><div class="v" style="color:#fbbf24;">${_p.proj}</div><div class="k">Proyección mes</div><div class="c">día ${_p.elapsed}/${_p.total}</div></div>`;})()}

      // Funnel(s) — closers show cierre + their own prospección; setters show prospección

      // Evolución temporal: mode toggle
      html+=`<div class="mode-toggle">

      // Averages
      html+=`<div class="avg-grid">

        <div class="avg-card"><div class="v" style="color:var(--green);">${fmtMoney(d.tot.profit)}</div><div class="k">Monto total</div></div>

      // GHL appointment status — the REAL calendar outcome of this agent's appointments
      const st=apptStatusFor(name);
      if(st.total>0){
        const sr=ghlShowRate(st),decided=st.showed+st.noshow+st.cancelled+st.invalid,pending=(st.confirmed||0)+(st.new||0);
        html+=`<div class="section-card"><h3>Estatus de citas <span class="tag prospect">GHL</span></h3>

          <div class="conv-grid">

      // Trend chart
      html+=`<div class="section-card"><h3>Tu evolución (${{day:'por día',week:'por semana',month:'por mes'}[dtAgg]})</h3>

      const histRows=keysDesc.map(k=>{

        return `<tr>
          <td style="font-weight:700;">${periodNice(k)}</td>

      html+=`<div class="section-card"><h3>Histórico ${{day:'diario',week:'semanal',month:'mensual'}[dtAgg]}</h3>
        <p class="section-sub">Cada ${avgLbl} en detalle · última columna = acumulado de ventas hasta ese ${avgLbl}</p>
        <div class="table-wrap"><table>

            <td class="pct">${v2a.toFixed(0)}%</td><td class="pct">${ap2s.toFixed(0)}%</td><td class="pct">${v2s.toFixed(0)}%</td><td>${fmtMoney(d.tot.profit)}</td>

    }

    function donut(id,title,labels,data,colors){

    const _charts={};
    function mountChart(id,opts){
      const el=document.getElementById(id);if(!el)return;
      if(el.offsetWidth===0){return;} // skip detached/zero-width containers (avoids ApexCharts NaN)
      if(_charts[id]){try{_charts[id].destroy();}catch(e){}}
      el.innerHTML='';const c=new ApexCharts(el,opts);_charts[id]=c;c.render();
    }
    // Destroy all live charts before swapping views (prevents orphaned-chart NaN errors)
    function destroyCharts(){Object.keys(_charts).forEach(id=>{try{_charts[id].destroy();}catch(e){}delete _charts[id];});}

    // ===== KPI report form (integrated 'Reporte de hoy' view) =====
    let rptVisits=[], rptTruth={calls:null,contacts:null,appointments:null,showed:null}, rptValidate=false;
    const RPT_FUNNEL=[['came','Solo vino (no aplicó)'],['denied','Negó'],['approved','Aprobó'],['sold','Vendió']];
    const RPT_ORIGINS=[['cc','Call Center'],['closer2','Otro closer'],['own','Self-gen'],['ref_direct','Referido directo'],['walkin','Walk-in']];
    const RPT_SOURCES=[['marketplace','Marketplace'],['fb_ads','Facebook Ads'],['crm','CRM recuperado'],['referido','Referido']];
    function rptAddVisit(){rptVisits.push({client:'',origin:me.role==='closer'?'':'brought',source:null,stage:null});rptRenderVisits();}
    function rptRemoveVisit(i){rptVisits.splice(i,1);rptRenderVisits();}
    function rptSetV(i,k,v){rptVisits[i][k]=v;if(k==='origin'&&v!=='own')rptVisits[i].source=null;rptRenderVisits();}
    function rptErrors(){
      const errs=[];
      rptVisits.forEach((v,i)=>{
        const started=(v.client||'').trim()||v.stage||v.source||(me.role==='closer'&&v.origin);
        if(!started)return;
        const m=[];
        if(!(v.client||'').trim())m.push('cliente');
        if(me.role==='closer'&&!v.origin)m.push('origen');
        if(me.role==='closer'&&v.origin==='own'&&!v.source)m.push('fuente');
        if(!v.stage)m.push('llegó a');
        if(m.length)errs.push({i,missing:m});
      });
      return errs;
    }
    function rptRenderVisits(){
      const host=document.getElementById('visits-list'); if(!host)return;
      host.innerHTML=rptVisits.map((v,i)=>{
        const started=(v.client||'').trim()||v.stage||v.source||(me.role==='closer'&&v.origin);
        const e=cond=>rptValidate&&started&&cond?' err':'';
        const sel=(field,opts,ph,bad)=>`<select class="vsel ${v[field]?'set':''}${bad}" onchange="rptSetV(${i},'${field}',this.value)"><option value="">${ph}</option>${opts.map(([k,l])=>`<option value="${k}" ${v[field]===k?'selected':''}>${l}</option>`).join('')}</select>`;
        const originRow=me.role==='closer'?`<div class="vrow"><span class="field-lbl">Origen</span>${sel('origin',RPT_ORIGINS,'— elegir —',e(!v.origin))}</div>`:'';
        const sourceRow=(me.role==='closer'&&v.origin==='own')?`<div class="vrow"><span class="field-lbl">Fuente</span>${sel('source',RPT_SOURCES,'— fuente —',e(!v.source))}</div>`:'';
        const stageCls=(v.stage==='sold'||v.stage==='approved')?'good':(v.stage==='denied'?'bad':(v.stage?'set':''));
        const stageRow=`<div class="vrow"><span class="field-lbl">Llegó a</span><select class="vsel ${stageCls}${e(!v.stage)}" onchange="rptSetV(${i},'stage',this.value)"><option value="">— elegir —</option>${RPT_FUNNEL.map(([k,l])=>`<option value="${k}" ${v.stage===k?'selected':''}>${l}</option>`).join('')}</select></div>`;
        return `<div class="visit"><div class="vhead"><span class="vnum">Visita ${i+1}</span>${rptVisits.length>1?`<button class="vremove" onclick="rptRemoveVisit(${i})">✕</button>`:''}</div>
          <input class="txt-input${e(!(v.client||'').trim())}" placeholder="Cliente (nombre o teléfono)" value="${(v.client||'').replace(/"/g,'&quot;')}" oninput="rptVisits[${i}].client=this.value">
          ${originRow}${sourceRow}${stageRow}</div>`;
      }).join('');
      if(rptValidate&&!rptErrors().length){const m=document.getElementById('val-msg');if(m)m.classList.remove('show');}
    }
    function rptVal(id){const el=document.getElementById(id);return el&&el.value!==''?parseInt(el.value):null;}
    function rptConfirm(){
      rptValidate=true;
      const errs=rptErrors();
      if(errs.length){
        document.getElementById('cmp-card').classList.add('hidden');
        document.getElementById('btn-submit').classList.add('hidden');
        rptRenderVisits();
        const msg=document.getElementById('val-msg');
        msg.innerHTML=`⚠️ Completa <b>Origen, Fuente y Llegó a</b> en cada visita antes de avanzar (${errs.length} sin completar).`;
        msg.classList.add('show');
        const first=document.querySelector('.txt-input.err, .vsel.err'); if(first)first.scrollIntoView({behavior:'smooth',block:'center'});
        return;
      }
      document.getElementById('val-msg').classList.remove('show');
      const realVisits=rptVisits.filter(v=>(v.client||'').trim()).length;
      const rows=[
        rptCmpRow('📞 Llamadas',rptVal('d-calls'),rptTruth.calls),
        rptCmpRow('💬 Contactos +2min',rptVal('d-contacts'),rptTruth.contacts),
        rptCmpRow('📅 Citas agendadas',rptVal('d-appts'),rptTruth.appointments),
        rptCmpRow('🚶 Visitas registradas',realVisits,rptTruth.showed)
      ].join('');
      document.getElementById('cmp-rows').innerHTML=rows;
      document.getElementById('cmp-pending').innerHTML='⏳ Las <b>aprobadas, negadas y ventas</b> las confirma el manager al final del día.';
      document.getElementById('cmp-card').classList.remove('hidden');
      document.getElementById('btn-submit').classList.remove('hidden');
      document.getElementById('btn-confirm').textContent='Volver a comparar';
      document.getElementById('cmp-card').scrollIntoView({behavior:'smooth'});
    }
    function rptCmpRow(label,said,real){
      if(real==null)return `<div class="cmp-row"><div class="cl">${label}</div><div class="cmp-vals"><span class="said">dijiste ${said==null?'—':said}</span><span class="diff">real: no disp.</span></div></div>`;
      const s=said==null?0:said, diff=s-real, cls=diff===0?'ok':'off';
      const dtxt=diff===0?'✓ igual':(diff>0?`+${diff} de más`:`${diff} de menos`);
      return `<div class="cmp-row"><div class="cl">${label}</div><div class="cmp-vals"><span class="said">dijiste ${said==null?'—':said}</span><span class="real">real ${real}</span><span class="diff ${cls}">${dtxt}</span></div></div>`;
    }
    async function rptSubmit(){
      if(rptErrors().length){rptConfirm();return;}
      const btn=document.getElementById('btn-submit');btn.disabled=true;btn.textContent='Enviando…';
      const cv=rptVisits.filter(v=>(v.client||'').trim());
      const applied=cv.filter(v=>['denied','approved','sold'].includes(v.stage)).length;
      const approved=cv.filter(v=>['approved','sold'].includes(v.stage)).length;
      const denied=cv.filter(v=>v.stage==='denied').length;
      const sold=cv.filter(v=>v.stage==='sold').length;
      const payload={agent_name:me.name,role:me.role,report_date:todayISO(),calls:rptVal('d-calls'),contacts:rptVal('d-contacts'),appointments:rptVal('d-appts'),visits:cv.length,applied,approved,denied,sold,visits_detail:cv,truth_calls:rptTruth.calls,truth_contacts:rptTruth.contacts,truth_appointments:rptTruth.appointments,submitted_at:new Date().toISOString()};
      try{localStorage.setItem('ar_kpi_'+todayISO(),JSON.stringify(payload));}catch(_){}
      let saved=false;
      try{const res=await fetch(`${SUPA_URL}/rest/v1/ar_kpi_daily?on_conflict=agent_name,report_date`,{method:'POST',headers:{...SUPA_HEADERS,Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(payload)});if(res.ok)saved=true;}catch(_){}
      if(!saved){try{
        // Save EVERYTHING to the existing table: numbers in columns, full detail (contacts/denied/role/visits/truth) in `notes` as JSON.
        const core={agent_name:me.name,report_date:todayISO(),calls:payload.calls,appointments:payload.appointments,visits:payload.visits,applied,approved,sold,
          notes:JSON.stringify({kind:'kpi',contacts:payload.contacts,denied,role:me.role,visits_detail:cv,truth:{calls:rptTruth.calls,contacts:rptTruth.contacts,appointments:rptTruth.appointments}})};
        const r2=await fetch(`${SUPA_URL}/rest/v1/ar_agent_self_report?on_conflict=agent_name,report_date`,{method:'POST',headers:{...SUPA_HEADERS,Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(core)});if(r2.ok)saved=true;}catch(_){}}
      document.getElementById('main-content').innerHTML=`<div style="text-align:center;padding:50px 24px;">
        <div style="width:64px;height:64px;border-radius:50%;background:var(--green);color:white;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 16px;">✓</div>
        <div style="font-size:20px;font-weight:800;">¡Reporte enviado!</div>
        <p style="color:var(--gray-500);margin-top:6px;">${saved?'Tu producción de hoy quedó registrada.':'Guardado en tu dispositivo. Se sincroniza al reconectar.'}</p>
        <button class="kpi-btn" style="max-width:260px;margin:22px auto 0;" onclick="goProfile(me.name,me.role==='closer'?'close':'prospect')">Ver mi dashboard →</button>
      </div>`;
      window.scrollTo(0,0);
    }
    async function rptLoadTruth(){
      rptTruth={calls:null,contacts:null,appointments:null,showed:null};
      try{
        const t=todayISO();
        const res=await fetch(`${PROXY_URL}?resource=agents&from=${t}&to=${t}&tz=-300`,{headers:SUPA_HEADERS});
        const data=await res.json();
        const row=(data.agents||[]).find(a=>(a.agentName||'').toLowerCase()===me.name.toLowerCase());
        if(row){rptTruth.calls=row.calls||0;rptTruth.contacts=row.contacts!=null?row.contacts:null;rptTruth.appointments=row.appointments||0;}
        else{rptTruth.calls=0;rptTruth.appointments=0;}
      }catch(e){}
    }
    function renderReportForm(){
      rptVisits=[];rptValidate=false;
      const dateStr=new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
      const visitsSub=me.role==='closer'?'Agrega cada visita que atendiste hoy (marca de dónde vino).':'Agrega cada visita que trajiste hoy y hasta dónde llegó.';
      document.getElementById('main-content').innerHTML=`
        <button class="back-btn" onclick="goProfile(me.name,me.role==='closer'?'close':'prospect')">← Mi dashboard</button>
        <div class="page-title">📝 Reporte de hoy</div>
        <div class="page-sub">${escapeHtml(me.name)} · ${dateStr}</div>
        <div class="section-card">
          <h3><span class="step-num">1</span>Tu actividad</h3>
          <p class="section-sub">Escribe lo que <b>crees</b> que hiciste hoy. Al confirmar te muestro lo real (no veas el número antes 😉).</p>
          <div class="stat-row"><div class="lbl">📞 Llamadas hoy</div><input class="num-input" type="number" min="0" id="d-calls" placeholder="0"></div>
          <div class="stat-row"><div class="lbl">💬 Contactos<small>conversaciones de +2 min</small></div><input class="num-input" type="number" min="0" id="d-contacts" placeholder="0"></div>
          <div class="stat-row"><div class="lbl">📅 Citas agendadas</div><input class="num-input" type="number" min="0" id="d-appts" placeholder="0"></div>
        </div>
        <div class="section-card">
          <h3><span class="step-num">2</span>Tus visitas</h3>
          <p class="section-sub">${visitsSub}</p>
          <div id="visits-list"></div>
          <button class="add-visit" onclick="rptAddVisit()">+ Agregar visita</button>
        </div>
        <div class="val-msg" id="val-msg"></div>
        <button class="kpi-btn" id="btn-confirm" onclick="rptConfirm()">Confirmar y comparar</button>
        <div class="section-card hidden" id="cmp-card">
          <h3>📊 Lo que dijiste vs lo real</h3>
          <p class="section-sub">El número real es el que cuenta. Esto mide qué tan cerca estuviste.</p>
          <div id="cmp-rows"></div>
          <div class="pending-note" id="cmp-pending"></div>
        </div>
        <button class="kpi-btn green hidden" id="btn-submit" onclick="rptSubmit()">Enviar reporte ✓</button>`;
      rptAddVisit();
      rptLoadTruth();
    }

    function escapeAttr(s){return String(s??'').replace(/&/g,'&amp;').replace(/'/g,'&#39;').replace(/"/g,'&quot;');}
    function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  
    // Fix tooltip clipping in overflow containers — position fixed via JS
    document.addEventListener('mouseover',function(e){
      const tip=e.target.closest('.tip');if(!tip)return;
      const box=tip.querySelector('.tip-box');if(!box)return;
      const tr=tip.getBoundingClientRect();
      const bw=270;
      let left=tr.left+tr.width/2-bw/2;
      if(left<8)left=8;
      if(left+bw>window.innerWidth-8)left=window.innerWidth-bw-8;
      requestAnimationFrame(function(){
        var bh=box.offsetHeight||60;
        var top=tr.top-bh-10;
        if(top<8)top=tr.bottom+8;
        box.style.left=left+'px';
        box.style.top=top+'px';
      });
    },true);
  </script>
</body>
</html>
