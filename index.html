    }

    function periodLabel(){
      if(/^\d{4}-\d{2}$/.test(filterPeriod)){const[y,m]=filterPeriod.split('-');return `${MONTHS[+m-1]} ${y}`;}
      if(filterPeriod.startsWith('last:'))return `Últimos ${filterPeriod.slice(5)} días`;
      if(filterPeriod.startsWith('range:')){const p=filterPeriod.split(':');return `${p[1]} a ${p[2]}`;}
      return {mtd:'Mes actual',30:'Últimos 30 días',qtd:'Este trimestre',all:'Todo el tiempo'}[filterPeriod]||filterPeriod;
    }

    function renderPersonal(s){
      const host=document.getElementById('personal');
      if(me.role==='manager'){host.innerHTML='';return;}
      const myClose=s.close.find(c=>c.name.toLowerCase()===me.name.toLowerCase());

      const isCloser=me.role==='closer'||(myClose&&!myProspect);
      // Ranking position
      const closeSorted=[...s.close].sort((a,b)=>b.sold-a.sold);
      const prospSorted=[...s.prospect].sort((a,b)=>b.sold-a.sold);
      const closePos=myClose?closeSorted.findIndex(x=>x.name===myClose.name)+1:0;
      const prospPos=myProspect?prospSorted.findIndex(x=>x.name===myProspect.name)+1:0;

      let html='';
      // HERO — primary faceta
      const primary=isCloser?(myClose||{visits:0,applied:0,approved:0,sold:0}):(myProspect||{visits:0,applied:0,approved:0,sold:0,profit:0});
      const primaryPos=isCloser?closePos:prospPos;
      const poolN=isCloser?s.close.length:s.prospect.length;
      html+=`
        <div class="hero">
          <div class="hero-top">
            <div><div class="hero-name">${escapeHtml(me.name)}</div><div class="hero-role">${isCloser?'Closer':'Setter'} · ${periodLabel()}</div></div>
            <div class="hero-rank"><div class="pos">#${primaryPos||'—'}</div><div class="lbl">de ${poolN} ${isCloser?'closers':'setters'}</div></div>
          </div>
          <div class="hero-kpis">
            <div class="hero-stat"><div class="v">${primary.visits}</div><div class="k">${isCloser?'Visitas atendidas':'Visitas traídas'}</div></div>
            <div class="hero-stat"><div class="v">${primary.applied}</div><div class="k">Aplicaron</div><div class="c">${pct(primary.applied,primary.visits).toFixed(0)}%</div></div>
            <div class="hero-stat"><div class="v">${primary.approved}</div><div class="k">Aprobados</div><div class="c">${pct(primary.approved,primary.applied).toFixed(0)}%</div></div>
            <div class="hero-stat"><div class="v" style="color:#34d399;">${fmtShare(primary.sold)}</div><div class="k">Ventas</div><div class="c">${pct(primary.sold,primary.approved).toFixed(0)}% cierre</div></div>
          ${(()=>{const _p=projectedSales(primary.sold);if(!_p)return '';return `<div class="hero-stat"><div class="v" style="color:#fbbf24;">${_p.proj}</div><div class="k">Proyección mes</div><div class="c">día ${_p.elapsed}/${_p.total}</div></div>`;})()}
          </div>
          <button class="hero-cta" onclick="openMyDetail()">Ver mi producción completa →</button>
        </div>`;

      // CLOSER → cierre funnel + prospección propia
      if(isCloser&&myClose){
        html+=funnelCard('Tu cierre',myClose,'close','Visitas que atendiste (propias, de setters y walk-ins)',me.name);
        html+=convCard(myClose,'close');
        const prosp=myProspect||{name:me.name,visits:0,applied:0,approved:0,sold:0,profit:0};
        html+=funnelCard('Tu prospección',prosp,'prospect','Tus llamadas, citas y visitas self-gen',me.name);
      }
      // SETTER → prospección funnel + qué closers atendieron
      if(!isCloser){
        const prosp=myProspect||{name:me.name,visits:0,applied:0,approved:0,sold:0,profit:0};
        html+=funnelCard('Tu prospección',prosp,'prospect','Llamadas, citas, visitas que trajiste y su conversión',me.name);
        if(myProspect)html+=convCard(myProspect,'prospect');
        html+=closersForSetter(s.reports,me.name);
      }
      // Self-report (accountability) — agent declares what they think they did vs the truth
      html+=selfReportCard();
      host.innerHTML=html;
      // Render any charts queued
      drawQueuedCharts();
    }

    // ===== Self-report: agent declares, system compares to truth =====
    function todayISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}

    function selfReportCard(){
      const today=todayISO();
      const mine=(window._selfReports||[]).find(s=>s.agent_name&&s.agent_name.toLowerCase()===me.name.toLowerCase()&&s.report_date===today);
      // Truth for TODAY (dialer live + today's Sales Report)
      const dl=dialerFor(me.name);
      const todayReports=allReports.filter(r=>r.date===today&&(filterLoc==='all'||r.location===filterLoc));
      let tVisits=0,tApplied=0,tApproved=0,tSold=0;
      const ln=me.name.toLowerCase();
      todayReports.forEach(r=>(r.visits||[]).forEach(v=>{
        const c1=clean(v.closer),c2=clean(v.closer2),st=clean(v.setter);
        const isMine=(c1&&c1.toLowerCase()===ln)||(c2&&c2.toLowerCase()===ln)||(st&&st.toLowerCase()===ln);
        if(isMine){tVisits++;if(v.applied===true)tApplied++;if(v.result==='approved')tApproved++;if(v.sale===true)tSold++;}
      }));
      // NOTE: dl.calls/appointments are for the selected period, not strictly today — labeled as such
      const rows=[
        {k:'calls',lbl:'Llamadas',truth:dl.calls,truthLbl:'dialer (periodo)'},
        {k:'appointments',lbl:'Citas agendadas',truth:dl.appointments,truthLbl:'calendario (periodo)'},
        {k:'visits',lbl:'Visitas',truth:tVisits,truthLbl:'reporte hoy'},
        {k:'applied',lbl:'Aplicaron',truth:tApplied,truthLbl:'reporte hoy'},
        {k:'approved',lbl:'Aprobados',truth:tApproved,truthLbl:'reporte hoy'},
        {k:'sold',lbl:'Ventas',truth:tSold,truthLbl:'reporte hoy'}
      ];
      return `<div class="section-card" style="border:1.5px solid #fde68a;background:#fffdf5;">
        <h3>🙋 ¿Cuánto crees que hiciste hoy?</h3>
        <p class="section-sub">Escribe lo que crees y compáralo con lo real. Las diferencias nos dicen qué ajustar.</p>
        <div class="table-wrap"><table>
          <thead><tr><th>Métrica</th><th>Lo que crees</th><th>Lo real</th><th>Diferencia</th></tr></thead>
          <tbody>${rows.map(r=>{
            const declared=mine?mine[r.k]:null;
            const diff=declared!=null?declared-r.truth:null;
            const diffStr=diff===null?'—':(diff>0?'+'+diff+' (de más)':diff<0?diff+' (de menos)':'✓ igual');
            const diffCol=diff===null?'var(--gray-400)':diff===0?'var(--green)':'var(--red)';
            return `<tr>
              <td style="font-weight:600;">${r.lbl}</td>
              <td><input type="number" id="sr-${r.k}" value="${declared!=null?declared:''}" min="0" style="width:70px;padding:5px 8px;border:1.5px solid var(--gray-300);border-radius:7px;font-family:inherit;"></td>
              <td class="val-strong">${r.truth} <span style="font-size:10px;color:var(--gray-400);font-weight:400;">${r.truthLbl}</span></td>
              <td style="color:${diffCol};font-weight:700;">${diffStr}</td>
            </tr>`;
          }).join('')}</tbody>
        </table></div>
        <button onclick="saveSelfReport()" id="sr-save-btn" style="margin-top:12px;padding:10px 18px;background:var(--primary);color:white;border:none;border-radius:9px;font-weight:700;cursor:pointer;font-family:inherit;">${mine?'Actualizar mi declaración':'Guardar mi declaración'}</button>
        <span id="sr-save-msg" style="margin-left:10px;font-size:13px;color:var(--green);"></span>
      </div>`;
    }

    async function saveSelfReport(){
      const val=k=>{const el=document.getElementById('sr-'+k);return el&&el.value!==''?parseInt(el.value):null;};
      const payload={
        agent_name:me.name,report_date:todayISO(),
        calls:val('calls'),appointments:val('appointments'),visits:val('visits'),
        applied:val('applied'),approved:val('approved'),sold:val('sold'),
        submitted_at:new Date().toISOString()
      };
      const btn=document.getElementById('sr-save-btn');const msg=document.getElementById('sr-save-msg');
      btn.disabled=true;btn.textContent='Guardando…';
      try{
        const res=await fetch(`${SUPA_URL}/rest/v1/ar_agent_self_report?on_conflict=agent_name,report_date`,{
          method:'POST',headers:{...SUPA_HEADERS,Prefer:'resolution=merge-duplicates,return=minimal'},
          body:JSON.stringify(payload)
        });
        if(!res.ok)throw new Error(await res.text());
        // refresh self reports + re-render to update diffs
        const sr=await fetch(`${SUPA_URL}/rest/v1/ar_agent_self_report?select=*`,{headers:SUPA_HEADERS});
        window._selfReports=await sr.json();
        msg.textContent='✓ Guardado';
        render();
      }catch(e){msg.style.color='var(--red)';msg.textContent='Error: '+e.message;}
      finally{btn.disabled=false;}
    }

    let _chartQueue=[];
    function drawQueuedCharts(){
      _chartQueue.forEach(({id,opts})=>{const el=document.getElementById(id);if(el&&typeof ApexCharts!=='undefined'){el.innerHTML='';new ApexCharts(el,opts).render();}});
      _chartQueue=[];
    }

    // ===== Gráficas de tendencia diaria (genéricas) — Todos / Closers (Orlando·Kissimmee) / Setters =====
    function trendDays(){
      const {from,to}=periodRange(); const today=todayISO(), end=to<today?to:today;
      const days=[]; let d=new Date(from+'T00:00:00'); const ed=new Date(end+'T00:00:00'); let g=0;
      while(d<=ed && g++<400){ days.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`); d.setDate(d.getDate()+1); }
      return days;
    }
    function showRate(st){ st=st||{}; const d=(st.showed||0)+(st.noshow||0); return d?Math.round((st.showed||0)/d*100):0; }

    // ===================== DASHBOARD ANALYTICS (equipo × ubicación × período) =====================
    window._anTeam=window._anTeam||'all';   // all | cc | closers
    window._anLoc=window._anLoc||'all';     // all | orlando | kissimmee
    function setAnTeam(t){ window._anTeam=t; render(); }
    function setAnLoc(l){ window._anLoc=l; render(); }
    function anTeamMatch(team){ const s=window._anTeam||'all'; if(s==='all')return true; if(s==='cc')return team==='cc'; return team==='orlando'||team==='kissimmee'; }
    function anLocMatch(loc){ const s=window._anLoc||'all'; return s==='all'?true:loc===s; }
    function anTeamLabel(){ const s=window._anTeam||'all'; return s==='cc'?'Call Center':s==='closers'?'Closers':'Todo el equipo'; }
    function anLocLabel(){ const s=window._anLoc||'all'; return s==='all'?'ambas ubicaciones':s==='orlando'?'Orlando':'Kissimmee'; }
    function anLocOfReport(r){ const l=(r.location||'').toLowerCase(); return l.indexOf('orl')>=0?'orlando':l.indexOf('kis')>=0?'kissimmee':'otro'; }
    function anSaleTeam(v){ const tm=window._agentTeam||{}; const c=canonName(clean(v.closer)); const t=c?tm[c.toLowerCase()]:null; return (t==='orlando'||t==='kissimmee')?t:'otro'; }
    // Citas por día (filas team,loc → conteo por día)
    function anCitasDaily(rows){ rows=rows||window._citasRows||[]; const by={}; rows.forEach(x=>{ if(anTeamMatch(x.team)&&anLocMatch(x.loc)) by[x.day]=(by[x.day]||0)+x.n; }); return by; }
    // Visitas traídas → filas desde reportes (loc = ubicación del reporte; team = quién la trajo)
    function anBuildVisRows(list){ const tm=window._agentTeam||{}; const rows=[]; (list||[]).forEach(r=>{ const loc=anLocOfReport(r); (r.visits||[]).forEach(v=>{ const setter=canonName(clean(v.setter)); const selfgen=v.scheduled_by==='Self-gen'||v.subgen===true; let team='otro',prospector=null; if(setter){team='cc';prospector=setter;} else if(selfgen){const c=canonName(clean(v.closer));const t=c?tm[c.toLowerCase()]:null;team=(t==='orlando'||t==='kissimmee')?t:'otro';prospector=c;} rows.push({day:r.date,team,loc,prospector}); }); }); return rows; }
    function anVisDaily(rows){ rows=rows||window._anVisRows||[]; const by={}; rows.forEach(x=>{ if(anTeamMatch(x.team)&&anLocMatch(x.loc)) by[x.day]=(by[x.day]||0)+1; }); return by; }
    // Show ratio — MISMA base que "citas agendadas" (fecha en que se agendó, no fecha de la cita)
    function anOutcome(rows){ rows=rows||window._outcomeRows||[]; const o={showed:0,noshow:0,cancelled:0,pending_future:0,pending_stale:0}; rows.forEach(x=>{ if(anTeamMatch(x.team)&&anLocMatch(x.loc)&&(x.status in o)) o[x.status]+=x.n; }); return o; }
    // No-show por anticipación (filas team,loc,bucket,status)
    function anLead(){ const rows=window._leadRows||[]; const lead=[0,1,2,3,4].map(()=>({showed:0,noshow:0})); rows.forEach(x=>{ if(anTeamMatch(x.team)&&anLocMatch(x.loc)){ const o=lead[x.bucket]; if(o) o[x.status]+=x.n; } }); return lead; }
    // Ventas (desde reportes) — cc = ventas donde hubo setter; closers = por equipo del closer
    function anVentas(list){ const sel=window._anTeam||'all'; let active=0,total=0; (list||[]).forEach(r=>{ const loc=anLocOfReport(r); if(!anLocMatch(loc))return; (r.visits||[]).forEach(v=>{ if(v.sale!==true)return; const pass=sel==='cc'?!!clean(v.setter):anTeamMatch(anSaleTeam(v)); if(!pass)return; total++; if(v.cancelled!==true)active++; }); }); return {total,active}; }
    // Top agendadores (citas por persona, filtrado)
    function anTopCitas(){ const cpd=window._citasPersonDay||{}; const agg={}; Object.keys(cpd).forEach(d=>{ const day=cpd[d]; Object.keys(day).forEach(ln=>{ const p=day[ln]; if(!anTeamMatch(p.team))return; let n=0; if((window._anLoc||'all')==='all')n=(p.orlando||0)+(p.kissimmee||0)+(p.otro||0); else n=p[window._anLoc]||0; if(n<=0)return; const a=(agg[ln]=agg[ln]||{name:p.name,n:0}); a.n+=n; }); }); return Object.values(agg).sort((x,y)=>y.n-x.n); }
    function sumVals(o){ return Object.values(o).reduce((a,b)=>a+b,0); }
    function anDeltaObj(cur,prev,pp){ let d,txt; if(pp){ d=cur-prev; txt=(d>=0?'▲ +':'▼ ')+Math.abs(d)+' pts'; } else { if(!prev){ return {txt: cur>0?'nuevo':'—', color:'var(--gray-400)'}; } d=Math.round((cur-prev)/prev*100); txt=(d>=0?'▲ ':'▼ ')+Math.abs(d)+'%'; } return {txt, color:d>0?'#10b981':d<0?'#ef4444':'var(--gray-400)'}; }
    function anSeg(cur,opts,fn){ return `<div style="display:inline-flex;background:var(--gray-100);border-radius:12px;padding:3px;gap:2px;">`+opts.map(o=>`<button onclick="${fn}('${o.v}')" style="padding:7px 14px;border:none;border-radius:9px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;background:${cur===o.v?'white':'transparent'};color:${cur===o.v?'var(--primary)':'var(--gray-500)'};box-shadow:${cur===o.v?'0 1px 3px rgba(0,0,0,.12)':'none'};transition:all .15s;">${o.l}</button>`).join('')+`</div>`; }
    function anKpi(icon,label,val,suf,dl,color){ return `<div class="section-card" style="padding:14px 16px;flex:1;min-width:148px;"><div style="font-size:12px;color:var(--gray-500);font-weight:600;">${icon} ${label}</div><div style="font-size:29px;font-weight:800;color:${color||'var(--gray-900)'};line-height:1.12;margin-top:3px;">${val}<span style="font-size:14px;font-weight:600;color:var(--gray-400);">${suf||''}</span></div><div style="font-size:11px;font-weight:700;color:${dl.color};margin-top:2px;">${dl.txt} <span style="color:var(--gray-400);font-weight:500;">vs mes pasado</span></div></div>`; }

    // ===== Citas sin marcar — cola operativa manager, interconectada con GHL =====
    // Nombre del lead → enlace al contacto en el CRM (pestaña nueva). Cae al título de la cita si aún no se resolvió el nombre.
    function staleLeadLink(it){
      const nm=((it.contactName||'').trim())||((it.title||'').trim())||'(sin nombre)';
      const base='flex:1;min-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
      if(!it.contactId) return `<span style="${base}color:var(--gray-700);">${escapeHtml(nm)}</span>`;
      const url=`https://app.gohighlevel.com/v2/location/${encodeURIComponent(it.locationId||'')}/contacts/detail/${encodeURIComponent(it.contactId)}`;
      return `<a href="${url}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" style="${base}color:var(--primary);font-weight:600;text-decoration:underline;text-underline-offset:2px;">${escapeHtml(nm)}</a>`;
    }
    function anStaleGroups(){
      const rows=window._staleAppts||[]; const agg={};
      rows.forEach(r=>{ if(!anTeamMatch(r.team)||!anLocMatch(r.loc))return;
        const key=r.personLn||'—'; const g=(agg[key]=agg[key]||{name:r.personName||'(sin nombre)',items:[]}); g.items.push(r); });
      return Object.values(agg).sort((a,b)=>b.items.length-a.items.length);
    }
    function toggleStaleCard(){ window._anStaleOpen=!window._anStaleOpen; render(); }
    function toggleStaleAgent(key){ window._anStaleOpenAgents=window._anStaleOpenAgents||new Set(); const s=window._anStaleOpenAgents; if(s.has(key))s.delete(key); else s.add(key); render(); }
    async function anMarkAppt(id,status,btn){
      if(btn){ btn.disabled=true; const sib=btn.parentElement.querySelectorAll('button'); sib.forEach(b=>b.disabled=true); btn.textContent='...'; }
      try{
        const r=await fetch(`${SUPA_URL}/functions/v1/mark-appointment`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({appointmentId:id,status})});
        if(r.status===410){ // cita ya no existe en el CRM (borrada/duplicada) — se quita sola de la lista
          window._staleAppts=(window._staleAppts||[]).filter(x=>x.id!==id);
          render();
          alert('Esa cita ya no existe en el CRM (fue eliminada) — se quitó de la lista.');
          return;
        }
        if(!r.ok){ alert('No se pudo marcar, intenta de nuevo.'); if(btn){btn.disabled=false;btn.textContent=status==='showed'?'Llegó':'No llegó';} return; }
        window._staleAppts=(window._staleAppts||[]).filter(x=>x.id!==id);
        await loadAppts();
        render();
      }catch(e){ alert('Error de conexión.'); }
    }
    function anStaleCard(){
      if(me.role!=='manager') return '';
      const groups=anStaleGroups(); const total=groups.reduce((a,g)=>a+g.items.length,0);
      const open=!!window._anStaleOpen; const openAgents=window._anStaleOpenAgents||new Set();
      const badge=total>0?`<span style="background:#f59e0b;color:white;border-radius:10px;padding:2px 9px;font-size:12px;font-weight:800;">${total}</span>`:`<span style="background:#10b981;color:white;border-radius:10px;padding:2px 9px;font-size:12px;font-weight:800;">0 ✓</span>`;
      let body='';
      if(open){
        body = groups.length ? groups.map(g=>{
          const key=g.name.toLowerCase(); const isOpen=openAgents.has(key);
          const items = isOpen ? g.items.map(it=>{
            const d=new Date(it.start_time); const ds=`${d.getMonth()+1}/${d.getDate()}`;
            return `<div style="display:flex;align-items:center;gap:8px;padding:6px 4px 6px 28px;border-bottom:1px solid var(--gray-50);font-size:12px;flex-wrap:wrap;">
              <span style="color:var(--gray-400);white-space:nowrap;">${ds}</span>
              ${staleLeadLink(it)}
              <button onclick="event.stopPropagation();anMarkAppt('${it.id}','showed',this)" style="font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px;border:1px solid #10b981;background:white;color:#10b981;cursor:pointer;">Llegó</button>
              <button onclick="event.stopPropagation();anMarkAppt('${it.id}','noshow',this)" style="font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px;border:1px solid #ef4444;background:white;color:#ef4444;cursor:pointer;">No llegó</button>
            </div>`;
          }).join('') : '';

            <div class="clickable-row" onclick="toggleStaleAgent('${escapeAttr(key)}')" style="display:flex;align-items:center;gap:8px;padding:7px 4px;cursor:pointer;">
              <span style="font-size:11px;color:var(--gray-400);width:12px;">${isOpen?'▾':'▸'}</span>
              <span style="flex:1;font-weight:600;font-size:13px;">${escapeHtml(g.name)}</span>
              <span style="font-weight:800;font-size:13px;color:#f59e0b;">${g.items.length}</span>
            </div>${items}</div>`;
        }).join('') : '<div class="empty" style="padding:10px 4px;">🎉 Todo marcado — 0 pendientes.</div>';
      }
      return `<div class="section-card" style="margin-bottom:14px;">
        <div class="clickable-row" onclick="toggleStaleCard()" style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;">
          <div><div style="font-weight:800;font-size:14px;">🧹 Citas sin marcar</div><div style="font-size:11px;color:var(--gray-400);">${periodLabel()} · ${anTeamLabel()} · ${anLocLabel()} · las mismas del "sin marcar" de arriba</div></div>
          <div style="display:flex;align-items:center;gap:8px;">${badge}<span style="color:var(--gray-400);">${open?'▾':'▸'}</span></div>
        </div>
        ${open?`<div style="margin-top:8px;border-top:1px solid var(--gray-100);">${body}</div>`:''}
      </div>`;
    }

    function renderAnalytics(s){
      const cur=(allReports||[]).filter(r=>inPeriod(r.date));
      const prevLbl=window._anPrevLabel||'';
      const prev=(allReports||[]).filter(r=>r.date&&String(r.date).slice(0,7)===prevLbl);
      window._anVisRows=anBuildVisRows(cur);
      const prevVisRows=anBuildVisRows(prev);
      const citDaily=anCitasDaily();               window._anCitDaily=citDaily;
      const visDaily=anVisDaily(window._anVisRows); window._anVisDaily=visDaily;
      // KPIs actuales
      const citas=sumVals(citDaily), visitas=sumVals(visDaily);
      const show=anOutcome(), sr=showRate(show), dec=show.showed+show.noshow;
      const ventas=anVentas(cur);
      // KPIs mes anterior
      const citasP=sumVals(anCitasDaily(window._citasRowsPrev));
      const visitasP=sumVals(anVisDaily(prevVisRows));
      const srP=showRate(anOutcome(window._outcomeRowsPrev));
      const ventasP=anVentas(prev);
      const rc=dec?(sr>=60?'#10b981':sr>=45?'#e6a52c':'#ef4444'):'var(--gray-300)';

      const filterBar=`<div class="section-card" style="margin-bottom:14px;padding:13px 16px;">
        <div style="display:flex;flex-wrap:wrap;gap:18px;">
          <div><div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--gray-400);margin-bottom:6px;">Equipo</div>${anSeg(window._anTeam,[{v:'all',l:'Todos'},{v:'cc',l:'Call Center'},{v:'closers',l:'Closers'}],'setAnTeam')}</div>
          <div><div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--gray-400);margin-bottom:6px;">Ubicación</div>${anSeg(window._anLoc,[{v:'all',l:'Ambas'},{v:'orlando',l:'Orlando'},{v:'kissimmee',l:'Kissimmee'}],'setAnLoc')}</div>
        </div></div>`;

      const kpis=`<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;">
        ${anKpi('📅','Citas agendadas',citas,'',anDeltaObj(citas,citasP),'#3b82f6')}
        ${anKpi('🚶','Visitas traídas',visitas,'',anDeltaObj(visitas,visitasP),'#f97316')}
        ${anKpi('🎯','Show rate',dec?sr:'—',dec?'%':'',anDeltaObj(sr,srP,true),rc)}
        ${anKpi('💰','Ventas',fmtW(ventas.active),'',anDeltaObj(ventas.active,ventasP.active),'#8b5cf6')}
      </div>`;

      const trendCard=`<div class="section-card" style="margin-bottom:14px;">
        <div style="font-weight:800;font-size:15px;">📈 Citas y visitas por día</div>
        <div style="font-size:12px;color:var(--gray-400);">${anTeamLabel()} · ${anLocLabel()} · toca un punto para ver quién ›</div>
        <div id="an-combo"></div></div>`;

      const showTotal=show.showed+show.noshow+show.cancelled+show.pending_future+show.pending_stale;
      const staleWarn=show.pending_stale>0?`<div style="margin-top:10px;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:8px 10px;font-size:11.5px;color:#92400e;line-height:1.4;">⚠️ ${show.pending_stale} citas ya pasaron su fecha y nadie les puso resultado en el CRM (ni llegó, ni no llegó, ni canceló) — hay que actualizarlas para que el % sea real.</div>`:'';
      const showCard=`<div class="section-card" style="margin-bottom:14px;">
        <div style="font-weight:800;font-size:15px;">🎯 Show ratio</div>
        <div style="font-size:12px;color:var(--gray-400);">${anTeamLabel()} · ${anLocLabel()} · de las mismas ${showTotal} citas agendadas de arriba (% es solo de las que ya se resolvieron)</div>
        <div class="clickable-row" onclick="anDrillShow()" style="display:flex;align-items:center;gap:14px;margin-top:8px;cursor:pointer;border-radius:12px;padding:6px;">
          <div id="an-donut" style="width:140px;flex:0 0 140px;"></div>
          <div style="flex:1;min-width:150px;">
            <div style="font-size:36px;font-weight:800;color:${rc};line-height:1;">${dec?sr+'%':'—'}</div>
            <div style="font-size:12px;color:var(--gray-500);">llegaron a su cita, de ${dec} ya resueltas ›</div>
            <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:12px;">
              <span style="color:#10b981;font-weight:700;">● ${show.showed} llegó</span>
              <span style="color:#ef4444;font-weight:700;">● ${show.noshow} no llegó</span>
              <span style="color:#94a3b8;font-weight:700;">● ${show.cancelled} canceló</span>
              <span style="color:#60a5fa;font-weight:700;">● ${show.pending_future} por venir</span>
              <span style="color:#f59e0b;font-weight:700;">● ${show.pending_stale} sin marcar</span>
            </div>
            ${staleWarn}
          </div></div></div>`;

      const noshowCard=`<div class="section-card" style="margin-bottom:14px;">
        <div style="font-weight:800;font-size:15px;">🔴 Riesgo de no-show por anticipación</div>
        <div style="font-size:12px;color:var(--gray-400);">Cuántos días antes se agendó → % que NO llegó · toca una barra para ver quién ›</div>
        <div id="an-noshow"></div></div>`;

      const top=anTopCitas().slice(0,10); const topMax=top.length?top[0].n:1;
      const topCard=`<div class="section-card" style="margin-bottom:14px;">
        <div style="font-weight:800;font-size:15px;">🏆 Top agendadores</div>
        <div style="font-size:12px;color:var(--gray-400);">${anTeamLabel()} · ${anLocLabel()} · citas agendadas · toca para el perfil</div>
        <div style="margin-top:8px;">${top.length?top.map((r,i)=>`<div class="clickable-row" onclick="goProfile('${escapeAttr(r.name)}','${facetForName(r.name)}')" style="display:flex;align-items:center;gap:10px;padding:7px 4px;border-bottom:1px solid var(--gray-100);cursor:pointer;">
          <span style="color:var(--gray-400);font-size:12px;width:16px;">${i+1}.</span>
          <div style="flex:1;min-width:0;"><div style="font-weight:600;font-size:13px;">${escapeHtml(r.name)}</div><div style="height:5px;border-radius:3px;background:var(--gray-100);margin-top:4px;overflow:hidden;"><div style="height:100%;width:${Math.round(r.n/topMax*100)}%;background:#3b82f6;border-radius:3px;"></div></div></div>
          <span style="font-weight:800;font-size:14px;white-space:nowrap;">${r.n}</span></div>`).join(''):'<div class="empty">Sin datos</div>'}</div></div>`;

      document.getElementById('main-content').innerHTML=
        `<div class="page-title">Análisis de producción</div>
         <div class="page-sub">${periodLabel()} · citas, visitas y show ratio por equipo y ubicación</div>
         <div style="margin-top:14px;">`+filterBar+kpis+trendCard+showCard+anStaleCard()+noshowCard+topCard+`</div>`;
      anMountCombo('an-combo');
      anMountDonut('an-donut', show);
      anMountNoshow('an-noshow');
    }

    function anMountCombo(id){
      const days=trendDays();
      const cit=days.map(d=>(window._anCitDaily||{})[d]||0);
      const vis=days.map(d=>(window._anVisDaily||{})[d]||0);
      mountChart(id,{
        chart:{type:'area',height:270,toolbar:{show:false},fontFamily:'inherit',events:{
          dataPointSelection:(e,ctx,cfg)=>anDrillDay(cfg.seriesIndex===1?'vis':'cit',days[cfg.dataPointIndex]),
          markerClick:(e,ctx,{seriesIndex,dataPointIndex})=>anDrillDay(seriesIndex===1?'vis':'cit',days[dataPointIndex])}},
        series:[{name:'Citas agendadas',data:cit},{name:'Visitas traídas',data:vis}],
        xaxis:{categories:days.map(d=>{const p=d.split('-');return (+p[1])+'/'+(+p[2]);}),tickAmount:Math.min(days.length,10),labels:{style:{colors:'#94a3b8',fontSize:'10px'},rotate:0,hideOverlappingLabels:true},axisBorder:{show:false},axisTicks:{show:false}},
        yaxis:{min:0,forceNiceScale:true,labels:{style:{colors:'#94a3b8'}}},
        stroke:{curve:'smooth',width:2.5}, colors:['#3b82f6','#f97316'],
        fill:{type:'gradient',gradient:{shadeIntensity:1,opacityFrom:.20,opacityTo:0,stops:[0,90]}},
        dataLabels:{enabled:false}, markers:{size:3,hover:{size:5}},
        legend:{show:true,position:'top',horizontalAlign:'right',fontSize:'12px',markers:{width:9,height:9,radius:9},itemMargin:{horizontal:8}},
        grid:{borderColor:'#eef1f4',strokeDashArray:3}, tooltip:{shared:true}
      });
    }
    function anMountDonut(id,st){
      st=st||{}; const showed=st.showed||0,noshow=st.noshow||0,canc=st.cancelled||0,futura=st.pending_future||0,stale=st.pending_stale||0;
      if((showed+noshow+canc+futura+stale)===0){ const el=document.getElementById(id); if(el)el.innerHTML='<div style="height:140px;display:flex;align-items:center;justify-content:center;color:var(--gray-300);font-size:12px;">Sin citas</div>'; return; }
      mountChart(id,{
        chart:{type:'donut',height:140,fontFamily:'inherit'},
        series:[showed,noshow,canc,futura,stale], labels:['Llegó','No llegó','Canceló','Por venir','Sin marcar'],
        colors:['#10b981','#ef4444','#cbd5e1','#60a5fa','#f59e0b'], legend:{show:false}, dataLabels:{enabled:false}, stroke:{width:0},
        plotOptions:{pie:{donut:{size:'68%',labels:{show:false}}}},
        tooltip:{y:{formatter:v=>v+' citas'}}
      });
    }
    function anMountNoshow(id){
      const nl=anLead();
      const cats=['Mismo día','Sig. día','2-3 días','4-7 días','8+ días'];
      const data=nl.map(o=>{const t=o.showed+o.noshow;return t?Math.round(o.noshow/t*100):0;});
      const counts=nl.map(o=>o.showed+o.noshow);
      mountChart(id,{
        chart:{type:'bar',height:240,toolbar:{show:false},fontFamily:'inherit',events:{dataPointSelection:(e,ctx,cfg)=>anDrillLead(cfg.dataPointIndex)}},
        series:[{name:'No-show',data}],
        xaxis:{categories:cats,labels:{style:{colors:'#94a3b8'}}},
        colors:['#ef4444'],
        plotOptions:{bar:{borderRadius:6,columnWidth:'55%',cursor:'pointer'}},
        dataLabels:{enabled:true,formatter:v=>v+'%',offsetY:-20,style:{colors:['#334155'],fontWeight:'700'}},
        yaxis:{max:100,labels:{formatter:v=>v+'%',style:{colors:'#94a3b8'}}},
        grid:{borderColor:'#eef1f4',strokeDashArray:3},
        states:{active:{filter:{type:'none'}}},
        tooltip:{y:{formatter:(v,{dataPointIndex})=>v+'% no-show · '+(counts[dataPointIndex]||0)+' citas'}}
      });
    }

    // ===== Drill-down: clic en gráfica → nombres de personas =====
    function drillModal(title, subtitle, items){
      const body = items.length ? items.map((it,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--gray-100);">
        <div><span style="color:var(--gray-400);font-size:12px;">${i+1}.</span> <span style="font-weight:600;">${escapeHtml(it.name)}</span>${it.sub?`<div style="font-size:11px;color:var(--gray-500);margin-left:16px;">${it.sub}</div>`:''}</div>
        <div style="text-align:right;font-weight:800;color:${it.color||'var(--gray-900)'};white-space:nowrap;">${it.main}</div></div>`).join('') : '<div class="empty">Sin datos</div>';
      const o=document.getElementById('drill-modal'); if(o)o.remove();
      document.body.insertAdjacentHTML('beforeend',`<div id="drill-modal" style="position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:3000;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto;" onclick="if(event.target===this)this.remove()">
        <div style="background:white;border-radius:16px;padding:18px;max-width:480px;width:100%;margin:auto;box-shadow:0 24px 60px rgba(0,0,0,.28);">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;"><div><div style="font-weight:800;font-size:15px;">${title}</div>${subtitle?`<div style="font-size:12px;color:var(--gray-400);">${subtitle}</div>`:''}</div>
          <button onclick="this.closest('#drill-modal').remove()" style="background:var(--gray-100);border:none;border-radius:8px;width:30px;height:30px;cursor:pointer;flex:0 0 auto;">✕</button></div>
          <div style="margin-top:10px;">${body}</div>
        </div></div>`);
    }
    // Show rate por persona, respetando el filtro global (equipo × ubicación)
    function anDrillShow(){
      const bp=window._outcomeByPerson||{}; const loc=window._anLoc||'all'; const rows=[];
      Object.values(bp).forEach(p=>{
        if(!anTeamMatch(p.team||'otro')) return;
        const st = loc==='all' ? p.tot : (p.loc&&p.loc[loc]);
        if(!st) return; const d=(st.showed||0)+(st.noshow||0); if(!d) return;
        rows.push({name:p.name, rate:Math.round((st.showed||0)/d*100), dec:d, showed:st.showed||0, noshow:st.noshow||0});
      });
      rows.sort((a,b)=>b.dec-a.dec);
      drillModal('🎯 Show rate · '+anTeamLabel()+' · '+anLocLabel(), 'Show rate individual · '+periodLabel(),
        rows.map(r=>({name:r.name, main:r.rate+'%', color:r.rate>=60?'#10b981':r.rate>=45?'#e6a52c':'#ef4444', sub:`${r.showed} llegó · ${r.noshow} no llegó · ${r.dec} citas`})));
    }
    function anDrillLead(bucket){
      const lp=(window._leadByPerson||{})[bucket]||{}; const tm=window._agentTeam||{};
      const rows=Object.values(lp).map(p=>{ const t=tm[(p.name||'').toLowerCase()]||'otro'; const dec=p.showed+p.noshow; return {name:p.name,team:t,noshow:p.noshow,dec,rate:dec?Math.round(p.noshow/dec*100):0}; })
        .filter(r=>r.dec>0 && anTeamMatch(r.team));
      rows.sort((a,b)=>b.noshow-a.noshow||b.dec-a.dec);
      const names=['mismo día','siguiente día','2-3 días','4-7 días','8+ días'];
      drillModal('📅 Citas con '+names[bucket]+' de anticipación', 'Quién las agendó · '+anTeamLabel()+' · ordenado por no-show',
        rows.map(r=>({name:r.name, main:r.noshow+' no-show', color:'#ef4444', sub:`${r.dec} citas · ${r.rate}% no-show`})));
    }
    function anDrillDay(kind, day){
      const rows=[]; const loc=window._anLoc||'all';
      if(kind==='cit'){ const cpd=window._citasPersonDay||{}; const day1=cpd[day]||{};
        Object.values(day1).forEach(p=>{ if(!anTeamMatch(p.team))return; const n=loc==='all'?((p.orlando||0)+(p.kissimmee||0)+(p.otro||0)):(p[loc]||0); if(n>0)rows.push({name:p.name,n}); }); }
      else { (window._anVisRows||[]).forEach(x=>{ if(x.day!==day||!x.prospector)return; if(!anTeamMatch(x.team)||!anLocMatch(x.loc))return; const ln=x.prospector.toLowerCase(); let f=rows.find(r=>r._ln===ln); if(!f){f={_ln:ln,name:x.prospector,n:0};rows.push(f);} f.n++; }); }
      rows.sort((a,b)=>b.n-a.n);
      const dp=day.split('-');
      drillModal((kind==='cit'?'📅 Citas agendadas':'🚶 Visitas traídas')+' · '+(+dp[2])+' '+MONTHS[(+dp[1])-1], anTeamLabel()+' · '+anLocLabel(),
        rows.map(r=>({name:r.name, main:r.n+'', color:'var(--gray-900)'})));
    }

    function funnelCard(title,o,kind,sub,agentName){
      const isClose=kind==='close';
      const tag=isClose?'<span class="tag close">cierre</span>':'<span class="tag prospect">prospección</span>';
      const dl=dialerFor(agentName||(o.name));
      const aDays=agentActiveDays(agentName||(o.name));
      // Top-of-funnel (dialer) only makes sense on prospección or a closer's own prospecting.
      // On the CLOSE funnel we don't show calls (those belong to prospecting); show appointments as context only.
      const showTop=kind==='prospect';
      const stages=[
        ...(showTop?[
          {name:'Llamadas',val:dl.calls,color:'#0ea5e9',isDialer:true,note:perDay(dl.calls,aDays)+'/día'},
          {name:'Citas agendadas',val:dl.appointments,conv:pct(o.visits,dl.appointments),color:'#6366f1',isDialer:true,convLbl:'show rate',note:perDay(dl.appointments,aDays)+'/día'},
        ]:[]),
        {name:isClose?'Visitas atendidas':'Visitas',val:o.visits,color:'#3b82f6'},
        {name:'Aplicaron',val:o.applied,conv:pct(o.applied,o.visits),color:'#06b6d4'},
        {name:'Aprobados',val:o.approved,conv:pct(o.approved,o.applied),color:'#8b5cf6'},
        {name:'Ventas',val:o.sold,conv:pct(o.sold,o.approved),color:'#10b981'}
      ];
      const max=Math.max(showTop?dl.calls:o.visits,o.visits,1);
      return `<div class="section-card">
        <h3>${title}${tag}</h3>
        <p class="section-sub">${sub}${showTop?` · llamadas y citas en vivo del dialer · ${aDays} días activos`:''}</p>
        ${stages.map(st=>{
          const w=Math.max(pct(st.val,max),4);
          const convTxt=st.conv!==undefined?(st.convLbl?st.convLbl+' '+st.conv.toFixed(0)+'%':'↓'+st.conv.toFixed(0)+'%'):'';
          const noteTxt=st.note?`<div style="font-size:10px;color:#0ea5e9;font-weight:700;">${st.note}</div>`:'';
          return `<div class="funnel-stage"><div class="name">${st.name}${st.isDialer?' <span style="font-size:9px;color:#0ea5e9;font-weight:700;">●</span>':''}</div><div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${st.color};">${fmtShare(st.val)}</div></div><div class="conv">${noteTxt}${convTxt}</div></div>`;
        }).join('')}
        ${o.profit!==undefined&&o.profit>0?`<div style="margin-top:12px;padding-top:10px;border-top:1px dashed var(--gray-200);font-size:13px;color:var(--gray-600);">Monto total generado: <b style="color:var(--green);">${fmtMoney(o.profit)}</b></div>`:''}
        ${showTop&&!window._dialerOk?`<div style="margin-top:8px;font-size:11px;color:var(--gray-400);">Dialer offline — llamadas/citas mostradas como 0</div>`:''}
      </div>`;
    }

    function convCard(o,kind){
      const v2a=pct(o.applied,o.visits),a2ap=pct(o.approved,o.applied),ap2s=pct(o.sold,o.approved),v2s=pct(o.sold,o.visits);
      return `<div class="section-card">
        <h3>Tus conversiones</h3>
        <p class="section-sub">Qué tan eficiente eres en cada paso del embudo</p>
        <div class="conv-grid">
          <div class="conv-chip"><div class="pct ${pctCls(v2a,60,40)}">${v2a.toFixed(0)}%</div><div class="lbl">Visita → Aplicó</div><div class="num">${o.applied}/${o.visits}</div></div>
          <div class="conv-chip"><div class="pct ${pctCls(a2ap,45,30)}">${a2ap.toFixed(0)}%</div><div class="lbl">Aplicó → Aprobó</div><div class="num">${o.approved}/${o.applied}</div></div>
          <div class="conv-chip"><div class="pct ${pctCls(ap2s,75,50)}">${ap2s.toFixed(0)}%</div><div class="lbl">Aprobó → Venta</div><div class="num">${fmtShare(o.sold)}/${o.approved}</div></div>
          <div class="conv-chip"><div class="pct ${pctCls(v2s,20,10)}">${v2s.toFixed(0)}%</div><div class="lbl">Visita → Venta</div><div class="num">${fmtShare(o.sold)}/${o.visits}</div></div>
        </div>
      </div>`;
    }

    function closersForSetter(reports,setterName){
      const map={};
      reports.forEach(r=>(r.visits||[]).forEach(v=>{
        if(clean(v.setter)&&clean(v.setter).toLowerCase()===setterName.toLowerCase()){
          const c=clean(v.closer)||'Sin asignar';
          if(!map[c])map[c]={visits:0,sold:0};
          map[c].visits++;if(v.sale===true)map[c].sold++;
        }
      }));
      const rows=Object.entries(map).sort((a,b)=>b[1].visits-a[1].visits);
      if(!rows.length)return '';
      return `<div class="section-card">
        <h3>Quién atendió tus visitas</h3>
        <p class="section-sub">Los closers que recibieron las visitas que trajiste</p>
        <div class="table-wrap"><table><thead><tr><th>Closer</th><th>Visitas</th><th>Ventas</th><th>Conv.</th></tr></thead>
        <tbody>${rows.map(([c,d])=>`<tr><td class="agent-name-cell">${escapeHtml(c)}</td><td>${d.visits}</td><td class="val-strong">${d.sold}</td><td class="pct ${pctCls(pct(d.sold,d.visits),20,10)}">${pct(d.sold,d.visits).toFixed(0)}%</td></tr>`).join('')}</tbody></table></div>

    // ===== Leaderboards =====
    function setLbTab(t){lbTab=t;lbSort={key:'sold',dir:-1};

        mountChart('lb-chart',{
          chart:{type:'bar',height:Math.max(180,top.length*30+40),toolbar:{show:false},fontFamily:'inherit'},
          series:[{name:'Ventas',data:top.map(a=>+(a.sold).toFixed(1))}],

          dataLabels:{enabled:true,style:{colors:['#1a1a2e'],fontWeight:700},offsetX:18},

    // ===== AGENT DETAIL DRILL-DOWN =====
    let dtAgg='week'; // day | week | month
    let dtContext=null; // {name, facet}

    // Open a person's full profile page (from any leaderboard/list)
    function openAgentDetail(name,lbTabOrFacet){
      const facet=lbTabOrFacet==='setter'?'prospect':lbTabOrFacet==='closer'?'close':lbTabOrFacet;
      goProfile(name,facet);
    }
    function setDtAgg(m){dtAgg=m;render();}

    function isoWeekKey(dateISO){
      const d=new Date(dateISO+'T00:00:00');
      const day=(d.getDay()+6)%7; // Mon=0
      d.setDate(d.getDate()-day+3);
      const firstThu=new Date(d.getFullYear(),0,4);
      const week=1+Math.round(((d-firstThu)/86400000-3+((firstThu.getDay()+6)%7))/7);
      return `${d.getFullYear()}-S${String(week).padStart(2,'0')}`;
    }
    function periodKey(dateISO){
      if(dtAgg==='day')return dateISO;
      if(dtAgg==='week')return isoWeekKey(dateISO);
      return dateISO.slice(0,7); // month YYYY-MM
    }
    // Monday (start) of ISO week w in year y
    function isoWeekStart(y,w){
      const jan4=new Date(y,0,4);
      const jan4Mon=new Date(jan4);jan4Mon.setDate(jan4.getDate()-((jan4.getDay()+6)%7));
      const s=new Date(jan4Mon);s.setDate(jan4Mon.getDate()+(w-1)*7);return s;
    }
    function periodNice(key){
      const mn=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
      if(dtAgg==='day'){const[y,m,d]=key.split('-');return `${+d} ${mn[+m-1]}`;}
      if(dtAgg==='week'){const[y,w]=key.split('-S');const s=isoWeekStart(+y,+w);const e=new Date(s);e.setDate(e.getDate()+6);
        return s.getMonth()===e.getMonth()?`${s.getDate()}–${e.getDate()} ${mn[e.getMonth()]}`:`${s.getDate()} ${mn[s.getMonth()]}–${e.getDate()} ${mn[e.getMonth()]}`;}
      const[y,m]=key.split('-');return `${mn[+m-1].charAt(0).toUpperCase()+mn[+m-1].slice(1)} '${y.slice(2)}`;
    }

    // Build a closer/setter detail dataset (facet) with temporal series + origin
    function buildAgentDetail(name,facet){
      const reports=allReports.filter(r=>inPeriod(r.date)&&(filterLoc==='all'||r.location===filterLoc));
      const ln=name.toLowerCase();
      const byPeriod={}; // key -> {visits,applied,approved,sold}
      const origin={visits:{cc:0,own:0,walk:0,other:0},sold:{cc:0,own:0,walk:0,other:0}};
      const tot={visits:0,applied:0,approved:0,sold:0,profit:0,calls:0,appts:0};
      const eP=k=>byPeriod[k]||(byPeriod[k]={visits:0,applied:0,approved:0,sold:0,calls:0,appts:0});

      reports.forEach(r=>{
        (r.visits||[]).forEach(v=>{
          const setter=canonName(clean(v.setter)),c1=canonName(clean(v.closer)),c2=canonName(clean(v.closer2));
          const sb=v.scheduled_by, selfgen=sb==='Self-gen'||v.subgen===true;
          let mine=false, soldShare=0;
          if(facet==='close'){
            const isC1=c1&&c1.toLowerCase()===ln, isC2=c2&&c2.toLowerCase()===ln;
            if(isC1||isC2){mine=true;
              if(v.sale===true)soldShare=(c1&&c2)?0.5:1;}
          }else{ // prospect
            let prospector=setter||(selfgen&&c1?c1:null);
            if(prospector&&prospector.toLowerCase()===ln){mine=true;if(v.sale===true)soldShare=1;}
          }
          if(!mine)return;
          const k=periodKey(r.date);const p=eP(k);
          p.visits++;tot.visits++;
          if(v.applied===true){p.applied++;tot.applied++;}
          if(v.result==='approved'){p.approved++;tot.approved++;}
          if(v.sale===true){p.sold+=soldShare;tot.sold+=soldShare;tot.profit+=(soldShare===0.5?(v.net_profit||0)/2:(v.net_profit||0));}
          // Origin (only meaningful for closer facet — where visits come from)
          let org=setter?'cc':selfgen?'own':sb==='Walk-in'?'walk':'other';
          origin.visits[org]++;
          if(v.sale===true)origin.sold[org]+=soldShare;
        });
      });
      // Merge per-period dials + appointments from the daily reconciliation (GHL calendar +
      // dialer), so the day/week/month history shows LLAM. and CITAS per agent — not just
      // the period total. window._recon holds by_agent_status{calls,total} per day.
      const ln2=name.toLowerCase();
      (window._recon||[]).forEach(r=>{
        if(!inPeriod(r.recon_date))return;
        const bas=((r.detail||{}).by_agent_status||{})[ln2];
        if(!bas)return;
        const k=periodKey(r.recon_date);const p=eP(k);
        p.calls+=bas.calls||0;p.appts+=bas.total||0;
        tot.calls+=bas.calls||0;tot.appts+=bas.total||0;
      });
      // Llamadas de HOY, en vivo — la reconciliación diaria nunca incluye el día en curso
      // (corre 1 vez a las 8:30am y solo procesa "ayer para atrás"), así que este hueco se
      // llena aparte en cada refresh para que hoy no se vea en cero hasta mañana.
      const todayStr=todayISO();
      if(inPeriod(todayStr)){
        const liveToday=(window._liveTodayByAgent||{})[ln2];
        if(liveToday&&liveToday.calls){
          const k=periodKey(todayStr);const p=eP(k);
          p.calls+=liveToday.calls; tot.calls+=liveToday.calls;
        }
      }
      // Citas por día agendadas por esta persona (createdBy) desde ghl_appointments
      const _daily=(window._apptsDailyByName||{})[ln2]||{};
      Object.keys(_daily).forEach(day=>{ if(!inPeriod(day))return; const k=periodKey(day); const p=eP(k); p.appts+=_daily[day]; tot.appts+=_daily[day]; });
      const keys=Object.keys(byPeriod).sort();
      return {byPeriod,keys,origin,tot};
    }

    function projectedSales(sold){
      const now=new Date();
      const todayNum=now.getDate();
      if(filterPeriod==='mtd'){
        const totalDays=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
        if(todayNum===0)return null;
        return {proj:Math.round(sold/todayNum*totalDays),total:totalDays,elapsed:todayNum};
      }
      if(/^\d{4}-\d{2}$/.test(filterPeriod)){
        const[y,m]=filterPeriod.split('-').map(Number);
        if(y===now.getFullYear()&&m===now.getMonth()+1){
          const totalDays=new Date(y,m,0).getDate();
          return {proj:Math.round(sold/todayNum*totalDays),total:totalDays,elapsed:todayNum};
        }
      }
      return null;
    }
    function renderProfilePage(s){
      if(!profileCtx)return;
      const {name,facet}=profileCtx;
      const d=buildAgentDetail(name,facet);
      const isClose=facet==='close';

          ${(()=>{const _p=projectedSales(primary.sold);if(!_p)return '';return `<div class="hero-stat"><div class="v" style="color:#fbbf24;">${_p.proj}</div><div class="k">Proyección mes</div><div class="c">día ${_p.elapsed}/${_p.total}</div></div>`;})()}
        </div>
      </div>`;
      // Funnel(s) — closers show cierre + their own prospección; setters show prospección
      if(isClose){
        html+=funnelCard('Cierre',rowClose||{visits:0,applied:0,approved:0,sold:0,profit:0},'close','Visitas que atendió (propias, de setters y walk-ins)',name);
        if(rowProspect)html+=funnelCard('Prospección propia',rowProspect,'prospect','Sus llamadas, citas y visitas self-gen',name);
      }else{
        html+=funnelCard('Prospección',rowProspect||{visits:0,applied:0,approved:0,sold:0,profit:0},'prospect','Llamadas, citas y visitas que trajo, y su conversión',name);
      }
      // Evolución temporal: mode toggle
      html+=`<div class="mode-toggle">
        ${['day','week','month'].map(m=>`<button class="filter-tab ${dtAgg===m?'active':''}" onclick="setDtAgg('${m}')">${{day:'Diario',week:'Semanal',month:'Mensual'}[m]}</button>`).join('')}
      </div>`;

      // Averages
      html+=`<div class="avg-grid">
        <div class="avg-card"><div class="v">${(d.tot.visits/nP).toFixed(1)}</div><div class="k">Visitas/${avgLbl}</div></div>

        <div class="avg-card"><div class="v" style="color:var(--green);">${fmtMoney(d.tot.profit)}</div><div class="k">Monto total</div></div>
      </div>`;

      // GHL appointment status — the REAL calendar outcome of this agent's appointments
      const st=apptStatusFor(name);
      if(st.total>0){
        const sr=ghlShowRate(st),decided=st.showed+st.noshow+st.cancelled+st.invalid,pending=(st.confirmed||0)+(st.new||0);
        html+=`<div class="section-card"><h3>Estatus de citas <span class="tag prospect">GHL</span></h3>

          <div class="conv-chip"><div class="pct ${pctCls(ap2s,75,50)}">${ap2s.toFixed(0)}%</div><div class="lbl">Aprobó → Venta</div><div class="num">${fmtShare(d.tot.sold)}/${d.tot.approved}</div></div>
          <div class="conv-chip"><div class="pct ${pctCls(v2s,20,10)}">${v2s.toFixed(0)}%</div><div class="lbl">Visita → Venta</div><div class="num">${fmtShare(d.tot.sold)}/${d.tot.visits}</div></div>
        </div></div>`;

      // Trend chart
      html+=`<div class="section-card"><h3>Tu evolución (${{day:'por día',week:'por semana',month:'por mes'}[dtAgg]})</h3>
        <p class="section-sub">Cómo cambia tu producción en el tiempo</p>
        <div id="dt-trend"></div></div>`;

      // Historical grid — muestra CADA día/semana/mes del período hasta hoy (rellena con ceros
      // los días sin actividad), para ver el día a día completo, no solo los días con visitas.
      const EMPTY={visits:0,applied:0,approved:0,sold:0,calls:0,appts:0};
      const _pr=periodRange(), _today=todayISO(), _end=_pr.to<_today?_pr.to:_today;
      const fullKeys=(()=>{ const ks=[],seen=new Set(); let dd=new Date(_pr.from+'T00:00:00'); const ed=new Date(_end+'T00:00:00'); let g=0;
        while(dd<=ed && g++<400){ const iso=`${dd.getFullYear()}-${String(dd.getMonth()+1).padStart(2,'0')}-${String(dd.getDate()).padStart(2,'0')}`; const k=periodKey(iso); if(!seen.has(k)){seen.add(k);ks.push(k);} dd.setDate(dd.getDate()+1);} return ks; })();
      const useKeys=(fullKeys.length&&fullKeys.length<=120)?fullKeys:d.keys;
      const keysDesc=[...useKeys].reverse(); // most recent first
      // pre-compute accumulated sales from oldest → newest
      const acc={};let cV=0,cAp=0,cApr=0,cS=0;
      useKeys.forEach(k=>{const p=d.byPeriod[k]||EMPTY;cV+=p.visits;cAp+=p.applied;cApr+=p.approved;cS+=p.sold;
        acc[k]={v:cV,ap:cAp,apr:cApr,s:cS};});
      const histRows=keysDesc.map(k=>{
        const p=d.byPeriod[k]||EMPTY;const a=acc[k];
        const v2a=pct(p.applied,p.visits),ap2s=pct(p.sold,p.approved),v2s=pct(p.sold,p.visits);
        return `<tr>
          <td style="font-weight:700;">${periodNice(k)}</td>

      }).join('');
      html+=`<div class="section-card"><h3>Histórico ${{day:'diario',week:'semanal',month:'mensual'}[dtAgg]}</h3>

        <div class="table-wrap"><table>
          <thead><tr><th>${dtAgg==='day'?'Día':dtAgg==='week'?'Semana':'Mes'}</th><th>Llam.</th><th>Citas</th><th>Visitas</th><th>Aplic.</th><th>Aprob.</th><th>Ventas</th><th>V→A</th><th>Ap→V</th><th>V→Vta</th><th>Acum.</th></tr></thead>

          <tfoot><tr style="border-top:2px solid var(--gray-300);font-weight:800;">
            <td>TOTAL</td><td>${d.tot.calls||0}</td><td>${d.tot.appts||0}</td><td>${d.tot.visits}</td><td>${d.tot.applied}</td><td>${d.tot.approved}</td><td>${fmtShare(d.tot.sold)}</td>
            <td class="pct">${v2a.toFixed(0)}%</td><td class="pct">${ap2s.toFixed(0)}%</td><td class="pct">${v2s.toFixed(0)}%</td><td>${fmtMoney(d.tot.profit)}</td>
          </tr></tfoot>
        </table></div>
        <p style="font-size:11px;color:var(--gray-400);margin-top:8px;">Llamadas y Citas se llenan al conectar el WaveDialer</p>
      </div>`;

      // Origin (closer facet only — where visits/sales come from)
      if(isClose){
        html+=`<div class="section-card"><h3>De dónde vienen tus visitas y ventas</h3>
          <p class="section-sub">Call Center (setter) vs Propias (self-gen) vs Walk-in</p>
          <div class="donut-grid"><div id="dt-origin-v"></div><div id="dt-origin-s"></div></div></div>`;
      }else{
        // setter: which closers
        html+=`<div class="section-card"><h3>A qué closers fueron tus visitas</h3>
          <div class="donut-grid"><div id="dt-origin-v"></div><div id="dt-origin-s"></div></div></div>`;
      }

      // Self-report (accountability) — only when an agent is viewing their OWN profile
      if(isMe&&me.role!=='manager')html+=`<div class="section-card" style="text-align:center;border:1.5px solid #bbf7d0;background:#f0fdf4;"><h3>📝 Tu reporte de hoy</h3><p class="section-sub">Sube tu producción del día (llamadas, contactos, citas y visitas).</p><button class="report-btn" style="font-size:15px;padding:12px 22px;" onclick="navigate('report')">Someter reporte de hoy →</button></div>`;

      document.getElementById('main-content').innerHTML=html;

      // Charts
      if(typeof ApexCharts==='undefined')return;
      // Trend
      const cats=d.keys.map(periodNice);
      mountChart('dt-trend',{
        chart:{type:'line',height:250,toolbar:{show:false},fontFamily:'inherit'},
        series:[
          {name:'Visitas',type:'column',data:d.keys.map(k=>d.byPeriod[k].visits)},
          {name:'Ventas',type:'line',data:d.keys.map(k=>+d.byPeriod[k].sold.toFixed(1))}
        ],
        stroke:{width:[0,3],curve:'smooth'},colors:['#cbd5e1','#10b981'],
        xaxis:{categories:cats,labels:{style:{fontSize:'10px'}}},
        yaxis:[{title:{text:'Visitas',style:{fontSize:'10px'}}},{opposite:true,title:{text:'Ventas',style:{fontSize:'10px'}}}],
        plotOptions:{bar:{borderRadius:3,columnWidth:'55%'}},markers:{size:4},
        dataLabels:{enabled:false},legend:{position:'top'},grid:{borderColor:'#e5e7eb',strokeDashArray:3}
      });

      // Origin donuts
      if(isClose){
        const ov=d.origin.visits, os=d.origin.sold;
        const labels=['Call Center','Propias','Walk-in','Otra'];
        const vData=[ov.cc,ov.own,ov.walk,ov.other], sData=[os.cc,os.own,os.walk,os.other];
        const colors=['#3b82f6','#10b981','#f97316','#94a3b8'];
        donut('dt-origin-v','Visitas por origen',labels,vData,colors);
        donut('dt-origin-s','Ventas por origen',labels,sData.map(x=>+x.toFixed(1)),colors);
      }else{
        // closers for setter
        const reports=allReports.filter(r=>inPeriod(r.date)&&(filterLoc==='all'||r.location===filterLoc));
        const cmap={};const ln=name.toLowerCase();
        reports.forEach(r=>(r.visits||[]).forEach(v=>{
          const st=clean(v.setter);if(st&&st.toLowerCase()===ln){const c=clean(v.closer)||'Sin asignar';
            cmap[c]=cmap[c]||{v:0,s:0};cmap[c].v++;if(v.sale===true)cmap[c].s++;}
        }));
        const ents=Object.entries(cmap).sort((a,b)=>b[1].v-a[1].v).slice(0,8);
        donut('dt-origin-v','Visitas por closer',ents.map(e=>e[0]),ents.map(e=>e[1].v),null);
        donut('dt-origin-s','Ventas por closer',ents.map(e=>e[0]),ents.map(e=>e[1].s),null);
      }
    }

    function donut(id,title,labels,data,colors){
      const el=document.getElementById(id);if(!el)return;
      const filtered=labels.map((l,i)=>[l,data[i]]).filter(x=>x[1]>0);
      if(!filtered.length){el.innerHTML=`<div style="text-align:center;padding:20px;color:var(--gray-400);font-size:12px;">${title}: sin datos</div>`;return;}
      mountChart(id,{
        chart:{type:'donut',height:240,fontFamily:'inherit'},
        series:filtered.map(x=>x[1]),labels:filtered.map(x=>x[0]),
        colors:colors||['#3b82f6','#10b981','#f59e0b','#8b5cf6','#e94560','#06b6d4','#f97316','#94a3b8'],
        legend:{position:'bottom',fontSize:'11px'},
        title:{text:title,style:{fontSize:'12px',fontWeight:700,color:'#334155'}},
        dataLabels:{enabled:true,formatter:(v,o)=>o.w.config.series[o.seriesIndex]},
        plotOptions:{pie:{donut:{size:'58%'}}}
      });
    }

    const _charts={};
    function mountChart(id,opts){
      const el=document.getElementById(id);if(!el)return;
      if(el.offsetWidth===0){return;} // skip detached/zero-width containers (avoids ApexCharts NaN)
      if(_charts[id]){try{_charts[id].destroy();}catch(e){}}
      el.innerHTML='';const c=new ApexCharts(el,opts);_charts[id]=c;c.render();
    }
    // Destroy all live charts before swapping views (prevents orphaned-chart NaN errors)
    function destroyCharts(){Object.keys(_charts).forEach(id=>{try{_charts[id].destroy();}catch(e){}delete _charts[id];});}

    // ===== KPI report form (integrated 'Reporte de hoy' view) =====
    let rptVisits=[], rptTruth={calls:null,contacts:null,appointments:null,showed:null}, rptValidate=false;
    const RPT_FUNNEL=[['came','Solo vino (no aplicó)'],['denied','Negó'],['approved','Aprobó'],['sold','Vendió']];
    const RPT_ORIGINS=[['cc','Call Center'],['closer2','Otro closer'],['own','Self-gen'],['ref_direct','Referido directo'],['walkin','Walk-in']];
    const RPT_SOURCES=[['marketplace','Marketplace'],['fb_ads','Facebook Ads'],['crm','CRM recuperado'],['referido','Referido']];
    function rptAddVisit(){rptVisits.push({client:'',origin:me.role==='closer'?'':'brought',source:null,stage:null});rptRenderVisits();}
    function rptRemoveVisit(i){rptVisits.splice(i,1);rptRenderVisits();}
    function rptSetV(i,k,v){rptVisits[i][k]=v;if(k==='origin'&&v!=='own')rptVisits[i].source=null;rptRenderVisits();}
    function rptErrors(){
      const errs=[];
      rptVisits.forEach((v,i)=>{
        const started=(v.client||'').trim()||v.stage||v.source||(me.role==='closer'&&v.origin);
        if(!started)return;
        const m=[];
        if(!(v.client||'').trim())m.push('cliente');
        if(me.role==='closer'&&!v.origin)m.push('origen');
        if(me.role==='closer'&&v.origin==='own'&&!v.source)m.push('fuente');
        if(!v.stage)m.push('llegó a');
        if(m.length)errs.push({i,missing:m});
      });
      return errs;
    }
    function rptRenderVisits(){
      const host=document.getElementById('visits-list'); if(!host)return;
      host.innerHTML=rptVisits.map((v,i)=>{
        const started=(v.client||'').trim()||v.stage||v.source||(me.role==='closer'&&v.origin);
        const e=cond=>rptValidate&&started&&cond?' err':'';
        const sel=(field,opts,ph,bad)=>`<select class="vsel ${v[field]?'set':''}${bad}" onchange="rptSetV(${i},'${field}',this.value)"><option value="">${ph}</option>${opts.map(([k,l])=>`<option value="${k}" ${v[field]===k?'selected':''}>${l}</option>`).join('')}</select>`;
        const originRow=me.role==='closer'?`<div class="vrow"><span class="field-lbl">Origen</span>${sel('origin',RPT_ORIGINS,'— elegir —',e(!v.origin))}</div>`:'';
        const sourceRow=(me.role==='closer'&&v.origin==='own')?`<div class="vrow"><span class="field-lbl">Fuente</span>${sel('source',RPT_SOURCES,'— fuente —',e(!v.source))}</div>`:'';
        const stageCls=(v.stage==='sold'||v.stage==='approved')?'good':(v.stage==='denied'?'bad':(v.stage?'set':''));
        const stageRow=`<div class="vrow"><span class="field-lbl">Llegó a</span><select class="vsel ${stageCls}${e(!v.stage)}" onchange="rptSetV(${i},'stage',this.value)"><option value="">— elegir —</option>${RPT_FUNNEL.map(([k,l])=>`<option value="${k}" ${v.stage===k?'selected':''}>${l}</option>`).join('')}</select></div>`;
        return `<div class="visit"><div class="vhead"><span class="vnum">Visita ${i+1}</span>${rptVisits.length>1?`<button class="vremove" onclick="rptRemoveVisit(${i})">✕</button>`:''}</div>
          <input class="txt-input${e(!(v.client||'').trim())}" placeholder="Cliente (nombre o teléfono)" value="${(v.client||'').replace(/"/g,'&quot;')}" oninput="rptVisits[${i}].client=this.value">
          ${originRow}${sourceRow}${stageRow}</div>`;
      }).join('');
      if(rptValidate&&!rptErrors().length){const m=document.getElementById('val-msg');if(m)m.classList.remove('show');}
    }
    function rptVal(id){const el=document.getElementById(id);return el&&el.value!==''?parseInt(el.value):null;}
    function rptConfirm(){
      rptValidate=true;
      const errs=rptErrors();
      if(errs.length){
        document.getElementById('cmp-card').classList.add('hidden');
        document.getElementById('btn-submit').classList.add('hidden');
        rptRenderVisits();
        const msg=document.getElementById('val-msg');
        msg.innerHTML=`⚠️ Completa <b>Origen, Fuente y Llegó a</b> en cada visita antes de avanzar (${errs.length} sin completar).`;
        msg.classList.add('show');
        const first=document.querySelector('.txt-input.err, .vsel.err'); if(first)first.scrollIntoView({behavior:'smooth',block:'center'});
        return;
      }
      document.getElementById('val-msg').classList.remove('show');
      const realVisits=rptVisits.filter(v=>(v.client||'').trim()).length;
      const rows=[
        rptCmpRow('📞 Llamadas',rptVal('d-calls'),rptTruth.calls),
        rptCmpRow('💬 Contactos +2min',rptVal('d-contacts'),rptTruth.contacts),
        rptCmpRow('📅 Citas agendadas',rptVal('d-appts'),rptTruth.appointments),
        rptCmpRow('🚶 Visitas registradas',realVisits,rptTruth.showed)
      ].join('');
      document.getElementById('cmp-rows').innerHTML=rows;
      document.getElementById('cmp-pending').innerHTML='⏳ Las <b>aprobadas, negadas y ventas</b> las confirma el manager al final del día.';
      document.getElementById('cmp-card').classList.remove('hidden');
      document.getElementById('btn-submit').classList.remove('hidden');
      document.getElementById('btn-confirm').textContent='Volver a comparar';
      document.getElementById('cmp-card').scrollIntoView({behavior:'smooth'});
    }
    function rptCmpRow(label,said,real){
      if(real==null)return `<div class="cmp-row"><div class="cl">${label}</div><div class="cmp-vals"><span class="said">dijiste ${said==null?'—':said}</span><span class="diff">real: no disp.</span></div></div>`;
      const s=said==null?0:said, diff=s-real, cls=diff===0?'ok':'off';
      const dtxt=diff===0?'✓ igual':(diff>0?`+${diff} de más`:`${diff} de menos`);
      return `<div class="cmp-row"><div class="cl">${label}</div><div class="cmp-vals"><span class="said">dijiste ${said==null?'—':said}</span><span class="real">real ${real}</span><span class="diff ${cls}">${dtxt}</span></div></div>`;
    }
    async function rptSubmit(){
      if(rptErrors().length){rptConfirm();return;}
      const btn=document.getElementById('btn-submit');btn.disabled=true;btn.textContent='Enviando…';
      const cv=rptVisits.filter(v=>(v.client||'').trim());
      const applied=cv.filter(v=>['denied','approved','sold'].includes(v.stage)).length;
      const approved=cv.filter(v=>['approved','sold'].includes(v.stage)).length;
      const denied=cv.filter(v=>v.stage==='denied').length;
      const sold=cv.filter(v=>v.stage==='sold').length;
      const payload={agent_name:me.name,role:me.role,report_date:todayISO(),calls:rptVal('d-calls'),contacts:rptVal('d-contacts'),appointments:rptVal('d-appts'),visits:cv.length,applied,approved,denied,sold,visits_detail:cv,truth_calls:rptTruth.calls,truth_contacts:rptTruth.contacts,truth_appointments:rptTruth.appointments,submitted_at:new Date().toISOString()};
      try{localStorage.setItem('ar_kpi_'+todayISO(),JSON.stringify(payload));}catch(_){}
      let saved=false;
      try{const res=await fetch(`${SUPA_URL}/rest/v1/ar_kpi_daily?on_conflict=agent_name,report_date`,{method:'POST',headers:{...SUPA_HEADERS,Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(payload)});if(res.ok)saved=true;}catch(_){}
      if(!saved){try{
        // Save EVERYTHING to the existing table: numbers in columns, full detail (contacts/denied/role/visits/truth) in `notes` as JSON.
        const core={agent_name:me.name,report_date:todayISO(),calls:payload.calls,appointments:payload.appointments,visits:payload.visits,applied,approved,sold,
          notes:JSON.stringify({kind:'kpi',contacts:payload.contacts,denied,role:me.role,visits_detail:cv,truth:{calls:rptTruth.calls,contacts:rptTruth.contacts,appointments:rptTruth.appointments}})};
        const r2=await fetch(`${SUPA_URL}/rest/v1/ar_agent_self_report?on_conflict=agent_name,report_date`,{method:'POST',headers:{...SUPA_HEADERS,Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(core)});if(r2.ok)saved=true;}catch(_){}}
      document.getElementById('main-content').innerHTML=`<div style="text-align:center;padding:50px 24px;">
        <div style="width:64px;height:64px;border-radius:50%;background:var(--green);color:white;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 16px;">✓</div>
        <div style="font-size:20px;font-weight:800;">¡Reporte enviado!</div>
        <p style="color:var(--gray-500);margin-top:6px;">${saved?'Tu producción de hoy quedó registrada.':'Guardado en tu dispositivo. Se sincroniza al reconectar.'}</p>
        <button class="kpi-btn" style="max-width:260px;margin:22px auto 0;" onclick="goProfile(me.name,me.role==='closer'?'close':'prospect')">Ver mi dashboard →</button>
      </div>`;
      window.scrollTo(0,0);
    }
    async function rptLoadTruth(){
      rptTruth={calls:null,contacts:null,appointments:null,showed:null};
      try{
        const t=todayISO();
        const res=await fetch(`${PROXY_URL}?resource=agents&from=${t}&to=${t}&tz=-300`,{headers:SUPA_HEADERS});
        const data=await res.json();
        const row=(data.agents||[]).find(a=>(a.agentName||'').toLowerCase()===me.name.toLowerCase());
        if(row){rptTruth.calls=row.calls||0;rptTruth.contacts=row.contacts!=null?row.contacts:null;rptTruth.appointments=row.appointments||0;}
        else{rptTruth.calls=0;rptTruth.appointments=0;}
      }catch(e){}
    }
    function renderReportForm(){
      rptVisits=[];rptValidate=false;
      const dateStr=new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
      const visitsSub=me.role==='closer'?'Agrega cada visita que atendiste hoy (marca de dónde vino).':'Agrega cada visita que trajiste hoy y hasta dónde llegó.';
      document.getElementById('main-content').innerHTML=`
        <button class="back-btn" onclick="goProfile(me.name,me.role==='closer'?'close':'prospect')">← Mi dashboard</button>
        <div class="page-title">📝 Reporte de hoy</div>
        <div class="page-sub">${escapeHtml(me.name)} · ${dateStr}</div>
        <div class="section-card">
          <h3><span class="step-num">1</span>Tu actividad</h3>
          <p class="section-sub">Escribe lo que <b>crees</b> que hiciste hoy. Al confirmar te muestro lo real (no veas el número antes 😉).</p>
          <div class="stat-row"><div class="lbl">📞 Llamadas hoy</div><input class="num-input" type="number" min="0" id="d-calls" placeholder="0"></div>
          <div class="stat-row"><div class="lbl">💬 Contactos<small>conversaciones de +2 min</small></div><input class="num-input" type="number" min="0" id="d-contacts" placeholder="0"></div>
          <div class="stat-row"><div class="lbl">📅 Citas agendadas</div><input class="num-input" type="number" min="0" id="d-appts" placeholder="0"></div>
        </div>
        <div class="section-card">
          <h3><span class="step-num">2</span>Tus visitas</h3>
          <p class="section-sub">${visitsSub}</p>
          <div id="visits-list"></div>
          <button class="add-visit" onclick="rptAddVisit()">+ Agregar visita</button>
        </div>
        <div class="val-msg" id="val-msg"></div>
        <button class="kpi-btn" id="btn-confirm" onclick="rptConfirm()">Confirmar y comparar</button>
        <div class="section-card hidden" id="cmp-card">
          <h3>📊 Lo que dijiste vs lo real</h3>
          <p class="section-sub">El número real es el que cuenta. Esto mide qué tan cerca estuviste.</p>
          <div id="cmp-rows"></div>
          <div class="pending-note" id="cmp-pending"></div>
        </div>
        <button class="kpi-btn green hidden" id="btn-submit" onclick="rptSubmit()">Enviar reporte ✓</button>`;
      rptAddVisit();
      rptLoadTruth();
    }

    function escapeAttr(s){return String(s??'').replace(/&/g,'&amp;').replace(/'/g,'&#39;').replace(/"/g,'&quot;');}
    function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  
    // Fix tooltip clipping in overflow containers — position fixed via JS
    document.addEventListener('mouseover',function(e){
      const tip=e.target.closest('.tip');if(!tip)return;
      const box=tip.querySelector('.tip-box');if(!box)return;
      const tr=tip.getBoundingClientRect();
      const bw=270;
      let left=tr.left+tr.width/2-bw/2;
      if(left<8)left=8;
      if(left+bw>window.innerWidth-8)left=window.innerWidth-bw-8;
      requestAnimationFrame(function(){
        var bh=box.offsetHeight||60;
        var top=tr.top-bh-10;
        if(top<8)top=tr.bottom+8;
        box.style.left=left+'px';
        box.style.top=top+'px';
      });
    },true);
  </script>
</body>
</html>
