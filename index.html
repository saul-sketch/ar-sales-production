<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>KPIs de Producción - Sales team</title>
  <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.49.1/dist/apexcharts.min.js"></script>
  <style>
    :root{
      --primary:#0f172a;--accent:#e94560;--green:#10b981;--red:#ef4444;--yellow:#f59e0b;
      --blue:#3b82f6;--purple:#8b5cf6;--orange:#f97316;--cyan:#06b6d4;
      --gray-50:#f8fafc;--gray-100:#f1f5f9;--gray-200:#e2e8f0;--gray-300:#cbd5e1;
      --gray-400:#94a3b8;--gray-500:#64748b;--gray-600:#475569;--gray-700:#334155;
      --gray-800:#1e293b;--gray-900:#0f172a;
      --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
      --shadow-lg:0 10px 25px -3px rgba(0,0,0,.1),0 4px 6px -2px rgba(0,0,0,.05);
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--gray-50);color:var(--gray-900);-webkit-font-smoothing:antialiased;min-height:100vh;}
    .container{max-width:1180px;margin:0 auto;padding:18px 14px 48px;}

    /* Gate screen (no GHL identity) */
    .gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
    .gate-card{background:white;border-radius:18px;padding:34px 28px;box-shadow:var(--shadow-lg);max-width:420px;text-align:center;}
    .gate-card h1{font-size:21px;font-weight:800;margin-bottom:8px;}
    .gate-card p{color:var(--gray-500);font-size:14px;line-height:1.5;margin-bottom:8px;}
    .gate-mark{width:54px;height:54px;border-radius:14px;background:var(--primary);color:white;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;margin:0 auto 18px;}

    /* Topbar */
    .topbar{background:white;border-bottom:1px solid var(--gray-200);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;}
    .brand{display:flex;align-items:center;gap:10px;}
    .brand-mark{width:34px;height:34px;border-radius:9px;background:var(--primary);color:white;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;}
    .brand-text h1{font-size:15px;font-weight:700;letter-spacing:-.2px;}
    .brand-text small{font-size:11px;color:var(--gray-500);}
    .header-actions{display:flex;gap:8px;align-items:center;}
    .user-chip{padding:6px 12px;background:var(--gray-100);border-radius:999px;font-size:12px;font-weight:700;color:var(--gray-700);display:flex;align-items:center;gap:6px;}
    .role-badge{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:2px 7px;border-radius:999px;}
    .role-badge.manager{background:var(--primary);color:white;}
    .role-badge.closer{background:#eff6ff;color:#1e40af;}
    .role-badge.setter{background:#f0fdf4;color:#065f46;}
    .btn{padding:8px 12px;border:none;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .15s;}
    .btn:hover{opacity:.9;}.btn-ghost{background:var(--gray-100);color:var(--gray-700);}

    /* Filters */
    .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
    .filter-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--gray-500);}
    .filter-group{display:inline-flex;background:white;border:1px solid var(--gray-200);border-radius:10px;padding:3px;}
    .filter-tab{padding:6px 12px;font-size:13px;font-weight:600;border-radius:8px;cursor:pointer;color:var(--gray-500);border:none;background:transparent;font-family:inherit;transition:all .15s;}
    .filter-tab.active{background:var(--primary);color:white;}

    /* Personal hero */
    .hero{background:linear-gradient(135deg,#0f172a,#1e293b);color:white;border-radius:18px;padding:20px 22px;margin-bottom:16px;}
    .hero-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;}
    .hero-name{font-size:23px;font-weight:800;letter-spacing:-.3px;}
    .hero-role{font-size:12px;opacity:.7;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
    .hero-rank{text-align:right;}
    .hero-rank .pos{font-size:32px;font-weight:900;line-height:1;}
    .hero-rank .lbl{font-size:11px;opacity:.7;}
    .hero-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:9px;margin-top:16px;}
    .hero-stat{background:rgba(255,255,255,.08);border-radius:12px;padding:11px 13px;}
    .hero-stat .v{font-size:22px;font-weight:800;line-height:1;}
    .hero-stat .k{font-size:10px;opacity:.75;margin-top:3px;font-weight:600;}
    .hero-stat .c{font-size:10px;opacity:.6;margin-top:2px;}

    .section-card{background:white;border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:14px;}
    .section-card h3{font-size:14px;font-weight:800;margin-bottom:3px;}
    .section-card h3 .tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:2px 8px;border-radius:999px;margin-left:8px;vertical-align:middle;}
    .tag.prospect{background:#f0fdf4;color:#065f46;}.tag.close{background:#eff6ff;color:#1e40af;}
    .section-sub{font-size:12px;color:var(--gray-500);margin-bottom:13px;}

    /* Funnel */
    .funnel-stage{display:grid;grid-template-columns:135px 1fr 78px;gap:10px;align-items:center;padding:6px 0;}
    .funnel-stage .name{font-size:13px;font-weight:600;color:var(--gray-700);}
    .funnel-stage .bar-track{background:var(--gray-100);height:25px;border-radius:7px;overflow:hidden;}
    .funnel-stage .bar-fill{height:100%;border-radius:7px;display:flex;align-items:center;padding-left:10px;color:white;font-size:12px;font-weight:700;min-width:30px;transition:width .5s ease;}
    .funnel-stage .conv{font-size:11px;color:var(--gray-500);text-align:right;font-weight:600;}
    .funnel-stage.pending{opacity:.4;}
    .funnel-stage.pending .bar-fill{background:repeating-linear-gradient(45deg,var(--gray-300),var(--gray-300) 6px,var(--gray-200) 6px,var(--gray-200) 12px)!important;color:var(--gray-600);}

    /* Conversion chips */
    .conv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;}
    .conv-chip{background:var(--gray-50);border:1px solid var(--gray-200);border-radius:11px;padding:11px 13px;}
    .conv-chip .pct{font-size:22px;font-weight:800;line-height:1;}
    .conv-chip .lbl{font-size:11px;color:var(--gray-500);margin-top:3px;font-weight:600;}
    .conv-chip .num{font-size:10px;color:var(--gray-400);margin-top:1px;}
    .good{color:var(--green);}.mid{color:var(--yellow);}.low{color:var(--red);}.neutral{color:var(--gray-700);}

    /* Ranking table */
    .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
    table{width:100%;border-collapse:collapse;font-size:13px;}
    th{text-align:left;padding:9px 7px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--gray-500);border-bottom:1px solid var(--gray-200);white-space:nowrap;cursor:pointer;user-select:none;}
    th:hover{color:var(--gray-800);}
    td{padding:10px 7px;border-bottom:1px solid var(--gray-100);vertical-align:middle;white-space:nowrap;}
    tbody tr.me{background:#fffbeb;}
    tbody tr.me td:first-child{box-shadow:inset 3px 0 0 var(--yellow);}
    .rank-num{font-weight:800;color:var(--gray-400);width:26px;}
    .rank-num.top1{color:#f59e0b;}.rank-num.top2{color:#94a3b8;}.rank-num.top3{color:#d97706;}
    .agent-name-cell{font-weight:700;}
    .val-strong{font-weight:800;}
    .pct{font-size:12px;}
    .empty{text-align:center;padding:34px 20px;color:var(--gray-400);font-size:13px;}
    .tabs{display:inline-flex;background:var(--gray-100);border-radius:11px;padding:4px;margin-bottom:12px;gap:2px;}
    .tab{padding:8px 16px;font-size:13px;font-weight:700;border-radius:8px;cursor:pointer;color:var(--gray-500);border:none;background:transparent;font-family:inherit;transition:all .15s;}
    .tab.active{background:var(--primary);color:white;}
    /* Detail drawer */
    .detail-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none;align-items:flex-end;justify-content:center;}
    .detail-overlay.show{display:flex;}
    .detail-drawer{background:var(--gray-50);width:100%;max-width:760px;max-height:92vh;border-radius:20px 20px 0 0;overflow-y:auto;animation:slideUp .25s ease;}
    @media(min-width:768px){.detail-overlay{align-items:center;}.detail-drawer{border-radius:20px;max-height:88vh;}}
    @keyframes slideUp{from{transform:translateY(40px);opacity:0;}to{transform:translateY(0);opacity:1;}}
    .detail-head{padding:18px 22px;background:white;border-bottom:1px solid var(--gray-200);position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:12px;}
    .detail-head .nm{font-size:19px;font-weight:800;}
    .detail-head .rl{font-size:12px;color:var(--gray-500);font-weight:600;}
    .detail-close{background:var(--gray-100);border:none;border-radius:9px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}
    .detail-body{padding:16px 18px 32px;}
    .mode-toggle{display:inline-flex;background:white;border:1px solid var(--gray-200);border-radius:10px;padding:3px;margin-bottom:14px;}
    .clickable-row{cursor:pointer;}
    .clickable-row:hover{background:var(--gray-50)!important;}
    .avg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px;}
    .avg-card{background:white;border:1px solid var(--gray-200);border-radius:11px;padding:12px 14px;position:relative;}
    .avg-card .v{font-size:22px;font-weight:800;line-height:1;}
    .avg-card .k{font-size:11px;color:var(--gray-500);margin-top:3px;font-weight:600;}
    .avg-card.kc-click{transition:box-shadow .12s,border-color .12s,transform .12s;}
    .avg-card.kc-click:hover{border-color:var(--blue);box-shadow:0 3px 12px rgba(37,99,235,.14);transform:translateY(-1px);}
    .kc-hint{font-size:9.5px;color:var(--blue);font-weight:700;margin-top:5px;opacity:.75;}
    /* KPI drilldown modal */
    .kd-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:2000;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto;}
    .kd-modal{background:white;border-radius:16px;padding:18px;max-width:640px;width:100%;margin:auto;box-shadow:0 24px 60px rgba(0,0,0,.28);}
    .kd-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px;}
    .kd-title{font-size:16px;font-weight:800;color:var(--gray-900);}
    .kd-sub{font-size:12px;color:var(--gray-500);margin-top:2px;}
    .kd-x{background:var(--gray-100);border:none;border-radius:8px;width:32px;height:32px;font-size:15px;cursor:pointer;flex-shrink:0;}
    .kd-lnk{color:var(--blue);text-decoration:underline;text-underline-offset:2px;cursor:pointer;}
    .donut-grid{display:grid;grid-template-columns:1fr;gap:12px;}
    @media(min-width:560px){.donut-grid{grid-template-columns:1fr 1fr;}}
    .hero-cta{margin-top:14px;width:100%;padding:11px;background:rgba(255,255,255,.14);color:white;border:1px solid rgba(255,255,255,.25);border-radius:11px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;}
    .hero-cta:hover{background:rgba(255,255,255,.22);}

    /* ===== Layout shell: sidebar + main ===== */
    .shell{display:flex;min-height:calc(100vh - 59px);max-width:1340px;margin:0 auto;}
    .sidebar{width:236px;flex-shrink:0;background:white;border-right:1px solid var(--gray-200);padding:18px 12px 40px;overflow-y:auto;}
    .main-content{flex:1;min-width:0;padding:20px 18px 56px;}
    .hamburger{display:none;background:var(--gray-100);border:none;border-radius:9px;width:38px;height:38px;align-items:center;justify-content:center;font-size:17px;cursor:pointer;color:var(--gray-700);}
    .sidebar-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:199;display:none;}
    @media(max-width:900px){
      .sidebar{position:fixed;top:0;left:0;height:100vh;z-index:200;transform:translateX(-100%);transition:transform .25s ease;box-shadow:var(--shadow-lg);width:268px;}
      .sidebar.open{transform:translateX(0);}
      .sidebar-backdrop.show{display:block;}
      .hamburger{display:flex;}
    }
    /* Sidebar sections */
    .side-section{margin-bottom:18px;}
    .side-title{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--gray-400);padding:0 10px 7px;}
    .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:600;color:var(--gray-600);cursor:pointer;margin-bottom:2px;transition:all .12s;border:none;background:transparent;width:100%;text-align:left;font-family:inherit;}
    .nav-item:hover{background:var(--gray-100);}
    .nav-item.active{background:var(--primary);color:white;}
    .nav-item .ico{font-size:15px;width:20px;text-align:center;}
    .period-item{display:block;width:100%;text-align:left;padding:8px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--gray-600);cursor:pointer;border:none;background:transparent;font-family:inherit;margin-bottom:1px;}
    .period-item:hover{background:var(--gray-100);}
    .period-item.active{background:#eff6ff;color:#1e40af;font-weight:800;}
    .team-search{width:100%;padding:8px 11px;border:1px solid var(--gray-200);border-radius:8px;font-size:13px;font-family:inherit;margin-bottom:8px;}
    .team-item{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:7px 11px;border-radius:8px;font-size:13px;color:var(--gray-700);cursor:pointer;border:none;background:transparent;width:100%;text-align:left;font-family:inherit;}
    .team-item:hover{background:var(--gray-100);}
    .team-item .rl{font-size:8px;font-weight:800;padding:1px 6px;border-radius:999px;text-transform:uppercase;letter-spacing:.4px;}
    .team-item .rl.closer{background:#eff6ff;color:#1e40af;}.team-item .rl.setter{background:#f0fdf4;color:#065f46;}
    /* Tooltip (?) */
    .tip{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:var(--gray-300);color:white;font-size:10px;font-weight:800;cursor:help;margin-left:5px;vertical-align:middle;position:relative;}
    .tip:hover .tip-box,.tip.show .tip-box{display:block;}
    .tip-box{display:none;position:fixed;bottom:auto;left:0;top:0;transform:none;background:var(--gray-900);color:white;font-size:11px;font-weight:500;line-height:1.45;padding:9px 11px;border-radius:8px;width:270px;z-index:9999;text-align:left;text-transform:none;letter-spacing:normal;box-shadow:var(--shadow-lg);}
    .tip-box::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--gray-900);}
    /* Top period bar (custom ranges) */
    .period-bar{background:white;border-bottom:1px solid var(--gray-200);padding:9px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
    .pb-quick{display:inline-flex;gap:5px;flex-wrap:wrap;}
    .pb-chip{padding:6px 12px;font-size:13px;font-weight:700;border-radius:8px;cursor:pointer;color:var(--gray-600);border:1px solid var(--gray-200);background:white;font-family:inherit;}
    .pb-chip.active{background:var(--primary);color:white;border-color:var(--primary);}
    .pb-range{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--gray-500);}
    .pb-range input{padding:5px 8px;border:1px solid var(--gray-200);border-radius:7px;font-family:inherit;font-size:12px;color:var(--gray-700);}
    .pb-go{padding:6px 13px;background:var(--gray-800);color:white;border:none;border-radius:7px;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;}
    .pb-now{margin-left:auto;font-size:12px;color:var(--gray-500);font-weight:700;}
    .pb-daystep{display:inline-flex;align-items:center;gap:4px;background:var(--gray-100);border-radius:9px;padding:3px;}
    .pb-arrow{width:30px;height:30px;border:none;background:white;border:1px solid var(--gray-200);border-radius:7px;font-size:17px;font-weight:800;color:var(--gray-700);cursor:pointer;font-family:inherit;line-height:1;display:flex;align-items:center;justify-content:center;}
    .pb-arrow:hover:not(:disabled){background:var(--primary);color:white;border-color:var(--primary);}
    .pb-arrow:disabled{opacity:.35;cursor:not-allowed;}
    .pb-day{min-width:78px;padding:6px 10px;font-size:12.5px;font-weight:700;border-radius:7px;cursor:pointer;color:var(--gray-600);border:1px solid transparent;background:transparent;font-family:inherit;white-space:nowrap;}
    .pb-day.active{background:var(--primary);color:white;}
    @media(max-width:640px){.period-bar{padding:8px 12px;gap:8px;}.pb-now{margin-left:0;width:100%;}}
    .back-btn{display:inline-flex;align-items:center;gap:6px;background:var(--gray-100);border:none;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:700;color:var(--gray-700);cursor:pointer;font-family:inherit;margin-bottom:14px;}
    .back-btn:hover{background:var(--gray-200);}
    .page-title{font-size:20px;font-weight:800;letter-spacing:-.3px;margin-bottom:3px;}
    .page-sub{font-size:13px;color:var(--gray-500);margin-bottom:16px;}
    .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px;}

    @media(max-width:640px){
      .hero-kpis{grid-template-columns:repeat(2,1fr);}
      .funnel-stage{grid-template-columns:96px 1fr 54px;}
      .main-content{padding:16px 13px 48px;}
    }

    /* ===== KPI report form (integrated 'Reporte de hoy' view) ===== */
    .report-btn{padding:8px 13px;background:var(--green);color:white;border:none;border-radius:9px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap;}
    .report-btn:hover{opacity:.92;}
    .step-num{width:24px;height:24px;border-radius:8px;background:var(--primary);color:white;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;margin-right:6px;}
    .stat-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--gray-100);}
    .stat-row:last-child{border-bottom:none;}
    .stat-row .lbl{font-size:14px;font-weight:600;}
    .stat-row .lbl small{display:block;font-size:11px;color:var(--gray-400);font-weight:400;margin-top:1px;}
    .num-input{width:84px;padding:11px;border:1.5px solid var(--gray-300);border-radius:11px;font-size:18px;font-weight:700;text-align:center;font-family:inherit;color:var(--gray-900);}
    .num-input:focus{outline:none;border-color:var(--blue);}
    .visit{border:1.5px solid var(--gray-200);border-radius:12px;padding:11px 12px;margin-bottom:10px;background:var(--gray-50);}
    .visit .vhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
    .visit .vnum{font-size:11px;font-weight:800;color:var(--gray-400);text-transform:uppercase;letter-spacing:.5px;}
    .visit .vremove{background:none;border:none;color:var(--red);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
    .txt-input{width:100%;padding:9px 11px;border:1.5px solid var(--gray-300);border-radius:10px;font-size:14px;font-family:inherit;margin-bottom:9px;}
    .txt-input:focus{outline:none;border-color:var(--blue);}
    .vrow{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
    .vrow:last-child{margin-bottom:0;}
    .field-lbl{font-size:10.5px;font-weight:800;color:var(--gray-500);width:52px;flex-shrink:0;text-transform:uppercase;letter-spacing:.3px;}
    .vsel{flex:1;min-width:0;padding:9px 30px 9px 12px;border:1.5px solid var(--gray-300);border-radius:10px;font-size:13.5px;font-weight:700;font-family:inherit;color:var(--gray-800);cursor:pointer;-webkit-appearance:none;appearance:none;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='11' height='7' viewBox='0 0 11 7'><path d='M1 1l4.5 4.5L10 1' stroke='%2364748b' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>") no-repeat right 11px center;}
    .vsel:focus{outline:none;border-color:var(--blue);}
    .vsel.good{color:var(--green);border-color:var(--green);background-color:#f0fdf4;}
    .vsel.bad{color:var(--red);border-color:var(--red);background-color:#fef2f2;}
    .vsel.set{border-color:var(--gray-400);}
    .txt-input.err,.vsel.err{border-color:var(--red)!important;background-color:#fef2f2;}
    .val-msg{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:12px;padding:11px 14px;font-size:13px;font-weight:700;margin-bottom:14px;display:none;}
    .val-msg.show{display:block;}

    .pending-note{background:#fffbeb;border:1px solid #fde68a;border-radius:11px;padding:12px 14px;font-size:12.5px;color:#92400e;margin-top:12px;line-height:1.45;}
    .hidden{display:none;}
  </style>
</head>
<body>
  <!-- Gate (no GHL identity present) -->
  <div class="gate" id="screen-gate" style="display:none;">
    <div class="gate-card">
      <div class="gate-mark">AR</div>
      <h1>KPIs de Producción - Sales team</h1>
      <p>Esta página se abre <b>desde tu CRM (GoHighLevel)</b>. Tu sesión se reconoce automáticamente.</p>
      <p style="font-size:12px;color:var(--gray-400);margin-top:14px;">Si llegaste aquí directo, entra desde el menú de Auto Republic dentro de GoHighLevel.</p>
    </div>
  </div>

  <!-- App -->
  <div id="screen-app" style="display:none;">
    <div class="topbar">
      <div class="brand">
        <button class="hamburger" id="hamburger" onclick="toggleSidebar()" aria-label="Menú">☰</button>
        <div class="brand-mark">AR</div>
        <div class="brand-text"><h1>KPIs de Producción - Sales team</h1><small id="last-refresh">—</small></div>
      </div>
      <div class="header-actions">
        <button class="report-btn" id="report-btn" style="display:none;" onclick="navigate('report')">📝 Reporte de hoy</button>
        <button class="btn btn-ghost" onclick="refresh()" title="Refrescar">↻</button>
        <div class="user-chip"><span id="user-name">—</span><span class="role-badge" id="user-role">—</span></div>
      </div>
    </div>
    <div class="period-bar" id="period-bar"></div>
    <div class="shell">
      <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="closeSidebar()"></div>
      <aside class="sidebar" id="sidebar"></aside>
      <main class="main-content" id="main-content"></main>
    </div>
  </div>

  <script>
    const SUPA_URL='https://xwxjutaqouaeocvxawlw.supabase.co';
    const SUPA_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh3eGp1dGFxb3VhZW9jdnhhd2x3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNTIxMzYsImV4cCI6MjA5MjYyODEzNn0.TOigRbaNL5z3Q7hd4llJyqrC6vZwn_-1R-5JudXtJmU';
    const SUPA_HEADERS={apikey:SUPA_ANON,Authorization:`Bearer ${SUPA_ANON}`,'Content-Type':'application/json'};

    // Managers (GHL name/email) — see everything. Match case-insensitive on name or email.
    const MANAGERS=['saul','charles','andreina','karina'];

    let me={name:null,email:null,role:null}; // role: manager|closer|setter
    let allReports=[];
    let filterPeriod='mtd',filterLoc='all'; // default = THIS MONTH (sales goals are monthly, not rolling 30d)
    let lbTab='closer',lbSort={key:'sold',dir:-1};
    let view='produccion';          // global | setters | closers | recon | profile
    let profileCtx=null;        // {name, facet}
    let teamFilter='';
    let monthsExpanded=false;   // sidebar month list collapsed by default
    const MONTHS=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

    // ===== Navigation / router =====
    let prevView='global';
    function navigate(v,ctx){if(v==='profile'&&view!=='profile')prevView=view;view=v;if(v==='profile'&&ctx)profileCtx=ctx;closeSidebar();render();window.scrollTo(0,0);}
    function goProfile(name,facet){navigate('profile',{name,facet});}
    // Pick a sensible temporal breakdown for the current period (so a profile opened
    // under "this month" shows that month by week, a short range by day, etc).
    function aggForPeriod(){
      if(filterPeriod.startsWith('last:'))return +filterPeriod.slice(5)<=14?'day':'week';
      if(filterPeriod.startsWith('range:')){const p=filterPeriod.split(':');const days=(new Date(p[2])-new Date(p[1]))/86400000+1;return days<=16?'day':days<=92?'week':'month';}
      if(/^\d{4}-\d{2}$/.test(filterPeriod)||filterPeriod==='mtd'||filterPeriod==='qtd')return 'day';
      return 'month';
    }
    function periodAllowed(p){
      if(canHistory())return true;
      const cm=new Date().toISOString().slice(0,7);
      if(['mtd','last:1','last:3','last:7'].includes(p))return true;
      if(p===quincena1Key()||p===quincena2Key())return true;
      if(p.startsWith('range:')){const x=p.split(':');return x[1].slice(0,7)===cm&&x[2].slice(0,7)===cm;}
      return false; // 'all', 'qtd', meses pasados
    }
    async function setPeriod(p){
      if(!periodAllowed(p)){ alert('Tu acceso es solo del mes actual. Pídele a Saúl permiso de históricos.'); return; }
      filterPeriod=p;dtAgg=aggForPeriod();renderSidebar();renderPeriodBar();const mc=document.getElementById('main-content');if(mc)mc.style.opacity='.45';await loadDialer();if(mc)mc.style.opacity='';render();}
    function setLoc(l){filterLoc=l;render();}
    function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('sidebar-backdrop').classList.toggle('show');}
    function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebar-backdrop').classList.remove('show');}
    // Top period bar: quick day-ranges + custom from/to
    function prevMonthKey(){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;}
    function quincena1Key(){const d=new Date();const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0');return `range:${y}-${m}-01:${y}-${m}-15`;}
    function quincena2Key(){const d=new Date();const y=d.getFullYear(),mo=d.getMonth();const last=new Date(y,mo+1,0).getDate();const m=String(mo+1).padStart(2,'0');return `range:${y}-${m}-16:${y}-${m}-${String(last).padStart(2,'0')}`;}
    function todayKey(){const t=new Date();return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;}
    // Día ancla para el paso día-por-día: si ya estoy en un día suelto, ese; si no, hoy.
    function dayAnchor(){if(filterPeriod.startsWith('range:')){const p=filterPeriod.split(':');if(p[1]===p[2])return p[1];}return todayKey();}
    function dayLabel(dk){const d=new Date(dk+'T00:00:00');const dias=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];return `${dias[d.getDay()]} ${d.getDate()}/${d.getMonth()+1}`;}
    // Mueve el día ancla ±1 (no pasa de hoy hacia el futuro).
    function stepDay(delta){const d=new Date(dayAnchor()+'T00:00:00');d.setDate(d.getDate()+delta);const nd=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;if(nd>todayKey())return;setPeriod('range:'+nd+':'+nd);}
    function renderPeriodBar(){
      const bar=document.getElementById('period-bar');if(!bar)return;
      const quick=[{p:'last:1',lbl:'Hoy'},{p:'last:3',lbl:'3 días'},{p:'last:7',lbl:'7 días'},{p:'mtd',lbl:'Este mes'},{p:quincena1Key(),lbl:'Q1'},{p:quincena2Key(),lbl:'Q2'},{p:prevMonthKey(),lbl:'Mes pasado'}];
      const chips=quick.map(q=>`<button class="pb-chip ${filterPeriod===q.p?'active':''}" onclick="setPeriod('${q.p}')">${q.lbl}</button>`).join('');
      const isRange=filterPeriod.startsWith('range:');const rp=isRange?filterPeriod.split(':'):['','',''];
      const anchor=dayAnchor();const onDay=isRange&&rp[1]===rp[2];const atToday=anchor>=todayKey();
      const dayStep=`<div class="pb-daystep">
        <button class="pb-arrow" onclick="stepDay(-1)" title="Día anterior">‹</button>
        <button class="pb-day ${onDay?'active':''}" onclick="setPeriod('range:'+dayAnchor()+':'+dayAnchor())" title="Ver este día">${onDay?dayLabel(anchor):'Día'}</button>
        <button class="pb-arrow" onclick="stepDay(1)" ${atToday?'disabled':''} title="Día siguiente">›</button>
      </div>`;
      bar.innerHTML=`
        <span class="filter-label">Periodo</span>
        ${dayStep}
        <div class="pb-quick">${chips}</div>
        <div class="pb-range"><span>rango propio:</span>
          <input type="date" id="pb-from" value="${rp[1]||''}">
          <span>→</span>
          <input type="date" id="pb-to" value="${rp[2]||''}">
          <button class="pb-go" onclick="applyRange()">Ver</button>
        </div>
        <span class="pb-now">📅 ${periodLabel()}</span>`;
    }
    function applyRange(){
      const f=document.getElementById('pb-from').value,t=document.getElementById('pb-to').value;
      if(f&&t)setPeriod(f<=t?('range:'+f+':'+t):('range:'+t+':'+f));
      else if(f)setPeriod('range:'+f+':'+f);
    }

    document.addEventListener('DOMContentLoaded',async()=>{
      const ident=resolveIdentity();
      if(!ident){document.getElementById('screen-gate').style.display='flex';return;}
      me=ident;
      await touchAccess();
      // CANDADO: solo entra gente verificada. Nadie entra "sin usuario".
      if(!(await authorizeAccess())){ showNoAccess(); return; }
      document.getElementById('screen-app').style.display='';
      document.getElementById('user-name').textContent=me.name;
      const rb=document.getElementById('user-role');
      rb.textContent=me.role;rb.className='role-badge '+me.role;
      if(!view||view==='global')view=me.role==='manager'?'produccion':'profile';
      await refresh();
    });
    // Autorizado si: manager/admin (rol de Settings) · usuario+clave creado por Saúl · o persona real
    // del CRM de AR (en crm_roster). Bloqueado si active=false o si no es nadie de AR.
    async function authorizeAccess(){
      try{
        const a=window._myAccess;
        if(a&&a.active===false) return false;                       // acceso revocado
        if(a&&['admin','manager'].includes(a.role)) return true;    // manager/admin
        if(a&&a.access_type==='user') return true;                  // usuario+clave creado en Settings
        // ¿persona real de AR? verifica el NOMBRE contra la lista maestra del CRM de AR (crm_roster no tiene email).
        if(!me.name)return false;
        const cn=canonName(me.name)||me.name;
        const conds=['name.ilike.'+encodeURIComponent(me.name)];
        if(cn&&cn!==me.name)conds.push('name.ilike.'+encodeURIComponent(cn));
        const r=await fetch(`${SUPA_URL}/rest/v1/crm_roster?or=(${conds.join(',')})&select=crm_user_id&limit=1`,{headers:SUPA_HEADERS});
        const rows=await r.json();
        return Array.isArray(rows)&&rows.length>0;
      }catch(e){ return false; }
    }
    function showNoAccess(){
      const g=document.getElementById('screen-gate');
      g.querySelector('.gate-card').innerHTML=`<div class="gate-mark">AR</div>
        <h1>Sin acceso</h1>
        <p>Tu usuario <b>${escapeHtml(me.name||me.email||'')}</b> no tiene acceso a KPIs de Producción.</p>
        <p style="font-size:12px;color:var(--gray-400);margin-top:14px;">Pídele acceso a Saúl. Él te habilita desde Settings.</p>`;
      g.style.display='flex';
    }

    // ===== Control de acceso: registra quién abre + sus permisos (Settings → Users) =====
    const DASH='produccion';
    window._myAccess=null;
    function accessKey(){ return DASH+':'+((me.email||me.name||'').toLowerCase().trim()); }
    async function touchAccess(){
      try{
        const ident=(me.email||me.name||'').toLowerCase().trim(); if(!ident)return;
        const ukey=accessKey();
        // registra última vez (NO toca rol/permisos)
        await fetch(`${SUPA_URL}/rest/v1/dashboard_access?on_conflict=ukey`,{method:'POST',
          headers:{...SUPA_HEADERS,Prefer:'resolution=merge-duplicates,return=minimal'},
          body:JSON.stringify({dashboard:DASH,ukey,name:me.name,email:me.email||null,last_seen_at:new Date().toISOString(),last_period:filterPeriod})});
        const r=await fetch(`${SUPA_URL}/rest/v1/dashboard_access?ukey=eq.${encodeURIComponent(ukey)}&select=role,can_history,active,access_type`,{headers:SUPA_HEADERS});
        const rows=await r.json();
        window._myAccess=rows[0]||{role:'viewer',can_history:true,active:true};
        // El ROL de Settings decide qué ve: admin/manager → todo el dashboard; viewer/agent → solo lo suyo.
        // La lista MANAGERS del código queda de respaldo (managers base).
        const isMgr = ['admin','manager'].includes(window._myAccess.role) || me.role==='manager';
        me.role = isMgr ? 'manager' : 'agent';
        view = isMgr ? 'produccion' : 'profile';
        if(!isMgr) profileCtx = { name: me.name, facet: 'close' };
        const rb=document.getElementById('user-role'); if(rb){ rb.textContent=me.role; rb.className='role-badge '+me.role; }
      }catch(e){ window._myAccess={role:'viewer',can_history:true,active:true}; }
    }
    function isAdmin(){ return (window._myAccess&&window._myAccess.role==='admin'); }
    function canHistory(){ return !window._myAccess || window._myAccess.can_history!==false; }

    // Read identity from GHL custom-link query params, or dev override
    function resolveIdentity(){
      const q=new URLSearchParams(location.search);
      const name=(q.get('name')||q.get('user')||'').trim();
      const email=(q.get('email')||'').trim();
      // dev bypass: ?dev=Name (for testing only)
      const dev=(q.get('dev')||'').trim();
      const finalName=name||dev;
      if(!finalName)return null;
      const isMgr=MANAGERS.includes(finalName.toLowerCase())||MANAGERS.includes(email.toLowerCase().split('@')[0]);
      let role=isMgr?'manager':null;
      // localStorage remember (so a refresh inside GHL keeps identity even if params drop)
      if(finalName){localStorage.setItem('ar_prod_ident',JSON.stringify({name:finalName,email,manager:isMgr}));}
      return {name:finalName,email,role:role||'agent'};
    }

    const PROXY_URL='https://xwxjutaqouaeocvxawlw.supabase.co/functions/v1/dialer-proxy';

    function periodRange(){
      const now=new Date();
      const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      const to=iso(now);
      let from,toOut=to;
      if(/^\d{4}-\d{2}$/.test(filterPeriod)){
        const[y,m]=filterPeriod.split('-').map(Number);
        from=`${filterPeriod}-01`;
        toOut=`${filterPeriod}-${String(new Date(y,m,0).getDate()).padStart(2,'0')}`;
      }
      else if(filterPeriod.startsWith('last:')){const n=+filterPeriod.slice(5);const c=new Date();c.setDate(c.getDate()-(n-1));from=iso(c);}
      else if(filterPeriod.startsWith('range:')){const p=filterPeriod.split(':');from=p[1];toOut=p[2];}
      else if(filterPeriod==='mtd')from=iso(new Date(now.getFullYear(),now.getMonth(),1));
      else if(filterPeriod==='30'){const c=new Date();c.setDate(c.getDate()-30);from=iso(c);}
      else if(filterPeriod==='qtd'){const q=Math.floor(now.getMonth()/3);from=iso(new Date(now.getFullYear(),q*3,1));}
      else from='2026-01-01';
      return {from,to:toOut};
    }

    async function loadDialer(){
      // Live dialer feed via secure proxy → calls + appointments per agent, mapped to Sales Report names
      try{
        const {from,to}=periodRange();
        const res=await fetch(`${PROXY_URL}?resource=agents&from=${from}&to=${to}&tz=-300`,{headers:SUPA_HEADERS});
        if(!res.ok)throw new Error(res.status);
        const data=await res.json();
        const dialerAgents=data.agents||[];
        // Map dialer_user_id → sales_report_name
        const byUid={};(window._mapping||[]).forEach(m=>{byUid[m.dialer_user_id]=m.sales_report_name;});
        const byName={};(window._mapping||[]).forEach(m=>{if(m.dialer_name)byName[m.dialer_name.toLowerCase()]=m.sales_report_name;});
        const rosterById=window._rosterById||{};
        const out={}; // nombre canónico(lower) → {calls, contacts, minutes, sms, appointments}
        dialerAgents.forEach(a=>{
          // Fuente principal = ID del CRM (cubre a TODOS los del dialer). Fallbacks: tablita vieja, luego el nombre del dialer.
          let nm = rosterById[a.agentUserId] || byUid[a.agentUserId] || (a.agentName?byName[a.agentName.toLowerCase()]:null) || a.agentName;
          if(!nm)return;
          nm = canonName(nm);
          const k=nm.toLowerCase();
          if(!out[k])out[k]={calls:0,contacts:0,minutes:0,sms:0,appointments:0};
          out[k].calls+=a.calls||0;out[k].contacts+=a.contacts||0;out[k].minutes+=a.minutes||0;out[k].sms+=a.sms||0;out[k].appointments+=a.appointments||0;
        });
        window._dialerByAgent=out;
        window._dialerOk=true;
      }catch(e){window._dialerByAgent={};window._dialerOk=false;console.warn('dialer feed failed',e);}
    }

    async function refresh(){
      try{
        const [rRes,aRes,mRes,srRes]=await Promise.all([
          fetch(`${SUPA_URL}/rest/v1/ar_daily_reports?select=date,location,visits&order=date.desc`,{headers:SUPA_HEADERS}),
          fetch(`${SUPA_URL}/rest/v1/ar_agents?select=name,role,location&order=name.asc`,{headers:SUPA_HEADERS}),
          fetch(`${SUPA_URL}/rest/v1/ar_agent_mapping?select=dialer_user_id,dialer_name,sales_report_name`,{headers:SUPA_HEADERS}),
          fetch(`${SUPA_URL}/rest/v1/ar_agent_self_report?select=*`,{headers:SUPA_HEADERS})
        ]);
        allReports=await rRes.json();
        const agents=await aRes.json();
        window._agents=agents;
        // First load: if THIS month has no activity yet (e.g. day 1), show the latest month WITH data
        if(!window._periodInit){
          window._periodInit=true;
          const now=new Date(),tm=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
          const hasThisMonth=allReports.some(r=>r.date&&String(r.date).slice(0,7)===tm);
          if(filterPeriod==='mtd'&&!hasThisMonth){const ms=availableMonths();if(ms.length){filterPeriod=ms[0];dtAgg=aggForPeriod();}}
        }
        window._agentNames={};agents.forEach(a=>{if(a.name)window._agentNames[a.name.toLowerCase()]=a.name;});
        window._mapping=await mRes.json();
        window._selfReports=await srRes.json();
        try{const recRes=await fetch(`${SUPA_URL}/rest/v1/ar_reconciliation_daily?select=*&order=recon_date.desc&limit=30`,{headers:SUPA_HEADERS});window._recon=await recRes.json();}catch(e){window._recon=[];}
        window._closerSet=new Set(agents.filter(a=>a.role==='closer').map(a=>a.name.toLowerCase()));
        window._setterSet=new Set(agents.filter(a=>a.role==='setter').map(a=>a.name.toLowerCase()));
        // Equipo AUTORITATIVO desde crm_roster (etiquetas reales del WaveDialer, refrescadas solas):
        // call-center → Call Center; closers-orlando/kissimmee → sus equipos. Fallback a ar_agents solo si un nombre no matchea.
        window._agentTeam={}; window._rosterById={}; window._nameCase={};
        try{
          // TODAS las filas (activas e inactivas) — así el dialer mapea a CUALQUIER persona del CRM por su ID.
          const rr=await fetch(`${SUPA_URL}/rest/v1/crm_roster?select=crm_user_id,name,team,active`,{headers:SUPA_HEADERS});
          const roster=await rr.json();
          const map={'call-center':'cc','closers-orlando':'orlando','closers-kissimmee':'kissimmee'};
          (roster||[]).forEach(p=>{
            if(p.crm_user_id)window._rosterById[p.crm_user_id]=p.name;
            const ln=(p.name||'').toLowerCase();
            if(p.name)window._nameCase[ln]=p.name; // escritura correcta del CRM
            if(p.team&&map[p.team])window._agentTeam[ln]=map[p.team];
          });
          window._crmActive=new Set((roster||[]).filter(p=>p.active).map(p=>(p.name||'').toLowerCase()));
        }catch(e){}
        // Fallback ar_agents para nombres viejos que aún no matchean el CRM (se irá limpiando solo con la unificación).
        agents.forEach(a=>{const ln=(a.name||'').toLowerCase();if(window._agentTeam[ln])return;if(a.role==='setter')window._agentTeam[ln]='cc';else if(a.role==='closer')window._agentTeam[ln]=(a.location==='Kissimmee')?'kissimmee':'orlando';});
        // Mapa de equivalencias de nombres (evita duplicados: "Fabiola"/"Fabiola Lorio" → "Fabiola Iorio").
        window._alias={};
        try{
          const ar=await fetch(`${SUPA_URL}/rest/v1/crm_name_alias?select=alias,canonical_name,team`,{headers:SUPA_HEADERS});
          (await ar.json()||[]).forEach(a=>{window._alias[a.alias]={canon:a.canonical_name,team:a.team};});
        }catch(e){}
        if(me.role!=='manager'){
          const ln=me.name.toLowerCase();
          me.role=window._closerSet.has(ln)?'closer':window._setterSet.has(ln)?'setter':'agent';
          const rb=document.getElementById('user-role');rb.textContent=me.role;rb.className='role-badge '+me.role;
          if(view==='profile')profileCtx={name:me.name,facet:me.role==='closer'?'close':'prospect'};
        }
        // "Reporte de hoy" button only for setters/closers (the ones who fill KPIs)
        const rbtn=document.getElementById('report-btn');if(rbtn)rbtn.style.display=(me.role==='closer'||me.role==='setter')?'':'none';
        await loadDialer(); // live dialer feed for current period
        document.getElementById('last-refresh').textContent='Actualizado '+new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})+(window._dialerOk?' · dialer en vivo ✓':' · dialer offline');
        render();
      }catch(e){document.getElementById('main-content').innerHTML=`<div class="section-card"><div class="empty">Error: ${e.message}</div></div>`;}
    }

    function dialerFor(name){
      const k=(name||'').toLowerCase();
      return (window._dialerByAgent&&window._dialerByAgent[k])||{calls:0,appointments:0};
    }
    // Per-agent appointment STATUS from the GHL calendar (showed/noshow/cancelled…),
    // summed over the selected period from the daily reconciliation (ar_reconciliation_daily).
    // This is the REAL calendar outcome, not the report-derived show rate.
    function apptStatusFor(name){
      const k=(name||'').toLowerCase();
      const agg={showed:0,noshow:0,cancelled:0,confirmed:0,new:0,invalid:0,other:0,total:0};
      (window._recon||[]).forEach(r=>{
        if(!inPeriod(r.recon_date))return;
        const d=((r.detail||{}).by_agent_status||{})[k];
        if(!d)return;
        Object.keys(agg).forEach(f=>agg[f]+=d[f]||0);
      });
      return agg;
    }
    // Real GHL show rate = showed / (appointments that already had an outcome).
    // Pending ones (confirmed/new = future) are excluded from the denominator.
    function ghlShowRate(st){const decided=(st.showed||0)+(st.noshow||0)+(st.cancelled||0)+(st.invalid||0);return decided>0?st.showed/decided*100:0;}

    function inPeriod(d){
      if(filterPeriod==='all')return true;
      if(/^\d{4}-\d{2}$/.test(filterPeriod))return String(d).slice(0,7)===filterPeriod; // specific month
      if(filterPeriod.startsWith('last:')){const n=+filterPeriod.slice(5);const c=new Date();c.setHours(0,0,0,0);c.setDate(c.getDate()-(n-1));return new Date(d+'T00:00:00')>=c;}
      if(filterPeriod.startsWith('range:')){const p=filterPeriod.split(':');return d>=p[1]&&d<=p[2];}
      const dt=new Date(d+'T00:00:00'),now=new Date();
      if(filterPeriod==='mtd')return dt.getFullYear()===now.getFullYear()&&dt.getMonth()===now.getMonth();
      if(filterPeriod==='30'){const c=new Date();c.setDate(c.getDate()-30);return dt>=c;}
      if(filterPeriod==='qtd'){const q=Math.floor(now.getMonth()/3);return dt>=new Date(now.getFullYear(),q*3,1);}
      return true;
    }
    // Months present in the data (newest first) — feeds the sidebar period list.
    function availableMonths(){
      const set=new Set();
      (allReports||[]).forEach(r=>{if(r.date)set.add(String(r.date).slice(0,7));});
      (window._recon||[]).forEach(r=>{if(r.recon_date)set.add(String(r.recon_date).slice(0,7));});
      return [...set].filter(m=>/^\d{4}-\d{2}$/.test(m)).sort().reverse();
    }
    // Distinct days WITH activity in the period (reports or dialer calls). Used so
    // call/appt counts can be shown as a daily AVERAGE, not just an inflated period total.
    function activeDaysInPeriod(){
      const days=new Set();
      (allReports||[]).forEach(r=>{if(r.date&&inPeriod(r.date))days.add(r.date);});
      (window._recon||[]).forEach(r=>{if(r.recon_date&&inPeriod(r.recon_date)){
        const bas=(r.detail||{}).by_agent_status||{};
        if(Object.values(bas).some(v=>(v.calls||0)>0))days.add(r.recon_date);
      }});
      return days.size||1;
    }
    // Per-agent active days (days that specific person had calls) — for their own daily average.
    function agentActiveDays(name){
      const k=(name||'').toLowerCase();const days=new Set();
      (window._recon||[]).forEach(r=>{if(r.recon_date&&inPeriod(r.recon_date)){
        const d=((r.detail||{}).by_agent_status||{})[k];
        if(d&&((d.calls||0)>0||(d.total||0)>0))days.add(r.recon_date);
      }});
      return days.size||1;
    }
    function perDay(total,days){return days>0?Math.round(total/days):0;}
    function clean(s){if(!s)return null;const t=String(s).trim();return ['','n/a','na','—','-'].includes(t.toLowerCase())?null:t;}
    // Unifica variantes de nombre a la persona canónica del CRM (evita duplicados en TODAS las vistas).
    function canonName(n){if(!n)return n;const k=String(n).toLowerCase().trim();const a=(window._alias||{})[k];if(a)return a.canon;return (window._nameCase||{})[k]||n;}
    function fmtShare(x){return Number.isInteger(x)?String(x):x.toFixed(1);}
    function fmtMoney(n){return '$'+Math.round(n||0).toLocaleString('en-US');}
    function pct(n,d){return d>0?(n/d*100):0;}
    function pctCls(v,g,m){return v>=g?'good':v>=m?'mid':'low';}

    // ===== Core: build prospect + close stats per agent =====
    function buildStats(){
      const reports=allReports.filter(r=>inPeriod(r.date)&&(filterLoc==='all'||r.location===filterLoc));
      // PROSPECT: who BROUGHT the visit. setter (call center) OR closer if self-gen.
      // CLOSE: who ATTENDED. closer / closer2.
      const prospect={};const close={};
      const eP=n=>prospect[n]||(prospect[n]={name:n,visits:0,applied:0,approved:0,denied:0,sold:0,profit:0});
      const eC=n=>close[n]||(close[n]={name:n,visits:0,applied:0,approved:0,denied:0,sold:0,profit:0,selfgen:0});
      reports.forEach(r=>{
        (r.visits||[]).forEach(v=>{
          const setter=canonName(clean(v.setter)),c1=canonName(clean(v.closer)),c2=canonName(clean(v.closer2));
          const sb=v.scheduled_by;
          const selfgen=sb==='Self-gen'||v.subgen===true;
          // Determine prospector
          let prospector=null;
          if(setter) prospector=setter;
          else if(selfgen&&c1) prospector=c1; // closer brought own visit
          // (walk-in / empty → no prospector)
          if(prospector){
            const o=eP(prospector);o.visits++;
            if(v.applied===true)o.applied++;
            if(v.result==='approved')o.approved++;
            if(v.result==='denied')o.denied++;
            if(v.sale===true){o.sold++;o.profit+=v.net_profit||0;}
          }
          // Close attribution (closer/closer2)
          [c1,c2].forEach(c=>{if(!c)return;const o=eC(c);o.visits++;
            if(v.applied===true)o.applied++;
            if(v.result==='approved')o.approved++;
            if(v.result==='denied')o.denied++;});
          if(v.sale===true){
            if(c1&&c2){eC(c1).sold+=.5;eC(c2).sold+=.5;eC(c1).profit+=(v.net_profit||0)/2;eC(c2).profit+=(v.net_profit||0)/2;
              if(selfgen){eC(c1).selfgen+=.5;eC(c2).selfgen+=.5;}}
            else if(c1){eC(c1).sold+=1;eC(c1).profit+=v.net_profit||0;if(selfgen)eC(c1).selfgen+=1;}
            else if(c2){eC(c2).sold+=1;eC(c2).profit+=v.net_profit||0;if(selfgen)eC(c2).selfgen+=1;}
          }
        });
      });
      return {prospect:Object.values(prospect),close:Object.values(close),reports};
    }

    function render(){
      destroyCharts();
      renderSidebar();
      renderPeriodBar();
      if(view==='report'){renderReportForm();return;}
      const s=buildStats();
      if(view==='profile'&&profileCtx){renderProfilePage(s);return;}
      if(view==='settings'){renderSettings();return;}
      if(view==='produccion'){renderProduccion(s);return;}
      if(view==='resumen'){renderResumen(s);return;}
      if(view==='setters'){renderRoleView(s,'setter');return;}
      if(view==='closers'){renderRoleView(s,'closer');return;}
      if(view==='mgmt'){renderMgmtView(s);return;}
      if(view==='efectividad'){renderEfectividad(s);return;}
      if(view==='global'){renderGlobal(s);return;}
      if(view==='recon'){renderReconView();return;}
      renderProduccion(s); // default (managers)
    }

    // ===== Sidebar =====
    function teamList(){
      const raw=new Set();
      (window._closerSet||new Set()).forEach(n=>raw.add(n));
      (window._setterSet||new Set()).forEach(n=>raw.add(n));
      // Unifica variantes al nombre canónico y dedup (evita "Fabiola" + "Fabiola Lorio" como 2 personas).
      const byCanon={};
      raw.forEach(ln=>{
        const disp=(window._agentNames&&window._agentNames[ln])||ln;
        const canon=canonName(disp);
        const isCloser=(window._closerSet||new Set()).has(ln);
        const k=canon.toLowerCase();
        if(!byCanon[k])byCanon[k]={name:canon,role:isCloser?'closer':'setter',facet:isCloser?'close':'prospect'};
        else if(isCloser){byCanon[k].role='closer';byCanon[k].facet='close';}
      });
      return Object.values(byCanon).sort((a,b)=>a.name.localeCompare(b.name));
    }

      let nav;

        nav=[{v:'produccion',ico:'📋',lbl:'Producción'},{v:'efectividad',ico:'📊',lbl:'Efectividad'},{v:'setters',ico:'📞',lbl:'Setters'},
             {v:'closers',ico:'🎯',lbl:'Closers'},{v:'recon',ico:'📅',lbl:'Calendario'}];
        if(isAdmin())nav.push({v:'settings',ico:'⚙️',lbl:'Settings'});
      }else{
        nav=[{v:'profile',ico:'⭐',lbl:'Mi producción',self:true},
             {v:me.role==='closer'?'closers':'setters',ico:'🏆',lbl:'Mi ranking'}];
      }
      const navHtml=nav.map(n=>{
        let active=view===n.v;
        if(n.self)active=view==='profile'&&profileCtx&&profileCtx.name.toLowerCase()===me.name.toLowerCase();
        const click=n.self?`goProfile('${escapeAttr(me.name)}','${me.role==='closer'?'close':'prospect'}')`:`navigate('${n.v}')`;
        return `<button class="nav-item ${active?'active':''}" onclick="${click}"><span class="ico">${n.ico}</span>${n.lbl}</button>`;
      }).join('');
      const months=availableMonths();
      const quickP=[{p:'mtd',lbl:'Este mes'},{p:'qtd',lbl:'Trimestre'},{p:'all',lbl:'Todo el tiempo'}];
      const quickHtml=quickP.map(x=>`<button class="period-item ${filterPeriod===x.p?'active':''}" onclick="setPeriod('${x.p}')">${x.lbl}</button>`).join('');
      const showMonths=monthsExpanded||/^\d{4}-\d{2}$/.test(filterPeriod);
      const monthsHtml=`<button class="period-item" style="font-weight:800;display:flex;justify-content:space-between;align-items:center;" onclick="monthsExpanded=!monthsExpanded;renderSidebar();"><span>📅 Por mes</span><span style="color:var(--gray-400);">${showMonths?'▾':'▸'}</span></button>
        ${showMonths?months.map(m=>{const[y,mm]=m.split('-');return `<button class="period-item ${filterPeriod===m?'active':''}" style="padding-left:24px;" onclick="setPeriod('${m}')">${MONTHS[+mm-1]} ${y}</button>`;}).join(''):''}`;
      const perHtml=quickHtml+monthsHtml;
      let locHtml='';
      if(isMgr)locHtml=`<div class="side-section"><div class="side-title">Locación</div>
        ${[['all','Ambas'],['Orlando','Orlando'],['Kissimmee','Kissimmee']].map(([v,l])=>`<button class="period-item ${filterLoc===v?'active':''}" onclick="setLoc('${v}')">${l}</button>`).join('')}</div>`;
      let teamHtml='';
      if(isMgr){
        const all=teamList(),f=all.filter(t=>t.name.toLowerCase().includes(teamFilter.toLowerCase()));
        teamHtml=`<div class="side-section"><div class="side-title">Equipo (${all.length})</div>
          <input class="team-search" placeholder="Buscar persona…" value="${escapeAttr(teamFilter)}" oninput="teamFilter=this.value;renderSidebar();var _s=document.querySelector('.team-search');if(_s){_s.focus();_s.setSelectionRange(_s.value.length,_s.value.length);}">
          <div style="max-height:320px;overflow-y:auto;">${f.length?f.map(t=>
            `<button class="team-item" onclick="goProfile('${escapeAttr(t.name)}','${t.facet}')"><span>${escapeHtml(t.name)}</span><span class="rl ${t.role}">${t.role==='closer'?'C':'S'}</span></button>`
          ).join(''):'<div style="font-size:12px;color:var(--gray-400);padding:8px 11px;">Sin resultados</div>'}</div></div>`;
      }
      document.getElementById('sidebar').innerHTML=`
        <div class="side-section"><div class="side-title">Vista</div>${navHtml}</div>
        <div class="side-section"><div class="side-title">Periodo</div>${perHtml}</div>
        ${locHtml}${teamHtml}`;
    }

    // ===== Global (manager dashboard) =====
    function kpiCard(ico,lbl,val,color,sub,click){
      const clk=click?` onclick="${click}" style="cursor:pointer;" title="Toca para ver quién"`:'';
      const hint=click?`<div class="kc-hint">ver quién ›</div>`:'';
      return `<div class="avg-card${click?' kc-click':''}"${clk}><div class="v" style="color:${color||'var(--gray-900)'};">${val}</div><div class="k">${ico} ${lbl}</div>${sub?`<div style="font-size:10px;color:var(--gray-400);margin-top:3px;">${sub}</div>`:''}${hint}</div>`;
    }
    function teamTotals(s){
      let visits=0,applied=0,approved=0,sold=0,profit=0;
      s.reports.forEach(r=>(r.visits||[]).forEach(v=>{visits++;if(v.applied===true)applied++;if(v.result==='approved')approved++;if(v.sale===true){sold++;profit+=v.net_profit||0;}}));
      let calls=0,appts=0;Object.values(window._dialerByAgent||{}).forEach(d=>{calls+=d.calls||0;appts+=d.appointments||0;});
      return {visits,applied,approved,sold,profit,calls,appts};
    }

    // ===== Drill-down: quién hizo qué detrás de cada KPI =====
    function facetForName(name){const ln=(name||'').toLowerCase();return (window._closerSet&&window._closerSet.has(ln))?'close':'prospect';}
    function kdClose(){const o=document.getElementById('kd-overlay');if(o)o.remove();}
    function openKpiDrill(metric){
      const META={
        calls:{ico:'📞',title:'Llamadas — por persona',src:'dialer',key:'calls'},
        appts:{ico:'📅',title:'Citas — por persona',src:'dialer',key:'appointments'},
        visits:{ico:'🚶',title:'Visitas — quién las trabajó',src:'visits',filter:v=>true},
        approved:{ico:'✅',title:'Aprobados — quién los trabajó',src:'visits',filter:v=>v.result==='approved'},
        sold:{ico:'🏆',title:'Ventas — quién las cerró',src:'visits',filter:v=>v.sale===true},
        monto:{ico:'💵',title:'Monto — de dónde salió',src:'visits',filter:v=>v.sale===true}
      };
      const m=META[metric];if(!m)return;
      let body='';
      if(m.src==='dialer'){
        const rows=Object.entries(window._dialerByAgent||{}).map(([ln,d])=>({name:(window._agentNames&&window._agentNames[ln])||ln,ln,calls:d.calls||0,appts:d.appointments||0}))
          .filter(r=>r[m.key==='calls'?'calls':'appts']>0)
          .sort((a,b)=>(m.key==='calls'?b.calls-a.calls:b.appts-a.appts));
        const tc=rows.reduce((a,r)=>a+r.calls,0),ta=rows.reduce((a,r)=>a+r.appts,0);
        if(!rows.length){body='<div class="empty">Sin datos del dialer en este periodo</div>';}
        else body=`<div class="table-wrap"><table><thead><tr><th>#</th><th>Nombre</th><th style="text-align:right;">Llamadas</th><th style="text-align:right;">Citas</th></tr></thead><tbody>
          ${rows.map((r,i)=>`<tr class="clickable-row" onclick="kdClose();goProfile('${escapeAttr(r.name)}','${facetForName(r.name)}')">
            <td class="rank-num ${i===0?'top1':i===1?'top2':i===2?'top3':''}">${i+1}</td>
            <td><span style="color:var(--blue);text-decoration:underline;text-underline-offset:2px;">${escapeHtml(r.name)}</span></td>
            <td style="text-align:right;font-weight:${m.key==='calls'?'800':'400'};">${r.calls.toLocaleString('en-US')}</td>
            <td style="text-align:right;font-weight:${m.key==='calls'?'400':'800'};">${r.appts.toLocaleString('en-US')}</td></tr>`).join('')}
          <tr style="border-top:2px solid var(--gray-200);font-weight:800;"><td></td><td>Total (${rows.length})</td><td style="text-align:right;">${tc.toLocaleString('en-US')}</td><td style="text-align:right;">${ta.toLocaleString('en-US')}</td></tr>
          </tbody></table></div>`;
      } else {
        const reports=allReports.filter(r=>inPeriod(r.date)&&(filterLoc==='all'||r.location===filterLoc));
        let rows=[];
        reports.forEach(r=>(r.visits||[]).forEach(v=>{if(m.filter(v))rows.push({...v,_date:r.date,_loc:r.location});}));
        rows.sort((a,b)=> metric==='monto' ? (b.net_profit||0)-(a.net_profit||0) : (a._date<b._date?1:-1));
        const totProfit=rows.reduce((a,v)=>a+(v.sale===true?(v.net_profit||0):0),0);
        if(!rows.length){body='<div class="empty">Sin registros en este periodo</div>';}
        else body=`<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Cliente</th><th>Closer</th><th>Trajo</th><th>Loc</th>${metric==='monto'||metric==='sold'?'<th style="text-align:right;">Monto</th>':''}</tr></thead><tbody>
          ${rows.map(v=>{
            const c1=clean(v.closer),c2=clean(v.closer2),st=clean(v.setter);
            const closers=[c1,c2].filter(Boolean).map(n=>`<span class="kd-lnk" onclick="kdClose();goProfile('${escapeAttr(n)}','close')">${escapeHtml(n)}</span>`).join(' + ')||'<span style="color:var(--gray-400);">—</span>';
            const sg=v.scheduled_by==='Self-gen'||v.subgen===true;
            const brought= st && st!=='N/A' ? `<span class="kd-lnk" onclick="kdClose();goProfile('${escapeAttr(st)}','prospect')">${escapeHtml(st)}</span>` : (sg?'<span style="color:#10b981;">Self-gen</span>':'<span style="color:var(--gray-400);">Walk-in</span>');
            const d=new Date(v._date+'T00:00:00'),dn=`${d.getDate()}/${d.getMonth()+1}`;
            const profit=v.sale===true?(v.net_profit||0):0;
            return `<tr><td style="white-space:nowrap;font-weight:600;">${dn}</td><td>${escapeHtml(v.name||'—')}</td><td>${closers}</td><td>${brought}</td><td style="font-size:11px;color:var(--gray-500);">${(v._loc||'').slice(0,3)}</td>${metric==='monto'||metric==='sold'?`<td style="text-align:right;font-weight:700;color:var(--green);">${profit?fmtMoney(profit):'—'}</td>`:''}</tr>`;
          }).join('')}
          ${(metric==='monto'||metric==='sold')?`<tr style="border-top:2px solid var(--gray-200);font-weight:800;"><td colspan="5">Total (${rows.length})</td><td style="text-align:right;color:var(--green);">${fmtMoney(totProfit)}</td></tr>`:`<tr style="border-top:2px solid var(--gray-200);font-weight:800;"><td colspan="5">Total: ${rows.length}</td></tr>`}
          </tbody></table></div>`;
      }
      kdClose();
      document.body.insertAdjacentHTML('beforeend',`<div id="kd-overlay" class="kd-overlay" onclick="if(event.target===this)kdClose()">
        <div class="kd-modal">
          <div class="kd-head"><div><div class="kd-title">${m.ico} ${m.title}</div><div class="kd-sub">${periodLabel()}${filterLoc!=='all'?' · '+filterLoc:''} · toca un nombre para su perfil</div></div>
          <button class="kd-x" onclick="kdClose()">✕</button></div>
          ${body}
        </div></div>`);
    }

    // ===== Management View: producción separada por equipo (Call Center / Closers Orlando / Closers Kissimmee) =====
    // Fuente autoritativa del equipo = WaveDialer (name→team). Hasta alimentarlo, cae en clasificación
    // preliminar: setters = Call Center; closers = su locación dominante (por las visitas que atendieron).
    window._teamMap = window._teamMap || {}; // { nombre_lower: 'cc' | 'orlando' | 'kissimmee' }
    function closerDominantLoc(){
      const reports=allReports.filter(r=>inPeriod(r.date));
      const loc={};
      reports.forEach(r=>(r.visits||[]).forEach(v=>{
        [clean(v.closer),clean(v.closer2)].forEach(c=>{if(!c)return;const k=c.toLowerCase();(loc[k]||(loc[k]={Orlando:0,Kissimmee:0}));if(r.location==='Orlando')loc[k].Orlando++;else if(r.location==='Kissimmee')loc[k].Kissimmee++;});
      }));
      const out={};Object.keys(loc).forEach(k=>{out[k]=loc[k].Kissimmee>loc[k].Orlando?'kissimmee':'orlando';});
      return out;
    }
    // ===== Efectividad: conversión por origen + closer (cliente propio vs de piso) =====
    // Umbrales del PDF de managers: Visita→Aplicó 70-80% · Aprobado→Venta 70-80% · Visita→Venta 20-30%.
    function efChannelOf(v){
      if(v.scheduled_by==='Self-gen'||v.subgen===true) return 'Self-gen';
      if(v.scheduled_by==='Call Center') return 'Call Center';
      if(v.scheduled_by==='Walk-in') return 'Walk-in';
      return 'Sin dato';
    }
    // Devuelve color semáforo según el % y el umbral meta.
    function efColor(rate,target){ if(rate>=target) return 'var(--green)'; if(rate>=target*0.7) return '#f59e0b'; return 'var(--red)'; }
    function efPctCell(n,d,target){
      const r = d>0 ? (n/d*100) : 0;
      const c = d>0 ? efColor(r,target) : 'var(--gray-300)';
      return `<td style="text-align:center;"><span style="font-weight:800;color:${c};">${d>0?r.toFixed(0)+'%':'—'}</span><div style="font-size:10px;color:var(--gray-400);">${fmtShare(n)}/${fmtShare(d)}</div></td>`;
    }
    function efTeamLabel(t){return {cc:'Call Center',orlando:'Closers Orlando',kissimmee:'Closers Kissimmee'}[t]||'Sin equipo';}

    // ===== SETTINGS → USERS: quién tiene acceso, última vez, permisos, crear usuario+clave =====
    function fmtLastSeen(ts){
      if(!ts)return '<span style="color:var(--gray-400);">nunca</span>';
      const d=new Date(ts), diff=(Date.now()-d.getTime())/1000;
      let s; if(diff<60)s='hace segundos'; else if(diff<3600)s='hace '+Math.floor(diff/60)+' min'; else if(diff<86400)s='hace '+Math.floor(diff/3600)+' h'; else if(diff<172800)s='ayer'; else s='hace '+Math.floor(diff/86400)+' días';
      return `${s} <span style="color:var(--gray-400);font-size:11px;">(${d.getDate()}/${d.getMonth()+1} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')})</span>`;
    }

          </tr></thead><tbody>${body||'<tr><td colspan="8" class="empty">Sin usuarios aún</td></tr>'}</tbody></table></div>

    }

    // ===== PRODUCCIÓN — por persona, por día, se abre hacia abajo por origen, drill en cada punto =====
    window._prodOpen = window._prodOpen || new Set();
    window._prodRec = window._prodRec || {};
    function toggleProd(k){ if(window._prodOpen.has(k))window._prodOpen.delete(k); else window._prodOpen.add(k); render(); }
    window._prodTeam = window._prodTeam || 'all';
    function setProdTeam(t){ window._prodTeam=t; render(); }
    function prodOrigin(v){ if(v.scheduled_by==='Self-gen'||v.subgen===true)return 'Propio'; if(v.scheduled_by==='Call Center')return 'Call Center'; if(v.scheduled_by==='Walk-in')return 'Walk-in'; return 'Otro'; }
    function prodAgg(recs){ const a={visitas:recs.length,aplico:0,noap:0,aprob:0,neg:0,vend:0,monto:0};
      recs.forEach(v=>{ if(v.applied===true)a.aplico++; else a.noap++; if(v.result==='approved')a.aprob++; if(v.result==='denied')a.neg++; if(v.sale===true){a.vend++;a.monto+=v.net_profit||0;} }); return a; }
    // Modal de detalle: lista los registros detrás de un número (ventas, visitas, etc.)
    function prodShow(recKey,title){
      const recs=window._prodRec[recKey]||[];
      const body = recs.length ? recs.map(v=>{
        const st=clean(v.setter); const sg=(v.scheduled_by==='Self-gen'||v.subgen===true);
        const trajo = st&&st!=='N/A' ? escapeHtml(st) : (sg?'Self-gen':'Walk-in');
        const badge = v.sale===true?'<span style="color:var(--green);font-weight:700;">Vendió'+(v.net_profit?' · '+fmtMoney(v.net_profit):'')+'</span>':v.result==='approved'?'<span style="color:#8b5cf6;">Aprobó</span>':v.result==='denied'?'<span style="color:var(--red);">Negó</span>':v.applied===true?'<span style="color:var(--blue);">Aplicó</span>':'<span style="color:var(--gray-400);">Vino</span>';
        const d=new Date((v._date||'')+'T00:00:00'); const dn=isNaN(d)?'':`${d.getDate()}/${d.getMonth()+1}`;
        return `<div style="display:flex;justify-content:space-between;gap:10px;padding:9px 4px;border-bottom:1px solid var(--gray-100);">
          <div><div style="font-weight:600;">${escapeHtml(v.name||'—')}</div><div style="font-size:11px;color:var(--gray-500);">${dn} · agendó: ${trajo}${v._loc?' · '+String(v._loc).slice(0,3):''}</div></div>
          <div style="text-align:right;font-size:13px;">${badge}</div></div>`;
      }).join('') : '<div class="empty">Sin registros</div>';
      const o=document.getElementById('prod-modal'); if(o)o.remove();
      document.body.insertAdjacentHTML('beforeend',`<div id="prod-modal" style="position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:2000;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto;" onclick="if(event.target===this)this.remove()">
        <div style="background:white;border-radius:16px;padding:18px;max-width:520px;width:100%;margin:auto;box-shadow:0 24px 60px rgba(0,0,0,.28);">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;"><div style="font-weight:800;font-size:15px;">${title} <span style="color:var(--gray-400);font-weight:500;">· ${recs.length}</span></div>
          <button onclick="this.closest('#prod-modal').remove()" style="background:var(--gray-100);border:none;border-radius:8px;width:30px;height:30px;cursor:pointer;">✕</button></div>
          ${body}
        </div></div>`);
    }
    let _prodKey=0;
    function prodCell(recs,filterFn,label,color,tgtNum,tgtDen){
      const list=filterFn?recs.filter(filterFn):recs;
      const k='pk'+(_prodKey++); window._prodRec[k]=list;
      const n=list.length;
      return {k,n,list};
    }
    function renderProduccion(s){
      const dialer=window._dialerByAgent||{}, teamMap=window._agentTeam||{}, names=window._agentNames||{};
      window._prodRec={}; _prodKey=0;
      // Por persona: registros de visita agrupados por origen
      const P={};
      const eP=name=>{const k=name.toLowerCase(); if(!P[k])P[k]={name,key:k,team:teamMap[k]||null,calls:0,citas:0,recs:[]}; return P[k];};
      Object.entries(dialer).forEach(([k,d])=>{const o=eP(canonName(names[k]||k)); o.calls+=d.calls||0; o.citas+=d.appointments||0;});
      s.reports.forEach(r=>(r.visits||[]).forEach(v=>{
        [canonName(clean(v.closer)),canonName(clean(v.closer2))].forEach(c=>{ if(!c)return; eP(c).recs.push({...v,_date:r.date,_loc:r.location}); });
      }));
      const teamF=window._prodTeam||'all';
      const matchTeam=p=> teamF==='all' ? true : teamF==='none' ? !p.team : p.team===teamF;
      const people=Object.values(P).filter(p=>(p.recs.length>0||p.calls>0)&&matchTeam(p))
        // con equipo primero, luego por producción (ventas → visitas → llamadas); los "sin equipo" al final.
        .sort((a,b)=>(a.team?0:1)-(b.team?0:1)||prodAgg(b.recs).vend-prodAgg(a.recs).vend||b.recs.length-a.recs.length||(b.calls||0)-(a.calls||0));

      const ORIGINS=['Propio','Call Center','Walk-in','Otro'];
      // Fila de números drilleable para un set de registros
      const cells=(recs,dim)=>{
        const kV=prodCell(recs,null).k, kAp=prodCell(recs,v=>v.applied===true).k, kApr=prodCell(recs,v=>v.result==='approved').k, kVe=prodCell(recs,v=>v.sale===true).k;
        const a=prodAgg(recs);
        const cell=(n,key,extra)=>`<td style="text-align:center;${extra||''}" ${n?`class="clickable-row" onclick="event.stopPropagation();prodShow('${key}','${dim}')" title="ver"`:''}>${n||'—'}</td>`;
        return `${cell(a.visitas,kV)}${cell(a.aplico,kAp)}<td style="text-align:center;color:${a.neg?'var(--red)':'var(--gray-300)'};">${a.neg||'—'}</td>${cell(a.aprob,kApr)}${cell(a.vend,kVe,'font-weight:700;')}<td style="text-align:right;color:var(--green);font-weight:700;">${a.monto?fmtMoney(a.monto):'—'}</td>`;
      };
      const rows=people.map(p=>{
        const open=window._prodOpen.has(p.key);
        const a=prodAgg(p.recs);
        const summary=`<tr class="clickable-row" onclick="toggleProd('${p.key}')" style="border-top:1px solid var(--gray-200);">
          <td style="font-weight:700;white-space:nowrap;"><span style="color:var(--gray-400);">${open?'▾':'▸'}</span> ${escapeHtml(p.name)}<div style="font-size:10px;color:var(--gray-400);font-weight:400;margin-left:14px;">${efTeamLabel(p.team)}</div></td>
          <td style="text-align:right;">${p.calls?p.calls.toLocaleString('en-US'):'—'}</td>
          <td style="text-align:right;">${p.citas||'—'}</td>
          ${cells(p.recs,p.name)}
        </tr>`;
        let detail='';
        if(open){
          detail=ORIGINS.map(o=>{const rs=p.recs.filter(v=>prodOrigin(v)===o); if(!rs.length)return ''; const ag=prodAgg(rs);
            return `<tr style="background:var(--gray-50);font-size:12px;">
              <td style="padding-left:26px;color:var(--gray-600);">${o}</td><td></td><td></td>${cells(rs,p.name+' · '+o)}</tr>`;}).join('');
        }
        return summary+detail;
      }).join('');

      const teamPill=(t,l)=>`<button onclick="setProdTeam('${t}')" style="padding:7px 14px;border-radius:20px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;border:1px solid ${teamF===t?'var(--primary)':'var(--gray-200)'};background:${teamF===t?'var(--primary)':'white'};color:${teamF===t?'white':'var(--gray-600)'};">${l}</button>`;
      document.getElementById('main-content').innerHTML=`
        <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;">
          <div><div class="page-title">Producción diaria</div>
          <div class="page-sub">${periodLabel()}${filterLoc!=='all'?' · '+filterLoc:''} · toca una persona para su desglose · toca un número para el detalle</div></div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;">${teamPill('all','Todos')}${teamPill('cc','Call Center')}${teamPill('orlando','Closers Orlando')}${teamPill('kissimmee','Closers Kissimmee')}${teamPill('none','Sin equipo')}</div>
        </div>
        <div class="section-card" style="padding:0;overflow:hidden;margin-top:12px;">
          <div class="table-wrap"><table><thead><tr>
            <th>Vendedor</th><th style="text-align:right;">📞</th><th style="text-align:right;">📅cita</th>
            <th style="text-align:center;">🚶vis</th><th style="text-align:center;">Aplicó</th><th style="text-align:center;">Negó</th><th style="text-align:center;">Aprobó</th><th style="text-align:center;">Vendió</th><th style="text-align:right;">Monto</th>
          </tr></thead><tbody>${rows||'<tr><td colspan="9" class="empty">Sin producción en este día</td></tr>'}</tbody></table></div>
        </div>`;
    }

    // ===== RESUMEN — landing del manager: pulso del embudo + a quién coachear + equipos =====
    function renderResumen(s){
      const t=teamTotals(s);
      const dialer=window._dialerByAgent||{}, teamMap=window._agentTeam||{}, names=window._agentNames||{};
      const P={};
      const eP=name=>{const k=name.toLowerCase(); if(!P[k])P[k]={name,team:teamMap[k]||null,calls:0,visitas:0,aplico:0,aprob:0,neg:0,vend:0,monto:0}; return P[k];};
      Object.entries(dialer).forEach(([k,d])=>{eP(canonName(names[k]||k)).calls+=d.calls||0;});
      s.reports.forEach(r=>(r.visits||[]).forEach(v=>{
        [canonName(clean(v.closer)),canonName(clean(v.closer2))].forEach(c=>{ if(!c)return; const o=eP(c);
          o.visitas++; if(v.applied===true)o.aplico++; if(v.result==='approved')o.aprob++; if(v.result==='denied')o.neg++; if(v.sale===true){o.vend++;o.monto+=v.net_profit||0;}
        });
      }));
      const people=Object.values(P);
      const base=()=>({n:0,calls:0,visitas:0,aplico:0,aprob:0,neg:0,vend:0,monto:0});
      const teams={cc:base(),orlando:base(),kissimmee:base()};
      people.forEach(o=>{const a=teams[o.team]; if(!a)return; a.n++;['calls','visitas','aplico','aprob','neg','vend','monto'].forEach(f=>a[f]+=o[f]);});

      // Pulso: embudo en una línea
      const stage=(val,lbl,color)=>`<div style="flex:1;min-width:64px;text-align:center;"><div style="font-size:19px;font-weight:800;color:${color||'var(--gray-900)'};line-height:1.1;">${val}</div><div style="font-size:11px;color:var(--gray-400);">${lbl}</div></div>`;
      const conv=(n,d,tgt)=>{const r=d>0?n/d*100:0;const c=d>0?efColor(r,tgt):'var(--gray-300)';return `<div style="display:flex;align-items:center;font-size:11px;font-weight:700;color:${c};padding:0 2px;">${d>0?r.toFixed(0)+'%':''}›</div>`;};
      const arrow=`<div style="display:flex;align-items:center;color:var(--gray-300);font-size:12px;">›</div>`;
      const pulse=`<div class="section-card"><p class="section-sub">Pulso del equipo · embudo del período</p>
        <div style="display:flex;align-items:stretch;gap:2px;overflow-x:auto;">
          ${stage(t.calls.toLocaleString('en-US'),'llamadas')}${arrow}
          ${stage(t.appts,'citas')}${arrow}
          ${stage(t.visits,'visitas')}${conv(t.applied,t.visits,70)}
          ${stage(t.applied,'aplicó')}${arrow}
          ${stage(t.approved,'aprobó')}${conv(t.sold,t.approved,70)}
          ${stage(fmtShare(t.sold),'ventas','var(--green)')}${arrow}
          ${stage(fmtMoney(t.profit),'monto','var(--green)')}
        </div></div>`;

      // Alertas: a quién coachear (rojo primero) + 1 positiva
      const alerts=[];
      Object.keys(teams).forEach(k=>{const a=teams[k]; if(a.visitas<3)return;
        const vs=a.vend/a.visitas*100, ap=a.aplico/a.visitas*100;
        if(vs<15 && a.neg>=Math.max(a.vend,2)) alerts.push({sev:1,who:efTeamLabel(k),m:'visita→venta '+vs.toFixed(0)+'%',why:a.neg+' negados · tráfico basura',go:"navigate('efectividad')"});
        else if(ap<60) alerts.push({sev:1,who:efTeamLabel(k),m:'aplicó '+ap.toFixed(0)+'%',why:'precalificación telefónica',go:"navigate('efectividad')"});
      });
      people.filter(p=>p.visitas>=5).forEach(p=>{const ap=p.aplico/p.visitas*100, vs=p.vend/p.visitas*100;
        if(ap<50) alerts.push({sev:1,who:p.name,m:'aplicó '+ap.toFixed(0)+'%',why:'precalificación',go:"goProfile('"+escapeAttr(p.name)+"','close')"});
        else if(vs<10 && p.neg>=2) alerts.push({sev:1,who:p.name,m:'visita→venta '+vs.toFixed(0)+'%',why:p.neg+' negados',go:"goProfile('"+escapeAttr(p.name)+"','close')"});
      });
      // positiva: mejor equipo por visita→venta
      let best=null;Object.keys(teams).forEach(k=>{const a=teams[k];if(a.visitas<5)return;const vs=a.vend/a.visitas*100;if(!best||vs>best.vs)best={k,vs,neg:a.neg};});
      const alertRows=alerts.slice(0,4).map(a=>`
        <div class="clickable-row" onclick="${a.go}" style="background:white;border:1px solid var(--gray-200);border-left:3px solid var(--red);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;">
          <div><span style="font-weight:700;">${escapeHtml(a.who)}</span><span style="color:var(--gray-500);font-size:13px;"> · ${a.m}</span></div>
          <div style="font-size:12px;color:var(--red);background:rgba(226,75,74,.1);padding:3px 9px;border-radius:6px;white-space:nowrap;">${escapeHtml(a.why)}</div>
        </div>`).join('') + (best?`
        <div style="background:white;border:1px solid var(--gray-200);border-left:3px solid var(--green);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;">
          <div><span style="font-weight:700;">${efTeamLabel(best.k)}</span><span style="color:var(--gray-500);font-size:13px;"> · visita→venta ${best.vs.toFixed(0)}%</span></div>
          <div style="font-size:12px;color:var(--green);background:rgba(16,185,129,.1);padding:3px 9px;border-radius:6px;">mejor equipo</div>
        </div>`:'');

      // Tarjetas de equipo
      const card=(k,color)=>{const a=teams[k]; const ap=a.visitas?a.aplico/a.visitas*100:0, vs=a.visitas?a.vend/a.visitas*100:0;
        return `<div class="clickable-row" onclick="navigate('efectividad')" style="background:white;border:1px solid var(--gray-200);border-top:3px solid ${color};border-radius:0 0 12px 12px;padding:12px 14px;cursor:pointer;">
          <div style="display:flex;justify-content:space-between;align-items:baseline;"><span style="font-weight:800;">${efTeamLabel(k)}</span><span style="font-size:11px;color:var(--gray-400);">${a.n} pers.</span></div>

        </div>`;};

      document.getElementById('main-content').innerHTML=`
        <div class="page-title">Resumen</div>
        <div class="page-sub">Todo el equipo · ${periodLabel()}${filterLoc!=='all'?' · '+filterLoc:''}</div>
        ${pulse}
        <div style="font-size:15px;font-weight:800;margin:16px 0 8px;color:var(--gray-700);">⚠️ A quién coachear</div>

    }
    function setEfMode(m){window._efMode=m;render();}
    function renderEfectividad(s){
      const reports=s.reports;
      const dialer=window._dialerByAgent||{};

      // Conversión por origen (equipo)
      const CH=['Self-gen','Call Center','Walk-in'];
      const chStat={}; CH.concat(['Sin dato']).forEach(c=>chStat[c]={visits:0,applied:0,approved:0,sold:0,profit:0});

      // Por persona: esfuerzo (dialer) + embudo (reportes)
      const P={};
      const eP=name=>{const k=name.toLowerCase(); if(!P[k])P[k]={name,team:teamMap[k]||null,calls:0,contacts:0,minutes:0,sms:0,citas:0,visitas:0,aplico:0,noAplico:0,aprob:0,neg:0,vend:0,monto:0,pv:0,ps:0,tv:0,ts:0}; return P[k];};
      Object.entries(dialer).forEach(([k,d])=>{const o=eP(canonName(names[k]||k)); o.calls+=d.calls||0;o.contacts+=d.contacts||0;o.minutes+=d.minutes||0;o.sms+=d.sms||0;o.citas+=d.appointments||0;});
      reports.forEach(r=>(r.visits||[]).forEach(v=>{
        const ch=efChannelOf(v); const cs=chStat[ch]; cs.visits++; if(v.applied===true)cs.applied++; if(v.result==='approved')cs.approved++; if(v.sale===true){cs.sold++;cs.profit+=v.net_profit||0;}
        const selfgen=(ch==='Self-gen');
        [canonName(clean(v.closer)),canonName(clean(v.closer2))].forEach(c=>{ if(!c)return; const o=eP(c);
          o.visitas++; if(v.applied===true)o.aplico++; else o.noAplico++;
          if(v.result==='approved')o.aprob++; if(v.result==='denied')o.neg++;
          if(v.sale===true){o.vend++;o.monto+=v.net_profit||0;}
          if(selfgen){o.pv++;if(v.sale===true)o.ps++;}else{o.tv++;if(v.sale===true)o.ts++;}
        });
      }));
      const people=Object.values(P);

      // Celdas del embudo completo (esfuerzo → visitas → aplicó → negó → cierre → visita-venta → monto)
      const num=(n)=>n?n.toLocaleString('en-US'):'—';
      const funnelCells=o=>`
        <td style="text-align:right;">${num(o.calls)}</td>

        <td style="text-align:right;font-weight:700;">${o.visitas||'—'}</td>
        ${efPctCell(o.aplico,o.visitas,70)}
        <td style="text-align:center;color:${o.neg?'var(--red)':'var(--gray-300)'};font-weight:700;">${o.neg||'—'}</td>
