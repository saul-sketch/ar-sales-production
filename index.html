<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>AR Sales Production</title>
  <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.49.1/dist/apexcharts.min.js"></script>
  <style>
    :root{
      --primary:#0f172a;--accent:#e94560;--green:#10b981;--red:#ef4444;--yellow:#f59e0b;
      --blue:#3b82f6;--purple:#8b5cf6;--orange:#f97316;--cyan:#06b6d4;
      --gray-50:#f8fafc;--gray-100:#f1f5f9;--gray-200:#e2e8f0;--gray-300:#cbd5e1;
      --gray-400:#94a3b8;--gray-500:#64748b;--gray-600:#475569;--gray-700:#334155;
      --gray-800:#1e293b;--gray-900:#0f172a;
      --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
      --shadow-lg:0 10px 25px -3px rgba(0,0,0,.1),0 4px 6px -2px rgba(0,0,0,.05);
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--gray-50);color:var(--gray-900);-webkit-font-smoothing:antialiased;min-height:100vh;}
    .container{max-width:1180px;margin:0 auto;padding:18px 14px 48px;}

    /* Gate screen (no GHL identity) */
    .gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
    .gate-card{background:white;border-radius:18px;padding:34px 28px;box-shadow:var(--shadow-lg);max-width:420px;text-align:center;}
    .gate-card h1{font-size:21px;font-weight:800;margin-bottom:8px;}
    .gate-card p{color:var(--gray-500);font-size:14px;line-height:1.5;margin-bottom:8px;}
    .gate-mark{width:54px;height:54px;border-radius:14px;background:var(--primary);color:white;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;margin:0 auto 18px;}

    /* Topbar */
    .topbar{background:white;border-bottom:1px solid var(--gray-200);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;}
    .brand{display:flex;align-items:center;gap:10px;}
    .brand-mark{width:34px;height:34px;border-radius:9px;background:var(--primary);color:white;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;}
    .brand-text h1{font-size:15px;font-weight:700;letter-spacing:-.2px;}
    .brand-text small{font-size:11px;color:var(--gray-500);}
    .header-actions{display:flex;gap:8px;align-items:center;}
    .user-chip{padding:6px 12px;background:var(--gray-100);border-radius:999px;font-size:12px;font-weight:700;color:var(--gray-700);display:flex;align-items:center;gap:6px;}
    .role-badge{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:2px 7px;border-radius:999px;}
    .role-badge.manager{background:var(--primary);color:white;}
    .role-badge.closer{background:#eff6ff;color:#1e40af;}
    .role-badge.setter{background:#f0fdf4;color:#065f46;}
    .btn{padding:8px 12px;border:none;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .15s;}
    .btn:hover{opacity:.9;}.btn-ghost{background:var(--gray-100);color:var(--gray-700);}

    /* Filters */
    .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
    .filter-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--gray-500);}
    .filter-group{display:inline-flex;background:white;border:1px solid var(--gray-200);border-radius:10px;padding:3px;}
    .filter-tab{padding:6px 12px;font-size:13px;font-weight:600;border-radius:8px;cursor:pointer;color:var(--gray-500);border:none;background:transparent;font-family:inherit;transition:all .15s;}
    .filter-tab.active{background:var(--primary);color:white;}

    /* Personal hero */
    .hero{background:linear-gradient(135deg,#0f172a,#1e293b);color:white;border-radius:18px;padding:20px 22px;margin-bottom:16px;}
    .hero-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;}
    .hero-name{font-size:23px;font-weight:800;letter-spacing:-.3px;}
    .hero-role{font-size:12px;opacity:.7;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
    .hero-rank{text-align:right;}
    .hero-rank .pos{font-size:32px;font-weight:900;line-height:1;}
    .hero-rank .lbl{font-size:11px;opacity:.7;}
    .hero-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:16px;}
    .hero-stat{background:rgba(255,255,255,.08);border-radius:12px;padding:11px 13px;}
    .hero-stat .v{font-size:22px;font-weight:800;line-height:1;}
    .hero-stat .k{font-size:10px;opacity:.75;margin-top:3px;font-weight:600;}
    .hero-stat .c{font-size:10px;opacity:.6;margin-top:2px;}

    .section-card{background:white;border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:14px;}
    .section-card h3{font-size:14px;font-weight:800;margin-bottom:3px;}
    .section-card h3 .tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:2px 8px;border-radius:999px;margin-left:8px;vertical-align:middle;}
    .tag.prospect{background:#f0fdf4;color:#065f46;}.tag.close{background:#eff6ff;color:#1e40af;}
    .section-sub{font-size:12px;color:var(--gray-500);margin-bottom:13px;}

    /* Funnel */
    .funnel-stage{display:grid;grid-template-columns:135px 1fr 78px;gap:10px;align-items:center;padding:6px 0;}
    .funnel-stage .name{font-size:13px;font-weight:600;color:var(--gray-700);}
    .funnel-stage .bar-track{background:var(--gray-100);height:25px;border-radius:7px;overflow:hidden;}
    .funnel-stage .bar-fill{height:100%;border-radius:7px;display:flex;align-items:center;padding-left:10px;color:white;font-size:12px;font-weight:700;min-width:30px;transition:width .5s ease;}
    .funnel-stage .conv{font-size:11px;color:var(--gray-500);text-align:right;font-weight:600;}
    .funnel-stage.pending{opacity:.4;}
    .funnel-stage.pending .bar-fill{background:repeating-linear-gradient(45deg,var(--gray-300),var(--gray-300) 6px,var(--gray-200) 6px,var(--gray-200) 12px)!important;color:var(--gray-600);}

    /* Conversion chips */
    .conv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;}
    .conv-chip{background:var(--gray-50);border:1px solid var(--gray-200);border-radius:11px;padding:11px 13px;}
    .conv-chip .pct{font-size:22px;font-weight:800;line-height:1;}
    .conv-chip .lbl{font-size:11px;color:var(--gray-500);margin-top:3px;font-weight:600;}
    .conv-chip .num{font-size:10px;color:var(--gray-400);margin-top:1px;}
    .good{color:var(--green);}.mid{color:var(--yellow);}.low{color:var(--red);}.neutral{color:var(--gray-700);}

    /* Ranking table */
    .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
    table{width:100%;border-collapse:collapse;font-size:13px;}
    th{text-align:left;padding:9px 7px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--gray-500);border-bottom:1px solid var(--gray-200);white-space:nowrap;cursor:pointer;user-select:none;}
    th:hover{color:var(--gray-800);}
    td{padding:10px 7px;border-bottom:1px solid var(--gray-100);vertical-align:middle;white-space:nowrap;}
    tbody tr.me{background:#fffbeb;}
    tbody tr.me td:first-child{box-shadow:inset 3px 0 0 var(--yellow);}
    .rank-num{font-weight:800;color:var(--gray-400);width:26px;}
    .rank-num.top1{color:#f59e0b;}.rank-num.top2{color:#94a3b8;}.rank-num.top3{color:#d97706;}
    .agent-name-cell{font-weight:700;}
    .val-strong{font-weight:800;}
    .pct{font-size:12px;}
    .empty{text-align:center;padding:34px 20px;color:var(--gray-400);font-size:13px;}
    .tabs{display:inline-flex;background:var(--gray-100);border-radius:11px;padding:4px;margin-bottom:12px;gap:2px;}
    .tab{padding:8px 16px;font-size:13px;font-weight:700;border-radius:8px;cursor:pointer;color:var(--gray-500);border:none;background:transparent;font-family:inherit;transition:all .15s;}
    .tab.active{background:var(--primary);color:white;}
    /* Detail drawer */
    .detail-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none;align-items:flex-end;justify-content:center;}
    .detail-overlay.show{display:flex;}
    .detail-drawer{background:var(--gray-50);width:100%;max-width:760px;max-height:92vh;border-radius:20px 20px 0 0;overflow-y:auto;animation:slideUp .25s ease;}
    @media(min-width:768px){.detail-overlay{align-items:center;}.detail-drawer{border-radius:20px;max-height:88vh;}}
    @keyframes slideUp{from{transform:translateY(40px);opacity:0;}to{transform:translateY(0);opacity:1;}}
    .detail-head{padding:18px 22px;background:white;border-bottom:1px solid var(--gray-200);position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:12px;}
    .detail-head .nm{font-size:19px;font-weight:800;}
    .detail-head .rl{font-size:12px;color:var(--gray-500);font-weight:600;}
    .detail-close{background:var(--gray-100);border:none;border-radius:9px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}
    .detail-body{padding:16px 18px 32px;}
    .mode-toggle{display:inline-flex;background:white;border:1px solid var(--gray-200);border-radius:10px;padding:3px;margin-bottom:14px;}
    .clickable-row{cursor:pointer;}
    .clickable-row:hover{background:var(--gray-50)!important;}
    .avg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px;}
    .avg-card{background:white;border:1px solid var(--gray-200);border-radius:11px;padding:12px 14px;}
    .avg-card .v{font-size:22px;font-weight:800;line-height:1;}
    .avg-card .k{font-size:11px;color:var(--gray-500);margin-top:3px;font-weight:600;}
    .donut-grid{display:grid;grid-template-columns:1fr;gap:12px;}
    @media(min-width:560px){.donut-grid{grid-template-columns:1fr 1fr;}}
    .hero-cta{margin-top:14px;width:100%;padding:11px;background:rgba(255,255,255,.14);color:white;border:1px solid rgba(255,255,255,.25);border-radius:11px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;}
    .hero-cta:hover{background:rgba(255,255,255,.22);}

    @media(max-width:640px){
      .hero-kpis{grid-template-columns:repeat(2,1fr);}
      .funnel-stage{grid-template-columns:96px 1fr 54px;}
    }
  </style>
</head>
<body>
  <!-- Gate (no GHL identity present) -->
  <div class="gate" id="screen-gate" style="display:none;">
    <div class="gate-card">
      <div class="gate-mark">AR</div>
      <h1>Producción de Ventas</h1>
      <p>Esta página se abre <b>desde tu CRM (GoHighLevel)</b>. Tu sesión se reconoce automáticamente.</p>
      <p style="font-size:12px;color:var(--gray-400);margin-top:14px;">Si llegaste aquí directo, entra desde el menú de Auto Republic dentro de GoHighLevel.</p>
    </div>
  </div>

  <!-- App -->
  <div id="screen-app" style="display:none;">
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark">AR</div>
        <div class="brand-text"><h1>Producción de Ventas</h1><small id="last-refresh">—</small></div>
      </div>
      <div class="header-actions">
        <button class="btn btn-ghost" onclick="refresh()" title="Refrescar">↻</button>
        <div class="user-chip"><span id="user-name">—</span><span class="role-badge" id="user-role">—</span></div>
      </div>
    </div>

    <div class="container">
      <div class="filters">
        <span class="filter-label">Periodo</span>
        <div class="filter-group" id="period-filter">
          <button class="filter-tab" data-period="mtd">Mes actual</button>
          <button class="filter-tab" data-period="30">30d</button>
          <button class="filter-tab" data-period="qtd">Trimestre</button>
          <button class="filter-tab active" data-period="all">Todo</button>
        </div>
        <span class="filter-label" id="loc-lbl">Locación</span>
        <div class="filter-group" id="loc-filter">
          <button class="filter-tab active" data-loc="all">Ambas</button>
          <button class="filter-tab" data-loc="Orlando">Orlando</button>
          <button class="filter-tab" data-loc="Kissimmee">Kissimmee</button>
        </div>
      </div>

      <div id="personal"></div>
      <div id="leaderboards"></div>
    </div>
  </div>

  <!-- Agent detail drawer -->
  <div class="detail-overlay" id="detail-overlay" onclick="if(event.target.id==='detail-overlay')closeDetail()">
    <div class="detail-drawer">
      <div class="detail-head">
        <div><div class="nm" id="dt-name">—</div><div class="rl" id="dt-role">—</div></div>
        <button class="detail-close" onclick="closeDetail()">Cerrar</button>
      </div>
      <div class="detail-body" id="dt-body"></div>
    </div>
  </div>

  <script>
    const SUPA_URL='https://xwxjutaqouaeocvxawlw.supabase.co';
    const SUPA_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh3eGp1dGFxb3VhZW9jdnhhd2x3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNTIxMzYsImV4cCI6MjA5MjYyODEzNn0.TOigRbaNL5z3Q7hd4llJyqrC6vZwn_-1R-5JudXtJmU';
    const SUPA_HEADERS={apikey:SUPA_ANON,Authorization:`Bearer ${SUPA_ANON}`,'Content-Type':'application/json'};

    // Managers (GHL name/email) — see everything. Match case-insensitive on name or email.
    const MANAGERS=['saul','charles','andreina','karina'];

    let me={name:null,email:null,role:null}; // role: manager|closer|setter
    let allReports=[];
    let filterPeriod='all',filterLoc='all';
    let lbTab='closer',lbSort={key:'sold',dir:-1};

    document.addEventListener('DOMContentLoaded',async()=>{
      bindFilters();
      const ident=resolveIdentity();
      if(!ident){document.getElementById('screen-gate').style.display='flex';return;}
      me=ident;
      document.getElementById('screen-app').style.display='';
      document.getElementById('user-name').textContent=me.name;
      const rb=document.getElementById('user-role');
      rb.textContent=me.role;rb.className='role-badge '+me.role;
      document.getElementById('loc-lbl').style.display=me.role==='manager'?'':'none';
      document.getElementById('loc-filter').style.display=me.role==='manager'?'':'none';
      await refresh();
    });

    // Read identity from GHL custom-link query params, or dev override
    function resolveIdentity(){
      const q=new URLSearchParams(location.search);
      const name=(q.get('name')||q.get('user')||'').trim();
      const email=(q.get('email')||'').trim();
      // dev bypass: ?dev=Name (for testing only)
      const dev=(q.get('dev')||'').trim();
      const finalName=name||dev;
      if(!finalName)return null;
      const isMgr=MANAGERS.includes(finalName.toLowerCase())||MANAGERS.includes(email.toLowerCase().split('@')[0]);
      let role=isMgr?'manager':null;
      // localStorage remember (so a refresh inside GHL keeps identity even if params drop)
      if(finalName){localStorage.setItem('ar_prod_ident',JSON.stringify({name:finalName,email,manager:isMgr}));}
      return {name:finalName,email,role:role||'agent'};
    }

    const PROXY_URL='https://xwxjutaqouaeocvxawlw.supabase.co/functions/v1/dialer-proxy';

    function periodRange(){
      const now=new Date();
      const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      const to=iso(now);
      let from;
      if(filterPeriod==='mtd')from=iso(new Date(now.getFullYear(),now.getMonth(),1));
      else if(filterPeriod==='30'){const c=new Date();c.setDate(c.getDate()-30);from=iso(c);}
      else if(filterPeriod==='qtd'){const q=Math.floor(now.getMonth()/3);from=iso(new Date(now.getFullYear(),q*3,1));}
      else from='2026-01-01';
      return {from,to};
    }

    async function loadDialer(){
      // Live dialer feed via secure proxy → calls + appointments per agent, mapped to Sales Report names
      try{
        const {from,to}=periodRange();
        const res=await fetch(`${PROXY_URL}?resource=agents&from=${from}&to=${to}&tz=-300`,{headers:SUPA_HEADERS});
        if(!res.ok)throw new Error(res.status);
        const data=await res.json();
        const dialerAgents=data.agents||[];
        // Map dialer_user_id → sales_report_name
        const byUid={};(window._mapping||[]).forEach(m=>{byUid[m.dialer_user_id]=m.sales_report_name;});
        const byName={};(window._mapping||[]).forEach(m=>{if(m.dialer_name)byName[m.dialer_name.toLowerCase()]=m.sales_report_name;});
        const out={}; // sales_report_name(lower) → {calls, appointments}
        dialerAgents.forEach(a=>{
          const sr=byUid[a.agentUserId]||(a.agentName?byName[a.agentName.toLowerCase()]:null);
          if(!sr)return;
          const k=sr.toLowerCase();
          if(!out[k])out[k]={calls:0,appointments:0};
          out[k].calls+=a.calls||0;out[k].appointments+=a.appointments||0;
        });
        window._dialerByAgent=out;
        window._dialerOk=true;
      }catch(e){window._dialerByAgent={};window._dialerOk=false;console.warn('dialer feed failed',e);}
    }

    async function refresh(){
      try{
        const [rRes,aRes,mRes,srRes]=await Promise.all([
          fetch(`${SUPA_URL}/rest/v1/ar_daily_reports?select=date,location,visits&order=date.desc`,{headers:SUPA_HEADERS}),
          fetch(`${SUPA_URL}/rest/v1/ar_agents?select=name,role&order=name.asc`,{headers:SUPA_HEADERS}),
          fetch(`${SUPA_URL}/rest/v1/ar_agent_mapping?select=dialer_user_id,dialer_name,sales_report_name`,{headers:SUPA_HEADERS}),
          fetch(`${SUPA_URL}/rest/v1/ar_agent_self_report?select=*`,{headers:SUPA_HEADERS})
        ]);
        allReports=await rRes.json();
        const agents=await aRes.json();
        window._mapping=await mRes.json();
        window._selfReports=await srRes.json();
        window._closerSet=new Set(agents.filter(a=>a.role==='closer').map(a=>a.name.toLowerCase()));
        window._setterSet=new Set(agents.filter(a=>a.role==='setter').map(a=>a.name.toLowerCase()));
        if(me.role!=='manager'){
          const ln=me.name.toLowerCase();
          me.role=window._closerSet.has(ln)?'closer':window._setterSet.has(ln)?'setter':'agent';
          const rb=document.getElementById('user-role');rb.textContent=me.role;rb.className='role-badge '+me.role;
        }
        await loadDialer(); // live dialer feed for current period
        document.getElementById('last-refresh').textContent='Actualizado '+new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})+(window._dialerOk?' · dialer en vivo ✓':' · dialer offline');
        render();
      }catch(e){document.getElementById('leaderboards').innerHTML=`<div class="section-card"><div class="empty">Error: ${e.message}</div></div>`;}
    }

    function dialerFor(name){
      const k=(name||'').toLowerCase();
      return (window._dialerByAgent&&window._dialerByAgent[k])||{calls:0,appointments:0};
    }

    function bindFilters(){
      document.querySelectorAll('#period-filter .filter-tab').forEach(b=>b.addEventListener('click',()=>{
        document.querySelectorAll('#period-filter .filter-tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');filterPeriod=b.dataset.period;render();}));
      document.querySelectorAll('#loc-filter .filter-tab').forEach(b=>b.addEventListener('click',()=>{
        document.querySelectorAll('#loc-filter .filter-tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');filterLoc=b.dataset.loc;render();}));
    }

    function inPeriod(d){
      if(filterPeriod==='all')return true;
      const dt=new Date(d+'T00:00:00'),now=new Date();
      if(filterPeriod==='mtd')return dt.getFullYear()===now.getFullYear()&&dt.getMonth()===now.getMonth();
      if(filterPeriod==='30'){const c=new Date();c.setDate(c.getDate()-30);return dt>=c;}
      if(filterPeriod==='qtd'){const q=Math.floor(now.getMonth()/3);return dt>=new Date(now.getFullYear(),q*3,1);}
      return true;
    }
    function clean(s){if(!s)return null;const t=String(s).trim();return ['','n/a','na','—','-'].includes(t.toLowerCase())?null:t;}
    function fmtShare(x){return Number.isInteger(x)?String(x):x.toFixed(1);}
    function fmtMoney(n){return '$'+Math.round(n||0).toLocaleString('en-US');}
    function pct(n,d){return d>0?(n/d*100):0;}
    function pctCls(v,g,m){return v>=g?'good':v>=m?'mid':'low';}

    // ===== Core: build prospect + close stats per agent =====
    function buildStats(){
      const reports=allReports.filter(r=>inPeriod(r.date)&&(filterLoc==='all'||r.location===filterLoc));
      // PROSPECT: who BROUGHT the visit. setter (call center) OR closer if self-gen.
      // CLOSE: who ATTENDED. closer / closer2.
      const prospect={};const close={};
      const eP=n=>prospect[n]||(prospect[n]={name:n,visits:0,applied:0,approved:0,denied:0,sold:0,profit:0});
      const eC=n=>close[n]||(close[n]={name:n,visits:0,applied:0,approved:0,denied:0,sold:0,profit:0,selfgen:0});
      reports.forEach(r=>{
        (r.visits||[]).forEach(v=>{
          const setter=clean(v.setter),c1=clean(v.closer),c2=clean(v.closer2);
          const sb=v.scheduled_by;
          const selfgen=sb==='Self-gen'||v.subgen===true;
          // Determine prospector
          let prospector=null;
          if(setter) prospector=setter;
          else if(selfgen&&c1) prospector=c1; // closer brought own visit
          // (walk-in / empty → no prospector)
          if(prospector){
            const o=eP(prospector);o.visits++;
            if(v.applied===true)o.applied++;
            if(v.result==='approved')o.approved++;
            if(v.result==='denied')o.denied++;
            if(v.sale===true){o.sold++;o.profit+=v.net_profit||0;}
          }
          // Close attribution (closer/closer2)
          [c1,c2].forEach(c=>{if(!c)return;const o=eC(c);o.visits++;
            if(v.applied===true)o.applied++;
            if(v.result==='approved')o.approved++;
            if(v.result==='denied')o.denied++;});
          if(v.sale===true){
            if(c1&&c2){eC(c1).sold+=.5;eC(c2).sold+=.5;eC(c1).profit+=(v.net_profit||0)/2;eC(c2).profit+=(v.net_profit||0)/2;
              if(selfgen){eC(c1).selfgen+=.5;eC(c2).selfgen+=.5;}}
            else if(c1){eC(c1).sold+=1;eC(c1).profit+=v.net_profit||0;if(selfgen)eC(c1).selfgen+=1;}
            else if(c2){eC(c2).sold+=1;eC(c2).profit+=v.net_profit||0;if(selfgen)eC(c2).selfgen+=1;}
          }
        });
      });
      return {prospect:Object.values(prospect),close:Object.values(close),reports};
    }

    function render(){
      const s=buildStats();
      renderPersonal(s);
      renderLeaderboards(s);
    }

    function periodLabel(){return {mtd:'Mes actual',30:'Últimos 30 días',qtd:'Este trimestre',all:'Todo el tiempo'}[filterPeriod];}

    function renderPersonal(s){
      const host=document.getElementById('personal');
      if(me.role==='manager'){host.innerHTML='';return;}
      const myClose=s.close.find(c=>c.name.toLowerCase()===me.name.toLowerCase());
      const myProspect=s.prospect.find(p=>p.name.toLowerCase()===me.name.toLowerCase());
      const isCloser=me.role==='closer'||(myClose&&!myProspect);
      // Ranking position
      const closeSorted=[...s.close].sort((a,b)=>b.sold-a.sold);
      const prospSorted=[...s.prospect].sort((a,b)=>b.sold-a.sold);
      const closePos=myClose?closeSorted.findIndex(x=>x.name===myClose.name)+1:0;
      const prospPos=myProspect?prospSorted.findIndex(x=>x.name===myProspect.name)+1:0;

      let html='';
      // HERO — primary faceta
      const primary=isCloser?(myClose||{visits:0,applied:0,approved:0,sold:0}):(myProspect||{visits:0,applied:0,approved:0,sold:0,profit:0});
      const primaryPos=isCloser?closePos:prospPos;
      const poolN=isCloser?s.close.length:s.prospect.length;
      html+=`
        <div class="hero">
          <div class="hero-top">
            <div><div class="hero-name">${escapeHtml(me.name)}</div><div class="hero-role">${isCloser?'Closer':'Setter'} · ${periodLabel()}</div></div>
            <div class="hero-rank"><div class="pos">#${primaryPos||'—'}</div><div class="lbl">de ${poolN} ${isCloser?'closers':'setters'}</div></div>
          </div>
          <div class="hero-kpis">
            <div class="hero-stat"><div class="v">${primary.visits}</div><div class="k">${isCloser?'Visitas atendidas':'Visitas traídas'}</div></div>
            <div class="hero-stat"><div class="v">${primary.applied}</div><div class="k">Aplicaron</div><div class="c">${pct(primary.applied,primary.visits).toFixed(0)}%</div></div>
            <div class="hero-stat"><div class="v">${primary.approved}</div><div class="k">Aprobados</div><div class="c">${pct(primary.approved,primary.applied).toFixed(0)}%</div></div>
            <div class="hero-stat"><div class="v" style="color:#34d399;">${fmtShare(primary.sold)}</div><div class="k">Ventas</div><div class="c">${pct(primary.sold,primary.approved).toFixed(0)}% cierre</div></div>
          </div>
          <button class="hero-cta" onclick="openMyDetail()">Ver mi producción completa →</button>
        </div>`;

      // CLOSER → cierre funnel + prospección propia
      if(isCloser&&myClose){
        html+=funnelCard('Tu cierre',myClose,'close','Visitas que atendiste (propias, de setters y walk-ins)',me.name);
        html+=convCard(myClose,'close');
        const prosp=myProspect||{name:me.name,visits:0,applied:0,approved:0,sold:0,profit:0};
        html+=funnelCard('Tu prospección',prosp,'prospect','Tus llamadas, citas y visitas self-gen',me.name);
      }
      // SETTER → prospección funnel + qué closers atendieron
      if(!isCloser){
        const prosp=myProspect||{name:me.name,visits:0,applied:0,approved:0,sold:0,profit:0};
        html+=funnelCard('Tu prospección',prosp,'prospect','Llamadas, citas, visitas que trajiste y su conversión',me.name);
        if(myProspect)html+=convCard(myProspect,'prospect');
        html+=closersForSetter(s.reports,me.name);
      }
      // Self-report (accountability) — agent declares what they think they did vs the truth
      html+=selfReportCard();
      host.innerHTML=html;
      // Render any charts queued
      drawQueuedCharts();
    }

    // ===== Self-report: agent declares, system compares to truth =====
    function todayISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}

    function selfReportCard(){
      const today=todayISO();
      const mine=(window._selfReports||[]).find(s=>s.agent_name&&s.agent_name.toLowerCase()===me.name.toLowerCase()&&s.report_date===today);
      // Truth for TODAY (dialer live + today's Sales Report)
      const dl=dialerFor(me.name);
      const todayReports=allReports.filter(r=>r.date===today&&(filterLoc==='all'||r.location===filterLoc));
      let tVisits=0,tApplied=0,tApproved=0,tSold=0;
      const ln=me.name.toLowerCase();
      todayReports.forEach(r=>(r.visits||[]).forEach(v=>{
        const c1=clean(v.closer),c2=clean(v.closer2),st=clean(v.setter);
        const isMine=(c1&&c1.toLowerCase()===ln)||(c2&&c2.toLowerCase()===ln)||(st&&st.toLowerCase()===ln);
        if(isMine){tVisits++;if(v.applied===true)tApplied++;if(v.result==='approved')tApproved++;if(v.sale===true)tSold++;}
      }));
      // NOTE: dl.calls/appointments are for the selected period, not strictly today — labeled as such
      const rows=[
        {k:'calls',lbl:'Llamadas',truth:dl.calls,truthLbl:'dialer (periodo)'},
        {k:'appointments',lbl:'Citas agendadas',truth:dl.appointments,truthLbl:'calendario (periodo)'},
        {k:'visits',lbl:'Visitas',truth:tVisits,truthLbl:'reporte hoy'},
        {k:'applied',lbl:'Aplicaron',truth:tApplied,truthLbl:'reporte hoy'},
        {k:'approved',lbl:'Aprobados',truth:tApproved,truthLbl:'reporte hoy'},
        {k:'sold',lbl:'Ventas',truth:tSold,truthLbl:'reporte hoy'}
      ];
      return `<div class="section-card" style="border:1.5px solid #fde68a;background:#fffdf5;">
        <h3>🙋 ¿Cuánto crees que hiciste hoy?</h3>
        <p class="section-sub">Escribe lo que crees y compáralo con lo real. Las diferencias nos dicen qué ajustar.</p>
        <div class="table-wrap"><table>
          <thead><tr><th>Métrica</th><th>Lo que crees</th><th>Lo real</th><th>Diferencia</th></tr></thead>
          <tbody>${rows.map(r=>{
            const declared=mine?mine[r.k]:null;
            const diff=declared!=null?declared-r.truth:null;
            const diffStr=diff===null?'—':(diff>0?'+'+diff+' (de más)':diff<0?diff+' (de menos)':'✓ igual');
            const diffCol=diff===null?'var(--gray-400)':diff===0?'var(--green)':'var(--red)';
            return `<tr>
              <td style="font-weight:600;">${r.lbl}</td>
              <td><input type="number" id="sr-${r.k}" value="${declared!=null?declared:''}" min="0" style="width:70px;padding:5px 8px;border:1.5px solid var(--gray-300);border-radius:7px;font-family:inherit;"></td>
              <td class="val-strong">${r.truth} <span style="font-size:10px;color:var(--gray-400);font-weight:400;">${r.truthLbl}</span></td>
              <td style="color:${diffCol};font-weight:700;">${diffStr}</td>
            </tr>`;
          }).join('')}</tbody>
        </table></div>
        <button onclick="saveSelfReport()" id="sr-save-btn" style="margin-top:12px;padding:10px 18px;background:var(--primary);color:white;border:none;border-radius:9px;font-weight:700;cursor:pointer;font-family:inherit;">${mine?'Actualizar mi declaración':'Guardar mi declaración'}</button>
        <span id="sr-save-msg" style="margin-left:10px;font-size:13px;color:var(--green);"></span>
      </div>`;
    }

    async function saveSelfReport(){
      const val=k=>{const el=document.getElementById('sr-'+k);return el&&el.value!==''?parseInt(el.value):null;};
      const payload={
        agent_name:me.name,report_date:todayISO(),
        calls:val('calls'),appointments:val('appointments'),visits:val('visits'),
        applied:val('applied'),approved:val('approved'),sold:val('sold'),
        submitted_at:new Date().toISOString()
      };
      const btn=document.getElementById('sr-save-btn');const msg=document.getElementById('sr-save-msg');
      btn.disabled=true;btn.textContent='Guardando…';
      try{
        const res=await fetch(`${SUPA_URL}/rest/v1/ar_agent_self_report?on_conflict=agent_name,report_date`,{
          method:'POST',headers:{...SUPA_HEADERS,Prefer:'resolution=merge-duplicates,return=minimal'},
          body:JSON.stringify(payload)
        });
        if(!res.ok)throw new Error(await res.text());
        // refresh self reports + re-render to update diffs
        const sr=await fetch(`${SUPA_URL}/rest/v1/ar_agent_self_report?select=*`,{headers:SUPA_HEADERS});
        window._selfReports=await sr.json();
        msg.textContent='✓ Guardado';
        render();
      }catch(e){msg.style.color='var(--red)';msg.textContent='Error: '+e.message;}
      finally{btn.disabled=false;}
    }

    let _chartQueue=[];
    function drawQueuedCharts(){
      _chartQueue.forEach(({id,opts})=>{const el=document.getElementById(id);if(el&&typeof ApexCharts!=='undefined'){el.innerHTML='';new ApexCharts(el,opts).render();}});
      _chartQueue=[];
    }

    function funnelCard(title,o,kind,sub,agentName){
      const isClose=kind==='close';
      const tag=isClose?'<span class="tag close">cierre</span>':'<span class="tag prospect">prospección</span>';
      const dl=dialerFor(agentName||(o.name));
      // Top-of-funnel (dialer) only makes sense on prospección or a closer's own prospecting.
      // On the CLOSE funnel we don't show calls (those belong to prospecting); show appointments as context only.
      const showTop=kind==='prospect';
      const stages=[
        ...(showTop?[
          {name:'Llamadas',val:dl.calls,color:'#0ea5e9',isDialer:true},
          {name:'Citas agendadas',val:dl.appointments,conv:pct(o.visits,dl.appointments),color:'#6366f1',isDialer:true,convLbl:'show rate'},
        ]:[]),
        {name:isClose?'Visitas atendidas':'Visitas',val:o.visits,color:'#3b82f6'},
        {name:'Aplicaron',val:o.applied,conv:pct(o.applied,o.visits),color:'#06b6d4'},
        {name:'Aprobados',val:o.approved,conv:pct(o.approved,o.applied),color:'#8b5cf6'},
        {name:'Ventas',val:o.sold,conv:pct(o.sold,o.approved),color:'#10b981'}
      ];
      const max=Math.max(showTop?dl.calls:o.visits,o.visits,1);
      return `<div class="section-card">
        <h3>${title}${tag}</h3>
        <p class="section-sub">${sub}${showTop?' · llamadas y citas en vivo del dialer':''}</p>
        ${stages.map(st=>{
          const w=Math.max(pct(st.val,max),4);
          const convTxt=st.conv!==undefined?(st.convLbl?st.convLbl+' '+st.conv.toFixed(0)+'%':'↓'+st.conv.toFixed(0)+'%'):'';
          return `<div class="funnel-stage"><div class="name">${st.name}${st.isDialer?' <span style="font-size:9px;color:#0ea5e9;font-weight:700;">●</span>':''}</div><div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${st.color};">${fmtShare(st.val)}</div></div><div class="conv">${convTxt}</div></div>`;
        }).join('')}
        ${o.profit!==undefined&&o.profit>0?`<div style="margin-top:12px;padding-top:10px;border-top:1px dashed var(--gray-200);font-size:13px;color:var(--gray-600);">Monto total generado: <b style="color:var(--green);">${fmtMoney(o.profit)}</b></div>`:''}
        ${showTop&&!window._dialerOk?`<div style="margin-top:8px;font-size:11px;color:var(--gray-400);">Dialer offline — llamadas/citas mostradas como 0</div>`:''}
      </div>`;
    }

    function convCard(o,kind){
      const v2a=pct(o.applied,o.visits),a2ap=pct(o.approved,o.applied),ap2s=pct(o.sold,o.approved),v2s=pct(o.sold,o.visits);
      return `<div class="section-card">
        <h3>Tus conversiones</h3>
        <p class="section-sub">Qué tan eficiente eres en cada paso del embudo</p>
        <div class="conv-grid">
          <div class="conv-chip"><div class="pct ${pctCls(v2a,60,40)}">${v2a.toFixed(0)}%</div><div class="lbl">Visita → Aplicó</div><div class="num">${o.applied}/${o.visits}</div></div>
          <div class="conv-chip"><div class="pct ${pctCls(a2ap,45,30)}">${a2ap.toFixed(0)}%</div><div class="lbl">Aplicó → Aprobó</div><div class="num">${o.approved}/${o.applied}</div></div>
          <div class="conv-chip"><div class="pct ${pctCls(ap2s,75,50)}">${ap2s.toFixed(0)}%</div><div class="lbl">Aprobó → Venta</div><div class="num">${fmtShare(o.sold)}/${o.approved}</div></div>
          <div class="conv-chip"><div class="pct ${pctCls(v2s,20,10)}">${v2s.toFixed(0)}%</div><div class="lbl">Visita → Venta</div><div class="num">${fmtShare(o.sold)}/${o.visits}</div></div>
        </div>
      </div>`;
    }

    function closersForSetter(reports,setterName){
      const map={};
      reports.forEach(r=>(r.visits||[]).forEach(v=>{
        if(clean(v.setter)&&clean(v.setter).toLowerCase()===setterName.toLowerCase()){
          const c=clean(v.closer)||'Sin asignar';
          if(!map[c])map[c]={visits:0,sold:0};
          map[c].visits++;if(v.sale===true)map[c].sold++;
        }
      }));
      const rows=Object.entries(map).sort((a,b)=>b[1].visits-a[1].visits);
      if(!rows.length)return '';
      return `<div class="section-card">
        <h3>Quién atendió tus visitas</h3>
        <p class="section-sub">Los closers que recibieron las visitas que trajiste</p>
        <div class="table-wrap"><table><thead><tr><th>Closer</th><th>Visitas</th><th>Ventas</th><th>Conv.</th></tr></thead>
        <tbody>${rows.map(([c,d])=>`<tr><td class="agent-name-cell">${escapeHtml(c)}</td><td>${d.visits}</td><td class="val-strong">${d.sold}</td><td class="pct ${pctCls(pct(d.sold,d.visits),20,10)}">${pct(d.sold,d.visits).toFixed(0)}%</td></tr>`).join('')}</tbody></table></div>
      </div>`;
    }

    // ===== Leaderboards =====
    function setLbTab(t){lbTab=t;lbSort={key:'sold',dir:-1};
      document.querySelectorAll('#lb-tabs .tab').forEach(b=>b.classList.toggle('active',b.dataset.lt===t));renderLeaderboards(buildStats());}
    function lbSortBy(k){if(lbSort.key===k)lbSort.dir*=-1;else{lbSort.key=k;lbSort.dir=-1;}renderLeaderboards(buildStats());}

    function renderLeaderboards(s){
      const host=document.getElementById('leaderboards');
      const pool=(lbTab==='closer'?s.close:s.prospect).map(a=>{const dl=dialerFor(a.name);return {...a,
        calls:dl.calls,appts:dl.appointments,
        v2a:pct(a.applied,a.visits),a2ap:pct(a.approved,a.applied),ap2s:pct(a.sold,a.approved),v2s:pct(a.sold,a.visits),
        showRate:pct(a.visits,dl.appointments)
      };}).filter(a=>a.visits>0||a.sold>0||a.calls>0);
      const sorted=[...pool].sort((a,b)=>{
        if(lbSort.key==='name')return lbSort.dir*String(a.name).localeCompare(String(b.name));
        return lbSort.dir*((a[lbSort.key]||0)-(b[lbSort.key]||0));
      });
      const head=lbTab==='closer'
        ?`<tr><th>#</th><th onclick="lbSortBy('name')">Closer</th><th onclick="lbSortBy('visits')">Vis. atend.</th><th onclick="lbSortBy('applied')">Aplic.</th><th onclick="lbSortBy('approved')">Aprob.</th><th onclick="lbSortBy('sold')">Ventas</th><th onclick="lbSortBy('ap2s')">Close%</th><th onclick="lbSortBy('v2s')">Vis→Venta</th><th onclick="lbSortBy('selfgen')">Self-gen</th><th onclick="lbSortBy('profit')">Monto</th><th></th></tr>`
        :`<tr><th>#</th><th onclick="lbSortBy('name')">Setter</th><th onclick="lbSortBy('calls')">Llam. 📞</th><th onclick="lbSortBy('appts')">Citas 📅</th><th onclick="lbSortBy('visits')">Visitas</th><th onclick="lbSortBy('showRate')">Show%</th><th onclick="lbSortBy('sold')">Ventas</th><th onclick="lbSortBy('v2s')">Vis→Vta</th><th onclick="lbSortBy('profit')">Monto</th><th></th></tr>`;
      const body=sorted.length?sorted.map((a,i)=>{
        const isMe=a.name.toLowerCase()===me.name.toLowerCase();
        const rc=i===0?'top1':i===1?'top2':i===2?'top3':'';
        const clickAttr=`onclick="openAgentDetail('${escapeAttr(a.name)}','${lbTab}')"`;
        const nameLink=`<span style="color:var(--blue);text-decoration:underline;text-underline-offset:2px;">${escapeHtml(a.name)}</span>${isMe?' 👈':''}`;
        const openCell=`<td style="color:var(--blue);font-weight:800;font-size:16px;">›</td>`;
        if(lbTab==='closer'){
          return `<tr class="clickable-row ${isMe?'me':''}" ${clickAttr}><td class="rank-num ${rc}">${i+1}</td><td class="agent-name-cell">${nameLink}</td><td>${a.visits}</td><td>${a.applied}</td><td>${a.approved}</td><td class="val-strong">${fmtShare(a.sold)}</td><td class="pct ${pctCls(a.ap2s,75,50)}">${a.ap2s.toFixed(0)}%</td><td class="pct ${pctCls(a.v2s,20,10)}">${a.v2s.toFixed(0)}%</td><td>${fmtShare(a.selfgen)}</td><td>${fmtMoney(a.profit)}</td>${openCell}</tr>`;
        }else{
          return `<tr class="clickable-row ${isMe?'me':''}" ${clickAttr}><td class="rank-num ${rc}">${i+1}</td><td class="agent-name-cell">${nameLink}</td><td style="color:#0ea5e9;font-weight:600;">${a.calls||0}</td><td style="color:#6366f1;font-weight:600;">${a.appts||0}</td><td>${a.visits}</td><td class="pct ${pctCls(a.showRate,40,20)}">${a.appts>0?a.showRate.toFixed(0)+'%':'—'}</td><td class="val-strong">${a.sold}</td><td class="pct ${pctCls(a.v2s,20,10)}">${a.v2s.toFixed(0)}%</td><td>${fmtMoney(a.profit)}</td>${openCell}</tr>`;
        }
      }).join(''):`<tr><td class="empty" colspan="10">Sin datos en este periodo</td></tr>`;

      host.innerHTML=`
        <div class="section-card">
          <div class="tabs" id="lb-tabs">
            <button class="tab ${lbTab==='closer'?'active':''}" data-lt="closer" onclick="setLbTab('closer')">Closers (cierre)</button>
            <button class="tab ${lbTab==='setter'?'active':''}" data-lt="setter" onclick="setLbTab('setter')">Setters (prospección)</button>
          </div>
          <p class="section-sub">${lbTab==='closer'?'Efectividad atendiendo visitas (propias, de setters y walk-ins)':'Efectividad prospectando: cuántas de sus visitas convierten'} · click columna para ordenar</p>
          <div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px;color:#1e40af;font-weight:600;">👆 Toca cualquier persona para abrir su producción completa — históricos, citas, evolución, de dónde vienen sus visitas y ventas</div>
          <div id="lb-chart" style="margin-bottom:10px;"></div>
          <div class="table-wrap"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>
        </div>`;

      // Top-10 sales chart
      const top=sorted.slice(0,10);
      if(top.length&&typeof ApexCharts!=='undefined'){
        mountChart('lb-chart',{
          chart:{type:'bar',height:Math.max(180,top.length*30+40),toolbar:{show:false},fontFamily:'inherit'},
          series:[{name:'Ventas',data:top.map(a=>+(a.sold).toFixed(1))}],
          xaxis:{categories:top.map(a=>a.name)},
          plotOptions:{bar:{horizontal:true,borderRadius:4,distributed:true,barHeight:'62%'}},
          colors:['#3b82f6','#10b981','#f59e0b','#8b5cf6','#e94560','#06b6d4','#f97316','#84cc16','#ec4899','#a855f7'],

          legend:{show:false},grid:{borderColor:'#e5e7eb',strokeDashArray:3}
        });
      }
    }

    // ===== AGENT DETAIL DRILL-DOWN =====
    let dtAgg='week'; // day | week | month
    let dtContext=null; // {name, facet}

    function openAgentDetail(name,lbTabOrFacet){
      // facet: 'close' for closers leaderboard, 'prospect' for setters
      const facet=lbTabOrFacet==='setter'?'prospect':lbTabOrFacet==='closer'?'close':lbTabOrFacet;
      dtContext={name,facet};
      document.getElementById('detail-overlay').classList.add('show');
      renderAgentDetail();
    }
    function openMyDetail(){
      const facet=(me.role==='closer')?'close':'prospect';
      openAgentDetail(me.name,facet);
    }
    function closeDetail(){document.getElementById('detail-overlay').classList.remove('show');dtContext=null;}
    function setDtAgg(m){dtAgg=m;renderAgentDetail();}

    function isoWeekKey(dateISO){
      const d=new Date(dateISO+'T00:00:00');
      const day=(d.getDay()+6)%7; // Mon=0
      d.setDate(d.getDate()-day+3);
      const firstThu=new Date(d.getFullYear(),0,4);
      const week=1+Math.round(((d-firstThu)/86400000-3+((firstThu.getDay()+6)%7))/7);
      return `${d.getFullYear()}-S${String(week).padStart(2,'0')}`;
    }
    function periodKey(dateISO){
      if(dtAgg==='day')return dateISO;
      if(dtAgg==='week')return isoWeekKey(dateISO);
      return dateISO.slice(0,7); // month YYYY-MM
    }
    function periodNice(key){
      const mn=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
      if(dtAgg==='day'){const[y,m,d]=key.split('-');return `${d}/${m}`;}
      if(dtAgg==='week'){const[y,w]=key.split('-S');return `S${w} '${y.slice(2)}`;}
      const[y,m]=key.split('-');return `${mn[+m-1]} '${y.slice(2)}`;
    }

    // Build a closer/setter detail dataset (facet) with temporal series + origin
    function buildAgentDetail(name,facet){
      const reports=allReports.filter(r=>inPeriod(r.date)&&(filterLoc==='all'||r.location===filterLoc));
      const ln=name.toLowerCase();
      const byPeriod={}; // key -> {visits,applied,approved,sold}
      const origin={visits:{cc:0,own:0,walk:0,other:0},sold:{cc:0,own:0,walk:0,other:0}};
      const tot={visits:0,applied:0,approved:0,sold:0,profit:0};
      const eP=k=>byPeriod[k]||(byPeriod[k]={visits:0,applied:0,approved:0,sold:0});

      reports.forEach(r=>{
        (r.visits||[]).forEach(v=>{
          const setter=clean(v.setter),c1=clean(v.closer),c2=clean(v.closer2);
          const sb=v.scheduled_by, selfgen=sb==='Self-gen'||v.subgen===true;
          let mine=false, soldShare=0;
          if(facet==='close'){
            const isC1=c1&&c1.toLowerCase()===ln, isC2=c2&&c2.toLowerCase()===ln;
            if(isC1||isC2){mine=true;
              if(v.sale===true)soldShare=(c1&&c2)?0.5:1;}
          }else{ // prospect
            let prospector=setter||(selfgen&&c1?c1:null);
            if(prospector&&prospector.toLowerCase()===ln){mine=true;if(v.sale===true)soldShare=1;}
          }
          if(!mine)return;
          const k=periodKey(r.date);const p=eP(k);
          p.visits++;tot.visits++;
          if(v.applied===true){p.applied++;tot.applied++;}
          if(v.result==='approved'){p.approved++;tot.approved++;}
          if(v.sale===true){p.sold+=soldShare;tot.sold+=soldShare;tot.profit+=(soldShare===0.5?(v.net_profit||0)/2:(v.net_profit||0));}
          // Origin (only meaningful for closer facet — where visits come from)
          let org=setter?'cc':selfgen?'own':sb==='Walk-in'?'walk':'other';
          origin.visits[org]++;
          if(v.sale===true)origin.sold[org]+=soldShare;
        });
      });
      const keys=Object.keys(byPeriod).sort();
      return {byPeriod,keys,origin,tot};
    }

    function renderAgentDetail(){
      if(!dtContext)return;
      const {name,facet}=dtContext;
      const d=buildAgentDetail(name,facet);
      const isClose=facet==='close';
      document.getElementById('dt-name').textContent=name;
      document.getElementById('dt-role').textContent=(isClose?'Cierre — visitas atendidas':'Prospección — visitas traídas')+' · '+periodLabel();

      const nP=d.keys.length||1;
      const avgLbl={day:'día',week:'semana',month:'mes'}[dtAgg];
      const v2a=pct(d.tot.applied,d.tot.visits),a2ap=pct(d.tot.approved,d.tot.applied),ap2s=pct(d.tot.sold,d.tot.approved),v2s=pct(d.tot.sold,d.tot.visits);

      let html='';
      // Mode toggle
      html+=`<div class="mode-toggle">
        ${['day','week','month'].map(m=>`<button class="filter-tab ${dtAgg===m?'active':''}" onclick="setDtAgg('${m}')">${{day:'Diario',week:'Semanal',month:'Mensual'}[m]}</button>`).join('')}
      </div>`;

      // Averages
      html+=`<div class="avg-grid">
        <div class="avg-card"><div class="v">${(d.tot.visits/nP).toFixed(1)}</div><div class="k">Visitas/${avgLbl}</div></div>
        <div class="avg-card"><div class="v">${(d.tot.applied/nP).toFixed(1)}</div><div class="k">Aplican/${avgLbl}</div></div>
        <div class="avg-card"><div class="v">${(d.tot.sold/nP).toFixed(1)}</div><div class="k">Ventas/${avgLbl}</div></div>
        <div class="avg-card"><div class="v" style="color:var(--green);">${fmtMoney(d.tot.profit)}</div><div class="k">Monto total</div></div>
      </div>`;

      // Conversions
      html+=`<div class="section-card"><h3>Conversiones</h3>
        <div class="conv-grid">
          <div class="conv-chip"><div class="pct ${pctCls(v2a,60,40)}">${v2a.toFixed(0)}%</div><div class="lbl">Visita → Aplicó</div><div class="num">${d.tot.applied}/${d.tot.visits}</div></div>
          <div class="conv-chip"><div class="pct ${pctCls(a2ap,45,30)}">${a2ap.toFixed(0)}%</div><div class="lbl">Aplicó → Aprobó</div><div class="num">${d.tot.approved}/${d.tot.applied}</div></div>
          <div class="conv-chip"><div class="pct ${pctCls(ap2s,75,50)}">${ap2s.toFixed(0)}%</div><div class="lbl">Aprobó → Venta</div><div class="num">${fmtShare(d.tot.sold)}/${d.tot.approved}</div></div>
          <div class="conv-chip"><div class="pct ${pctCls(v2s,20,10)}">${v2s.toFixed(0)}%</div><div class="lbl">Visita → Venta</div><div class="num">${fmtShare(d.tot.sold)}/${d.tot.visits}</div></div>
        </div></div>`;

      // Trend chart
      html+=`<div class="section-card"><h3>Tu evolución (${{day:'por día',week:'por semana',month:'por mes'}[dtAgg]})</h3>
        <p class="section-sub">Cómo cambia tu producción en el tiempo</p>
        <div id="dt-trend"></div></div>`;

      // Historical grid — period by period with running accumulated total
      const keysDesc=[...d.keys].reverse(); // most recent first
      // pre-compute accumulated sales from oldest → newest
      const acc={};let cV=0,cAp=0,cApr=0,cS=0;
      d.keys.forEach(k=>{const p=d.byPeriod[k];cV+=p.visits;cAp+=p.applied;cApr+=p.approved;cS+=p.sold;
        acc[k]={v:cV,ap:cAp,apr:cApr,s:cS};});
      const histRows=keysDesc.map(k=>{
        const p=d.byPeriod[k];const a=acc[k];
        const v2a=pct(p.applied,p.visits),ap2s=pct(p.sold,p.approved),v2s=pct(p.sold,p.visits);
        return `<tr>
          <td style="font-weight:700;">${periodNice(k)}</td>
          <td>—</td><td>—</td>
          <td>${p.visits}</td><td>${p.applied}</td><td>${p.approved}</td>
          <td class="val-strong">${fmtShare(p.sold)}</td>
          <td class="pct ${pctCls(v2a,60,40)}">${v2a.toFixed(0)}%</td>
          <td class="pct ${pctCls(ap2s,75,50)}">${ap2s.toFixed(0)}%</td>
          <td class="pct ${pctCls(v2s,20,10)}">${v2s.toFixed(0)}%</td>
          <td style="color:var(--gray-500);">${fmtShare(a.s)}</td>
        </tr>`;
      }).join('');
      html+=`<div class="section-card"><h3>Histórico ${{day:'diario',week:'semanal',month:'mensual'}[dtAgg]}</h3>
        <p class="section-sub">Cada ${avgLbl} en detalle · última columna = acumulado de ventas hasta ese ${avgLbl}</p>
        <div class="table-wrap"><table>
          <thead><tr><th>${dtAgg==='day'?'Día':dtAgg==='week'?'Semana':'Mes'}</th><th>Llam.</th><th>Citas</th><th>Visitas</th><th>Aplic.</th><th>Aprob.</th><th>Ventas</th><th>V→A</th><th>Ap→V</th><th>V→Vta</th><th>Acum.</th></tr></thead>
          <tbody>${histRows||'<tr><td colspan="11" class="empty">Sin datos</td></tr>'}</tbody>
          <tfoot><tr style="border-top:2px solid var(--gray-300);font-weight:800;">
            <td>TOTAL</td><td>—</td><td>—</td><td>${d.tot.visits}</td><td>${d.tot.applied}</td><td>${d.tot.approved}</td><td>${fmtShare(d.tot.sold)}</td>
            <td class="pct">${v2a.toFixed(0)}%</td><td class="pct">${ap2s.toFixed(0)}%</td><td class="pct">${v2s.toFixed(0)}%</td><td>${fmtMoney(d.tot.profit)}</td>
          </tr></tfoot>
        </table></div>
        <p style="font-size:11px;color:var(--gray-400);margin-top:8px;">Llamadas y Citas se llenan al conectar el WaveDialer</p>
      </div>`;

      // Origin (closer facet only — where visits/sales come from)
      if(isClose){
        html+=`<div class="section-card"><h3>De dónde vienen tus visitas y ventas</h3>
          <p class="section-sub">Call Center (setter) vs Propias (self-gen) vs Walk-in</p>
          <div class="donut-grid"><div id="dt-origin-v"></div><div id="dt-origin-s"></div></div></div>`;
      }else{
        // setter: which closers
        html+=`<div class="section-card"><h3>A qué closers fueron tus visitas</h3>
          <div class="donut-grid"><div id="dt-origin-v"></div><div id="dt-origin-s"></div></div></div>`;
      }

      document.getElementById('dt-body').innerHTML=html;

      // Charts
      if(typeof ApexCharts==='undefined')return;
      // Trend
      const cats=d.keys.map(periodNice);
      mountChart('dt-trend',{
        chart:{type:'line',height:250,toolbar:{show:false},fontFamily:'inherit'},
        series:[
          {name:'Visitas',type:'column',data:d.keys.map(k=>d.byPeriod[k].visits)},
          {name:'Ventas',type:'line',data:d.keys.map(k=>+d.byPeriod[k].sold.toFixed(1))}
        ],
        stroke:{width:[0,3],curve:'smooth'},colors:['#cbd5e1','#10b981'],
        xaxis:{categories:cats,labels:{style:{fontSize:'10px'}}},
        yaxis:[{title:{text:'Visitas',style:{fontSize:'10px'}}},{opposite:true,title:{text:'Ventas',style:{fontSize:'10px'}}}],
        plotOptions:{bar:{borderRadius:3,columnWidth:'55%'}},markers:{size:4},
        dataLabels:{enabled:false},legend:{position:'top'},grid:{borderColor:'#e5e7eb',strokeDashArray:3}
      });

      // Origin donuts
      if(isClose){
        const ov=d.origin.visits, os=d.origin.sold;
        const labels=['Call Center','Propias','Walk-in','Otra'];
        const vData=[ov.cc,ov.own,ov.walk,ov.other], sData=[os.cc,os.own,os.walk,os.other];
        const colors=['#3b82f6','#10b981','#f97316','#94a3b8'];
        donut('dt-origin-v','Visitas por origen',labels,vData,colors);
        donut('dt-origin-s','Ventas por origen',labels,sData.map(x=>+x.toFixed(1)),colors);
      }else{
        // closers for setter
        const reports=allReports.filter(r=>inPeriod(r.date)&&(filterLoc==='all'||r.location===filterLoc));
        const cmap={};const ln=name.toLowerCase();
        reports.forEach(r=>(r.visits||[]).forEach(v=>{
          const st=clean(v.setter);if(st&&st.toLowerCase()===ln){const c=clean(v.closer)||'Sin asignar';
            cmap[c]=cmap[c]||{v:0,s:0};cmap[c].v++;if(v.sale===true)cmap[c].s++;}
        }));
        const ents=Object.entries(cmap).sort((a,b)=>b[1].v-a[1].v).slice(0,8);
        donut('dt-origin-v','Visitas por closer',ents.map(e=>e[0]),ents.map(e=>e[1].v),null);
        donut('dt-origin-s','Ventas por closer',ents.map(e=>e[0]),ents.map(e=>e[1].s),null);
      }
    }

    function donut(id,title,labels,data,colors){
      const el=document.getElementById(id);if(!el)return;
      const filtered=labels.map((l,i)=>[l,data[i]]).filter(x=>x[1]>0);
      if(!filtered.length){el.innerHTML=`<div style="text-align:center;padding:20px;color:var(--gray-400);font-size:12px;">${title}: sin datos</div>`;return;}
      mountChart(id,{
        chart:{type:'donut',height:240,fontFamily:'inherit'},
        series:filtered.map(x=>x[1]),labels:filtered.map(x=>x[0]),
        colors:colors||['#3b82f6','#10b981','#f59e0b','#8b5cf6','#e94560','#06b6d4','#f97316','#94a3b8'],
        legend:{position:'bottom',fontSize:'11px'},
        title:{text:title,style:{fontSize:'12px',fontWeight:700,color:'#334155'}},
        dataLabels:{enabled:true,formatter:(v,o)=>o.w.config.series[o.seriesIndex]},
        plotOptions:{pie:{donut:{size:'58%'}}}
      });
    }

    const _charts={};
    function mountChart(id,opts){
      const el=document.getElementById(id);if(!el)return;
      if(_charts[id]){try{_charts[id].destroy();}catch(e){}}
      el.innerHTML='';const c=new ApexCharts(el,opts);_charts[id]=c;c.render();
    }

    function escapeAttr(s){return String(s??'').replace(/&/g,'&amp;').replace(/'/g,'&#39;').replace(/"/g,'&quot;');}
    function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  </script>
</body>
</html>
